<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>メモアプリ（テスト）</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0e14;
  --bg-secondary: #0d1117;
  --bg-card: #151b23;
  --bg-card-hover: #1a2230;
  --bg-input: #1a2230;
  --border: #253040;
  --border-light: #1e2a38;
  --text-primary: #e8edf4;
  --text-secondary: #8b95a5;
  --text-muted: #5c6878;
  --accent: #FF8FAB;
  --accent-dark: #E91E63;
  --accent-green: #42c760;
  --accent-red: #f85149;
  --accent-blue: #5aadff;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.light {
  --bg-primary: #FFF0F3;
  --bg-secondary: #FFE8ED;
  --bg-card: #FFFFFF;
  --bg-card-hover: #FFF5F7;
  --bg-input: #FFF5F7;
  --border: #F5C6D0;
  --border-light: #FADADD;
  --text-primary: #37474F;
  --text-secondary: #607080;
  --text-muted: #90A0B0;
  --accent: #E91E63;
  --accent-dark: #C2185B;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Screens ── */
.screen { display: none; }
.screen.active { display: flex; }

/* ── Login ── */
#loginScreen {
  flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100dvh; padding: 24px; text-align: center;
}
.login-heart { font-size: 48px; margin-bottom: 16px; }
.login-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
.login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }
.login-input {
  width: 100%; max-width: 280px; padding: 14px 18px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--bg-input); color: var(--text-primary);
  font-size: 16px; font-family: inherit; outline: none; text-align: center;
  transition: border-color var(--transition);
}
.login-input:focus { border-color: var(--accent); }
.login-input::placeholder { color: var(--text-muted); }
.login-btn {
  margin-top: 16px; padding: 14px 48px; border: none; border-radius: var(--radius);
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all var(--transition);
}
.login-btn:active { transform: scale(0.96); }
.login-error { color: var(--accent-red); font-size: 13px; margin-top: 12px; min-height: 20px; }

/* ── Name Select ── */
#nameScreen {
  flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100dvh; padding: 24px; text-align: center;
}
.name-title { font-size: 20px; font-weight: 600; margin-bottom: 32px; }
.name-buttons { display: flex; gap: 16px; }
.name-btn {
  padding: 20px 36px; border: 2px solid var(--border); border-radius: var(--radius-lg);
  background: var(--bg-card); color: var(--text-primary); font-size: 18px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all var(--transition); min-width: 120px;
}
.name-btn:active { transform: scale(0.96); }
.name-btn:hover { border-color: var(--accent); background: var(--bg-card-hover); }

/* ── App Shell ── */
#appScreen { flex-direction: column; min-height: 100vh; min-height: 100dvh; }

/* ── Header ── */
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--bg-secondary);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
}
.app-header-left { display: flex; align-items: center; gap: 10px; }
.app-title { font-size: 15px; font-weight: 700; color: var(--accent); }
.days-counter { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.app-header-right { display: flex; align-items: center; gap: 8px; }
.theme-toggle {
  background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px;
  border-radius: 8px; transition: all var(--transition); color: var(--text-secondary);
}
.theme-toggle:active { background: var(--border-light); }
.user-badge {
  font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px;
  background: rgba(255,143,171,0.15); color: var(--accent);
}

/* ── Content ── */
.app-content { flex: 1; overflow-y: auto; padding: 12px 12px 100px; }

/* ── Bottom Nav ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 900;
  background: rgba(10,14,20,0.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.light .bottom-nav { background: rgba(255,240,243,0.94); }
.bottom-nav-inner { display: flex; justify-content: space-around; max-width: 400px; margin: 0 auto; }
.nav-tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--text-muted); text-decoration: none; font-size: 10px; font-weight: 500;
  padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: all var(--transition);
  background: none; border: none; font-family: inherit;
}
.nav-tab:active { background: var(--border-light); }
.nav-tab .nav-icon { font-size: 20px; }
.nav-tab.active { color: var(--accent); }

/* ── FAB ── */
.fab {
  position: fixed; bottom: calc(64px + env(safe-area-inset-bottom)); right: 16px; z-index: 800;
  width: 52px; height: 52px; border-radius: 50%; border: none;
  background: var(--accent); color: #fff; font-size: 28px; font-weight: 300;
  cursor: pointer; box-shadow: 0 4px 16px rgba(255,143,171,0.4);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.fab:active { transform: scale(0.9); }

/* ── Swipeable Cards ── */
.swipe-container {
  position: relative; overflow: hidden; border-radius: var(--radius); margin-bottom: 8px;
}
.swipe-actions {
  position: absolute; top: 0; right: 0; bottom: 0; display: flex; align-items: stretch;
  z-index: 1;
}
.swipe-action {
  display: flex; align-items: center; justify-content: center; width: 72px;
  border: none; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: inherit; flex-direction: column; gap: 2px;
}
.swipe-action-icon { font-size: 18px; }
.swipe-action.complete { background: var(--accent-green); }
.swipe-action.uncomplete { background: var(--accent-blue); }
.swipe-action.delete { background: var(--accent-red); }
.item-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; cursor: pointer;
  transition: transform 0.2s ease; position: relative; z-index: 2;
}
.item-card:active { background: var(--bg-card-hover); }
.item-card-header { display: flex; align-items: center; gap: 8px; }
.item-card-title { font-size: 14px; font-weight: 500; flex: 1; }
.item-card-title.checked { text-decoration: line-through; color: var(--text-muted); }
.item-card-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.item-card-meta span { display: inline-flex; align-items: center; gap: 3px; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--border);
}
.status-dot.checked { border-color: var(--accent-green); background: var(--accent-green); }

/* PC: hover action buttons */
.pc-actions {
  display: none; align-items: center; gap: 4px; margin-left: auto; flex-shrink: 0;
}
.pc-action {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-input); color: var(--text-secondary); font-size: 11px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: all var(--transition); white-space: nowrap;
}
.pc-action:hover { border-color: var(--text-muted); color: var(--text-primary); }
.pc-action.complete:hover { border-color: var(--accent-green); color: var(--accent-green); }
.pc-action.uncomplete:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
.pc-action.delete { color: var(--accent-red); border-color: transparent; }
.pc-action.delete:hover { border-color: var(--accent-red); }
.pc-action.confirm-delete { background: var(--accent-red); color: #fff; border-color: var(--accent-red); animation: pulse-delete 0.3s ease; }
@keyframes pulse-delete { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

.delete-btn {
  background: var(--accent-red); color: #fff; border: none; padding: 6px 12px;
  border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
}

/* ── Filter Chips ── */
/* ── 支出予測 サマリー ── */
.exp-summary { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.exp-sum-main { display: flex; justify-content: space-between; align-items: baseline; }
.exp-sum-label { font-size: 12px; color: var(--text-muted); }
.exp-sum-total { font-size: 24px; font-weight: 800; color: var(--accent); }
.exp-sum-sub { display: flex; gap: 16px; margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
.exp-sum-sub b { color: var(--text-primary); font-weight: 700; margin-left: 4px; }
.exp-sum-cats { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light); font-size: 12px; color: var(--text-secondary); }
.exp-sum-cat { display: inline-flex; align-items: center; gap: 4px; }
.exp-sum-cat b { color: var(--text-primary); font-weight: 700; margin-left: 2px; }

.filter-bar { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
.filter-chip {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; font-family: inherit; transition: all var(--transition);
}
.filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Section header ── */
.section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.section-title:first-child { margin-top: 0; }
.clear-btn {
  font-size: 11px; color: var(--accent-red); background: none; border: none; cursor: pointer;
  font-family: inherit; font-weight: 500; float: right; padding: 2px 8px;
}

/* ── Calendar ── */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-title { font-size: 18px; font-weight: 700; }
.cal-nav {
  background: none; border: none; color: var(--text-secondary); font-size: 20px;
  cursor: pointer; padding: 8px 12px; border-radius: 8px; font-family: inherit;
  transition: all var(--transition);
}
.cal-nav:active { background: var(--border-light); }
.cal-filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.cal-filter-toggle {
  padding: 5px 12px; border-radius: 16px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); font-size: 11px; font-weight: 500;
  cursor: pointer; white-space: nowrap; font-family: inherit; transition: all var(--transition);
}
.cal-filter-toggle.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; margin-bottom: 16px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 6px 0; }
.cal-dow:first-child { color: var(--accent-red); }
.cal-dow:last-child { color: var(--accent-blue); }
.cal-day {
  padding: 2px; border-radius: 6px; font-size: 12px; font-weight: 500;
  cursor: pointer; position: relative; min-height: 56px; display: flex; flex-direction: column;
  align-items: stretch; transition: all var(--transition);
  color: var(--text-primary); overflow: hidden;
}
.cal-day-num {
  text-align: center; font-size: 12px; font-weight: 600; line-height: 1;
  padding: 2px 0; margin-bottom: 1px;
}
.cal-day:active { background: var(--border-light); }
.cal-day.other-month { opacity: 0.3; }
.cal-day.today .cal-day-num {
  background: var(--accent); color: #fff; font-weight: 700;
  border-radius: 50%; width: 22px; height: 22px; line-height: 22px;
  margin: 0 auto 1px; padding: 0;
}
.cal-day.selected { outline: 2px solid var(--accent); border-radius: 6px; }
.cal-day.sun .cal-day-num { color: var(--accent-red); }
.cal-day.sat .cal-day-num { color: var(--accent-blue); }
.cal-day.today .cal-day-num { color: #fff; }
.cal-item {
  font-size: 9px; line-height: 1.3; padding: 1px 3px; margin-bottom: 1px;
  border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-weight: 500;
}
.cal-item.type-event { background: rgba(90,173,255,0.2); color: #5aadff; }
.cal-item.type-shopping { background: rgba(255,152,0,0.2); color: #ff9800; }
.cal-item.type-todo { background: rgba(156,39,176,0.2); color: #ce93d8; }
.cal-item.type-anniversary { background: rgba(255,143,171,0.15); color: var(--accent); }
.cal-item.checked-item { opacity: 0.4; text-decoration: line-through; }
.cal-more { font-size: 9px; color: var(--text-muted); text-align: center; }
/* Mobile: dots instead of text labels */
.cal-dots { display: none; flex-wrap: wrap; gap: 2px; justify-content: center; padding: 1px 0; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; }
.cal-dot.type-event { background: #5aadff; }
.cal-dot.type-shopping { background: #ff9800; }
.cal-dot.type-todo { background: #ce93d8; }
.cal-dot.type-anniversary { background: var(--accent); }
.cal-dot.checked-item { opacity: 0.3; }

/* Calendar slide animation */
.cal-grid.slide-left { animation: calSlideLeft 0.25s ease; }
.cal-grid.slide-right { animation: calSlideRight 0.25s ease; }
@keyframes calSlideLeft {
  0% { opacity: 0; transform: translateX(40px); }
  100% { opacity: 1; transform: translateX(0); }
}
@keyframes calSlideRight {
  0% { opacity: 0; transform: translateX(-40px); }
  100% { opacity: 1; transform: translateX(0); }
}

@media (max-width: 767px) {
  .cal-item { display: none !important; }
  .cal-more { display: none !important; }
  .cal-dots { display: flex; }
  .cal-day { min-height: 44px; }
}
.light .cal-item.type-event { background: rgba(33,150,243,0.12); color: #1976D2; }
.light .cal-item.type-shopping { background: rgba(255,152,0,0.12); color: #E65100; }
.light .cal-item.type-todo { background: rgba(156,39,176,0.12); color: #7B1FA2; }
.light .cal-item.type-anniversary { background: rgba(233,30,99,0.1); color: #C2185B; }

.cal-events { margin-top: 8px; }
.cal-event-date { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
.cal-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.cal-legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); }
.cal-legend-dot { width: 8px; height: 8px; border-radius: 2px; }
.anniversary-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px;
  background: rgba(255,143,171,0.12); color: var(--accent); font-size: 12px; font-weight: 500;
  margin-bottom: 6px;
}
.cal-detail-card {
  background: var(--bg-card); border-left: 3px solid; border-radius: 0 var(--radius) var(--radius) 0;
  padding: 10px 14px; cursor: pointer; transition: transform 0.2s ease; position: relative; z-index: 2;
}
.cal-detail-card:active { background: var(--bg-card-hover); }
.cal-events .swipe-container { margin-bottom: 6px; border-radius: 0 var(--radius) var(--radius) 0; }
.cal-detail-card.type-event { border-color: #5aadff; }
.cal-detail-card.type-shopping { border-color: #ff9800; }
.cal-detail-card.type-todo { border-color: #ce93d8; }
.cal-detail-card.type-anniversary { border-color: var(--accent); }
.light .cal-detail-card.type-event { border-color: #1976D2; }
.light .cal-detail-card.type-shopping { border-color: #E65100; }
.light .cal-detail-card.type-todo { border-color: #7B1FA2; }

/* ── Free Memo ── */
.memo-container { display: flex; gap: 12px; height: calc(100vh - 160px); min-height: 300px; }
.memo-column { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.memo-column-header {
  font-size: 13px; font-weight: 600; text-align: center; padding: 8px;
  border-radius: var(--radius) var(--radius) 0 0; color: #fff;
}
.memo-column-header.left { background: #e88da3; }
.memo-column-header.right { background: #5aadff; }
.light .memo-column-header.left { background: #E91E63; }
.light .memo-column-header.right { background: #1976D2; }
.memo-textarea {
  flex: 1; width: 100%; padding: 12px; border: 1px solid var(--border);
  border-top: none; border-radius: 0 0 var(--radius) var(--radius);
  background: var(--bg-card); color: var(--text-primary); font-size: 14px;
  font-family: inherit; line-height: 1.8; resize: none; outline: none;
  transition: border-color var(--transition);
}
.memo-textarea:focus { border-color: var(--accent); }
.memo-textarea::placeholder { color: var(--text-muted); }
.memo-status { font-size: 11px; color: var(--text-muted); text-align: center; padding: 6px; }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-end;
  backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; animation: fadeIn 0.15s ease; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px;
  width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close {
  background: none; border: none; color: var(--text-muted); font-size: 22px;
  cursor: pointer; padding: 4px 8px; border-radius: var(--radius);
}
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions button { flex: 1; }
.btn-primary {
  padding: 12px; border: none; border-radius: var(--radius); background: var(--accent);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.btn-secondary {
  padding: 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text-primary); font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: inherit;
}
.btn-danger {
  padding: 12px; border: none; border-radius: var(--radius); background: var(--accent-red);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
}

/* ── Form ── */
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-input); color: var(--text-primary); font-size: 14px; font-family: inherit;
  outline: none; transition: border-color var(--transition);
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 60px; }
.form-select { appearance: none; cursor: pointer; }
.form-row { display: flex; gap: 8px; }
.form-row .form-group { flex: 1; }

/* ── Empty State ── */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 40px; margin-bottom: 8px; }
.empty-state-text { font-size: 13px; }

/* ── Responsive ── */
@media (min-width: 768px) {
  .app-content { max-width: 600px; margin: 0 auto; padding: 20px 20px 100px; }
  .modal { border-radius: var(--radius-lg); align-self: center; }
  .item-card:hover { background: var(--bg-card-hover); }
  .swipe-container:hover .pc-actions { display: flex; }
  .swipe-actions { display: none; }
}
@media (min-width: 1024px) {
  body { display: flex; }
  .side-nav {
    display: flex !important; flex-direction: column; width: 200px; min-height: 100vh;
    background: var(--bg-secondary); border-right: 1px solid var(--border); padding: 20px 12px;
    position: fixed; left: 0; top: 0; bottom: 0;
  }
  .side-nav-title { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 4px; padding: 0 8px; }
  .side-nav-days { font-size: 11px; color: var(--text-muted); margin-bottom: 20px; padding: 0 8px; }
  .side-nav-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--radius);
    color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all var(--transition); background: none; border: none; width: 100%; font-family: inherit; text-align: left;
  }
  .side-nav-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
  .side-nav-item.active { background: rgba(255,143,171,0.1); color: var(--accent); }
  .side-nav-item .nav-icon { font-size: 16px; }
  .side-nav-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
  #appScreen { margin-left: 200px; }
  .app-header { display: none !important; }
  .bottom-nav { display: none !important; }
  .fab { bottom: 24px; }
  .app-content { max-width: 700px; padding: 24px 24px 80px; }
}
.side-nav { display: none; }
</style>
</head>
<body>

    <button class="side-nav-item" onclick="switchTab('memo')"><span class="nav-icon">✏️</span>メモ</button>
    <button class="side-nav-item" onclick="switchTab('expenses')"><span class="nav-icon">💰</span>支出予測</button>
    <div class="side-nav-bottom">
      <button class="side-nav-item" onclick="toggleTheme()"><span class="nav-icon" id="sideThemeIcon">🌙</span>テーマ切替</button>
      <button class="side-nav-item" onclick="doLogout()"><span class="nav-icon">🚪</span>ログアウト</button>
    </div>
  </nav>

  <!-- Header (mobile) -->
  <header class="app-header">
    <div class="app-header-left">
      <span class="app-title">メモ（テスト）</span>

    </div>
    <div class="app-header-right">
      <span class="user-badge" id="userBadge"></span>

  <!-- Tab Content -->

      <button class="nav-tab active" onclick="switchTab('calendar')"><span class="nav-icon">📅</span>カレンダー</button>
      <button class="nav-tab" onclick="switchTab('list')"><span class="nav-icon">📋</span>リスト</button>
      <button class="nav-tab" onclick="switchTab('places')"><span class="nav-icon">📍</span>場所</button>
      <button class="nav-tab" onclick="switchTab('memo')"><span class="nav-icon">✏️</span>メモ</button>
      <button class="nav-tab" onclick="switchTab('expenses')"><span class="nav-icon">💰</span>支出</button>
    </div>

</div>

<!-- Modal -->

      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// ── Config ──
firebase.initializeApp({
  apiKey: "AIzaSyD8o-Ca5r6uLOdkJnTVBkt3XXQ9Wdc5lkk",
  authDomain: "aritomo-memo.firebaseapp.com",
  databaseURL: "https://aritomo-memo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aritomo-memo",
  storageBucket: "aritomo-memo.firebasestorage.app",
  messagingSenderId: "608761131258",
  appId: "1:608761131258:web:8537f715b597981d301943"
});
var db = firebase.database();
var auth = firebase.auth();
var SHARED_EMAIL = 'aritomo@test.app';

// ── Anniversary Data (hardcoded) ──
var ANNIVERSARIES = [
  { name: '朝輝 誕生日', month: 7, day: 2, emoji: '🎂' },
  { name: '有彩 誕生日', month: 2, day: 11, emoji: '🎂' },
  { name: '交際記念日', month: 3, day: 16, emoji: '💕' },
  { name: '婚約記念日', month: 3, day: 5, emoji: '💍' },
  // { name: '結婚記念日', month: 11, day: 22, emoji: '💒' }, // 予定
  { name: 'バレンタイン', month: 2, day: 14, emoji: '🍫' },
  { name: 'ホワイトデー', month: 3, day: 14, emoji: '🍬' },
  { name: 'クリスマス', month: 12, day: 25, emoji: '🎄' }
];
var START_DATE = new Date(2025, 2, 16); // 2025-03-16

// ── State ──
var currentTab = 'calendar';
var currentUser = localStorage.getItem('aritomo_user') || '';
var calYear, calMonth, calSelectedDate;
var listData = [], eventsData = [], placesData = [], expensesData = [];
var memoData = { ariha: '', asahi: '' };
var expenseFilter = 'all';
var memoSaveTimer = null;
var listFilter = 'all';
var calHideCompleted = true;

// ── Auth ──
auth.onAuthStateChanged(function(user) {
  if (user) {
    if (currentUser) { showApp(); } else { showScreen('nameScreen'); }
  } else {
    showScreen('loginScreen');
  }
});

function doLogin() {
  var pw = document.getElementById('passwordInput').value;
  var err = document.getElementById('loginError');
  err.textContent = '';
  auth.signInWithEmailAndPassword(SHARED_EMAIL, pw).catch(function(e) {
    err.textContent = 'パスワードが違います';
  });
}
document.getElementById('passwordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

function doLogout() {
  auth.signOut();
}

function selectName(name) {
  currentUser = name;
  localStorage.setItem('aritomo_user', name);
  showApp();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

// ── Theme ──
var isDark = localStorage.getItem('aritomo_theme') === 'dark';
applyTheme();
function toggleTheme() {
  isDark = !isDark;
  localStorage.setItem('aritomo_theme', isDark ? 'dark' : 'light');
  applyTheme();
}
function applyTheme() {
  document.body.classList.toggle('light', !isDark);
  var icon = isDark ? '🌙' : '☀️';
  var t = document.getElementById('themeToggle'); if (t) t.textContent = icon;
  var s = document.getElementById('sideThemeIcon'); if (s) s.textContent = icon;
  var mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.content = isDark ? '#0a0e14' : '#FFF0F3';
}

// ── Days Counter ──
function getDaysCount() {
  var now = new Date(); now.setHours(0,0,0,0);
  var start = new Date(START_DATE); start.setHours(0,0,0,0);
  return Math.floor((now - start) / 86400000) + 1;
}

// ── Show App ──
function showApp() {
  showScreen('appScreen');
  var days = getDaysCount();
  var daysText = days + '日目';
  var hd = document.getElementById('headerDays'); if (hd) hd.textContent = daysText;
  var sd = document.getElementById('sideNavDays'); if (sd) sd.textContent = daysText;
  var ub = document.getElementById('userBadge'); if (ub) ub.textContent = currentUser;

  var now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  calSelectedDate = formatDate(now);

  startListeners();
  renderTab();
}

// ── Firebase Listeners ──
var listenersStarted = false;
function startListeners() {
  if (listenersStarted) return;
  listenersStarted = true;
  db.ref('events').on('value', function(snap) {
    eventsData = [];
    snap.forEach(function(c) { eventsData.push(Object.assign({ id: c.key }, c.val())); });
    if (currentTab === 'calendar') renderTab();
  });
  db.ref('list').on('value', function(snap) {
    listData = [];
    snap.forEach(function(c) { listData.push(Object.assign({ id: c.key }, c.val())); });
    if (currentTab === 'list' || currentTab === 'calendar') renderTab();
  });
  db.ref('places').on('value', function(snap) {
    placesData = [];
    snap.forEach(function(c) { placesData.push(Object.assign({ id: c.key }, c.val())); });
    if (currentTab === 'places' || currentTab === 'calendar') renderTab();
  });
  db.ref('memo').on('value', function(snap) {
    var val = snap.val() || {};
    memoData = { ariha: val.ariha || '', asahi: val.asahi || '' };
    if (currentTab === 'memo') {
      var ta1 = document.getElementById('memoAriha');
      var ta2 = document.getElementById('memoAsahi');
      if (ta1 && document.activeElement !== ta1) ta1.value = memoData.ariha;
      if (ta2 && document.activeElement !== ta2) ta2.value = memoData.asahi;
    }
  });
  db.ref('expenses').on('value', function(snap) {
    expensesData = [];
    snap.forEach(function(c) { expensesData.push(Object.assign({ id: c.key }, c.val())); });
    if (currentTab === 'expenses') renderTab();
  });
}

// ── Tab Switching ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.nav-tab').forEach(function(t) {
    var tabPattern = tab === 'calendar' ? /カレンダー/ : tab === 'list' ? /リスト/ : tab === 'memo' ? /メモ/ : tab === 'expenses' ? /支出/ : /場所/;
    if (t.textContent.trim().match(tabPattern)) t.classList.add('active');
  });
  document.querySelectorAll('.side-nav-item').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.side-nav-item').forEach(function(t) {
    var sidePattern = tab === 'calendar' ? /カレンダー/ : tab === 'list' ? /リスト/ : tab === 'memo' ? /メモ/ : tab === 'expenses' ? /支出/ : /行きたい/;
    if (t.textContent.trim().match(sidePattern)) t.classList.add('active');
  });
  renderTab();
}

// ── Render ──
function renderTab() {
  var c = document.getElementById('appContent');
  var fab = document.getElementById('fab');
  if (currentTab === 'calendar') { renderCalendar(c); fab.style.display = ''; }
  else if (currentTab === 'list') { renderList(c); fab.style.display = ''; }
  else if (currentTab === 'places') { renderPlaces(c); fab.style.display = ''; }
  else if (currentTab === 'memo') { renderMemo(c); fab.style.display = 'none'; }
  else if (currentTab === 'expenses') { renderExpenses(c); fab.style.display = ''; }
}

// ── Calendar ──
function getItemsForDate(dateStr, month, day) {
  var items = [];
  // Anniversaries
  ANNIVERSARIES.forEach(function(a) {
    if (a.month === month && a.day === day) {
      items.push({ type: 'anniversary', title: a.emoji + ' ' + a.name, data: a });
    }
  });
  // Events
  eventsData.filter(function(e) { return e.date === dateStr; }).forEach(function(e) {
    items.push({ type: 'event', title: e.title, data: e, checked: false });
  });
  // List items with date
  listData.filter(function(i) { return i.date === dateStr; }).forEach(function(i) {
    items.push({ type: i.category === 'shopping' ? 'shopping' : 'todo', title: i.name, data: i, checked: !!i.checked });
  });
  return items;
}

function renderCalendar(container) {
  var html = '<div class="cal-header">';
  html += '<button class="cal-nav" onclick="calNav(-1)">&lsaquo;</button>';
  html += '<span class="cal-title">' + calYear + '年 ' + (calMonth + 1) + '月</span>';
  html += '<button class="cal-nav" onclick="calNav(1)">&rsaquo;</button>';
  html += '</div>';

  // Legend + filter
  html += '<div class="cal-filter-bar">';
  html += '<div class="cal-legend">';
  html += '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:#5aadff"></span>予定</span>';
  html += '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:#ff9800"></span>買物</span>';
  html += '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:#ce93d8"></span>やること</span>';
  html += '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--accent)"></span>記念日</span>';
  html += '</div>';
  html += '<button class="cal-filter-toggle' + (calHideCompleted ? ' active' : '') + '" onclick="toggleCalFilter()">未完了のみ</button>';
  html += '</div>';

  html += '<div class="cal-grid" id="calGrid">';
  var dows = ['日','月','火','水','木','金','土'];
  for (var i = 0; i < 7; i++) html += '<div class="cal-dow">' + dows[i] + '</div>';

  var first = new Date(calYear, calMonth, 1);
  var startDay = first.getDay();
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  var prevDays = new Date(calYear, calMonth, 0).getDate();

  for (var d = 0; d < startDay; d++) {
    html += '<div class="cal-day other-month"><div class="cal-day-num">' + (prevDays - startDay + d + 1) + '</div></div>';
  }
  var today = formatDate(new Date());
  var MAX_ITEMS = 3;
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = formatDate(new Date(calYear, calMonth, d));
    var dow = new Date(calYear, calMonth, d).getDay();
    var cls = 'cal-day';
    if (dow === 0) cls += ' sun';
    if (dow === 6) cls += ' sat';
    if (dateStr === today) cls += ' today';
    if (dateStr === calSelectedDate) cls += ' selected';
    html += '<div class="' + cls + '" onclick="selectDate(\'' + dateStr + '\')">';
    html += '<div class="cal-day-num">' + d + '</div>';

    var allItems = getItemsForDate(dateStr, calMonth + 1, d);
    var visibleItems = calHideCompleted ? allItems.filter(function(it) { return !it.checked; }) : allItems;
    var shown = visibleItems.slice(0, MAX_ITEMS);
    // Desktop: text labels
    shown.forEach(function(it) {
      var itemCls = 'cal-item type-' + it.type;
      if (it.checked) itemCls += ' checked-item';
      html += '<div class="' + itemCls + '">' + esc(it.title) + '</div>';
    });
    if (visibleItems.length > MAX_ITEMS) {
      html += '<div class="cal-more">+' + (visibleItems.length - MAX_ITEMS) + '</div>';
    }
    // Mobile: colored dots
    if (visibleItems.length > 0) {
      html += '<div class="cal-dots">';
      visibleItems.forEach(function(it) {
        var dotCls = 'cal-dot type-' + it.type;
        if (it.checked) dotCls += ' checked-item';
        html += '<span class="' + dotCls + '"></span>';
      });
      html += '</div>';
    }
    html += '</div>';
  }
  var remaining = 7 - ((startDay + daysInMonth) % 7);
  if (remaining < 7) {
    for (var d = 1; d <= remaining; d++) {
      html += '<div class="cal-day other-month"><div class="cal-day-num">' + d + '</div></div>';
    }
  }
  html += '</div>';

  // Selected date detail
  if (calSelectedDate) {
    var parts = calSelectedDate.split('-');
    var selMonth = parseInt(parts[1]);
    var selDay = parseInt(parts[2]);
    var allDetailItems = getItemsForDate(calSelectedDate, selMonth, selDay);
    var detailItems = calHideCompleted ? allDetailItems.filter(function(it) { return !it.checked; }) : allDetailItems;

    html += '<div class="cal-events">';
    html += '<div class="cal-event-date">' + selMonth + '月' + selDay + '日</div>';

    if (detailItems.length === 0) {
      html += '<div class="empty-state"><div class="empty-state-text">予定なし</div></div>';
    }
    detailItems.forEach(function(it) {
      if (it.type === 'anniversary') {
        html += '<div class="anniversary-badge">' + it.data.emoji + ' ' + it.data.name + '</div> ';
      } else if (it.type === 'event') {
        var e = it.data;
        var place = e.placeRef ? placesData.find(function(p) { return p.id === e.placeRef; }) : null;
        html += '<div class="swipe-container" data-swipe="true">';
        html += '<div class="swipe-actions">';
        html += '<button class="swipe-action delete" onclick="event.stopPropagation();deleteEvent(\'' + e.id + '\')"><span class="swipe-action-icon">🗑</span>削除</button>';
        html += '</div>';
        html += '<div class="cal-detail-card type-event" onclick="openEditEvent(\'' + e.id + '\')">';
        html += '<div style="display:flex;align-items:center;gap:8px;">';
        html += '<div style="font-size:14px;font-weight:500;flex:1;">' + esc(e.title) + '</div>';
        html += '<div class="pc-actions">';
        html += '<button class="pc-action delete" onclick="event.stopPropagation();confirmDelete(this,\'event\',\'' + e.id + '\')">削除</button>';
        html += '</div>';
        html += '</div>';
        html += '<div class="item-card-meta">';
        if (e.time) html += '<span>🕐 ' + e.time + '</span>';
        if (place) html += '<span>📍 ' + esc(place.name) + '</span>';
        html += '<span>' + esc(e.createdBy) + '</span>';
        html += '</div>';
        if (e.memo) html += '<div class="item-card-meta"><span>' + esc(e.memo) + '</span></div>';
        html += '</div>';
        html += '</div>';
      } else {
        var item = it.data;
        var catLabel = it.type === 'shopping' ? '🛒' : '✅';
        var cLabel = item.checked ? '戻す' : '完了';
        var cClass = item.checked ? 'uncomplete' : 'complete';
        var cIcon = item.checked ? '↩' : '✓';
        html += '<div class="swipe-container" data-swipe="true">';
        html += '<div class="swipe-actions">';
        html += '<button class="swipe-action ' + cClass + '" onclick="event.stopPropagation();toggleListCheck(\'' + item.id + '\',' + !item.checked + ')"><span class="swipe-action-icon">' + cIcon + '</span>' + cLabel + '</button>';
        html += '<button class="swipe-action delete" onclick="event.stopPropagation();deleteListItem(\'' + item.id + '\')"><span class="swipe-action-icon">🗑</span>削除</button>';
        html += '</div>';
        html += '<div class="cal-detail-card type-' + it.type + '" onclick="openEditList(\'' + item.id + '\')">';
        html += '<div style="display:flex;align-items:center;gap:8px;">';
        html += '<div class="status-dot' + (item.checked ? ' checked' : '') + '"></div>';
        html += '<div style="font-size:14px;font-weight:500;flex:1;' + (item.checked ? 'text-decoration:line-through;color:var(--text-muted);' : '') + '">' + esc(item.name) + '</div>';
        html += '<span style="font-size:12px;">' + catLabel + '</span>';
        html += '<div class="pc-actions">';
        html += '<button class="pc-action ' + cClass + '" onclick="event.stopPropagation();toggleListCheck(\'' + item.id + '\',' + !item.checked + ')">' + cLabel + '</button>';
        html += '<button class="pc-action delete" onclick="event.stopPropagation();confirmDelete(this,\'list\',\'' + item.id + '\')">削除</button>';
        html += '</div>';
        html += '</div>';
        if (item.note) html += '<div class="item-card-meta" style="margin-top:4px;"><span>' + esc(item.note) + '</span></div>';
        html += '</div>';
        html += '</div>';
      }
    });
    html += '</div>';
  }

  container.innerHTML = html;
}

function toggleCalFilter() {
  calHideCompleted = !calHideCompleted;
  renderTab();
}

var calAnimDir = 0;
function calNav(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  calSelectedDate = null;
  calAnimDir = dir;
  renderTab();
  var grid = document.getElementById('calGrid');
  if (grid) {
    grid.classList.add(dir > 0 ? 'slide-left' : 'slide-right');
    grid.addEventListener('animationend', function() {
      grid.classList.remove('slide-left', 'slide-right');
    }, { once: true });
  }
  calAnimDir = 0;
}

function selectDate(dateStr) {
  calSelectedDate = dateStr;
  renderTab();
}

// ── List ──
function renderList(container) {
  var html = '<div class="filter-bar">';
  ['all', 'shopping', 'todo'].forEach(function(f) {
    var label = f === 'all' ? '全て' : f === 'shopping' ? '🛒 買物' : '✅ やること';
    html += '<button class="filter-chip' + (listFilter === f ? ' active' : '') + '" onclick="setListFilter(\'' + f + '\')">' + label + '</button>';
  });
  html += '</div>';

  var filtered = listData.filter(function(item) {
    if (listFilter === 'all') return true;
    return item.category === listFilter;
  });
  var unchecked = filtered.filter(function(item) { return !item.checked; });
  var checked = filtered.filter(function(item) { return item.checked; });

  unchecked.sort(function(a, b) {
    if (a.date && b.date) return a.date.localeCompare(b.date);
    if (a.date) return -1;
    if (b.date) return 1;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  if (unchecked.length === 0 && checked.length === 0) {
    html += '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">リストは空です</div></div>';

// ── Modals ──
function openModal(title, bodyHtml) {
  // Dismiss keyboard before showing modal to prevent layout issues on mobile
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// ── 支出予測 (Expenses) ──
var EXPENSE_CATS = [
  { key: 'moving', label: '引っ越し', icon: '🏠' },
  { key: 'furniture', label: '家具家電', icon: '🛋' },
  { key: 'other', label: 'その他', icon: '📦' }
];
function expenseCat(key) {
  for (var i = 0; i < EXPENSE_CATS.length; i++) { if (EXPENSE_CATS[i].key === key) return EXPENSE_CATS[i]; }
  return EXPENSE_CATS[2];
}
function fmtYen(n) { return '¥' + (Number(n) || 0).toLocaleString('ja-JP'); }

function renderExpenses(container) {
  var total = 0, remain = 0, done = 0;
  var catTotal = { moving: 0, furniture: 0, other: 0 };
  expensesData.forEach(function(e) {
    var amt = Number(e.amount) || 0;
    total += amt;
    if (e.purchased) done += amt; else remain += amt;
    if (catTotal[e.category] === undefined) catTotal.other += amt; else catTotal[e.category] += amt;
  });

  // サマリー (カテゴリ別合計)
  var html = '<div class="exp-summary">';
  html += '<div class="exp-sum-main"><span class="exp-sum-label">予定合計</span><span class="exp-sum-total">' + fmtYen(total) + '</span></div>';
  html += '<div class="exp-sum-sub"><span>未購入(残り予測) <b>' + fmtYen(remain) + '</b></span><span>購入済 <b>' + fmtYen(done) + '</b></span></div>';
  html += '<div class="exp-sum-cats">';
  EXPENSE_CATS.forEach(function(c) {
    html += '<span class="exp-sum-cat">' + c.icon + ' ' + c.label + '<b>' + fmtYen(catTotal[c.key]) + '</b></span>';
  });
  html += '</div></div>';

  // フィルタ
  html += '<div class="filter-bar">';
  html += '<button class="filter-chip' + (expenseFilter === 'all' ? ' active' : '') + '" onclick="setExpenseFilter(\'all\')">全て</button>';
  EXPENSE_CATS.forEach(function(c) {
    html += '<button class="filter-chip' + (expenseFilter === c.key ? ' active' : '') + '" onclick="setExpenseFilter(\'' + c.key + '\')">' + c.icon + ' ' + c.label + '</button>';
  });
  html += '</div>';

  var filtered = expensesData.filter(function(e) { return expenseFilter === 'all' ? true : e.category === expenseFilter; });
  var notyet = filtered.filter(function(e) { return !e.purchased; });
  var bought = filtered.filter(function(e) { return e.purchased; });
  notyet.sort(function(a, b) { return (Number(b.amount) || 0) - (Number(a.amount) || 0); });
  bought.sort(function(a, b) { return (Number(b.amount) || 0) - (Number(a.amount) || 0); });

  if (notyet.length === 0 && bought.length === 0) {
    html += '<div class="empty-state"><div class="empty-state-icon">💰</div><div class="empty-state-text">支出予定を追加しよう</div></div>';
  }
  notyet.forEach(function(e) { html += renderExpenseItem(e); });
  if (bought.length > 0) {
    html += '<div class="section-title">購入済み</div>';
    bought.forEach(function(e) { html += renderExpenseItem(e); });
  }
  container.innerHTML = html;
}

function renderExpenseItem(e) {
  var cat = expenseCat(e.category);
  var label = e.purchased ? '戻す' : '購入済';
  var klass = e.purchased ? 'uncomplete' : 'complete';
  var icon = e.purchased ? '↩' : '✓';
  var html = '<div class="swipe-container" data-swipe="true">';
  html += '<div class="swipe-actions">';
  html += '<button class="swipe-action ' + klass + '" onclick="event.stopPropagation();togglePurchased(\'' + e.id + '\',' + !e.purchased + ')"><span class="swipe-action-icon">' + icon + '</span>' + label + '</button>';
  html += '<button class="swipe-action delete" onclick="event.stopPropagation();deleteExpense(\'' + e.id + '\')"><span class="swipe-action-icon">🗑</span>削除</button>';
  html += '</div>';
  html += '<div class="item-card" onclick="openEditExpense(\'' + e.id + '\')">';
  html += '<div class="item-card-header">';
  html += '<div class="status-dot' + (e.purchased ? ' checked' : '') + '"></div>';
  html += '<div class="item-card-title' + (e.purchased ? ' checked' : '') + '">' + esc(e.name) + '</div>';
  html += '<span style="font-size:13px;font-weight:700;white-space:nowrap;">' + fmtYen(e.amount) + '</span>';
  html += '<div class="pc-actions">';
  html += '<button class="pc-action ' + klass + '" onclick="event.stopPropagation();togglePurchased(\'' + e.id + '\',' + !e.purchased + ')">' + label + '</button>';
  html += '<button class="pc-action delete" onclick="event.stopPropagation();confirmDelete(this,\'expense\',\'' + e.id + '\')">削除</button>';
  html += '</div></div>';
  html += '<div class="item-card-meta">';
  html += '<span>' + cat.icon + ' ' + cat.label + '</span>';
  html += '<span>' + esc(e.createdBy || '') + '</span>';
  if (e.note) html += '<span>' + esc(e.note) + '</span>';
  html += '</div></div></div>';
  return html;
}

  if (!e) return;
  var catOpts = '';
  EXPENSE_CATS.forEach(function(c) { catOpts += '<option value="' + c.key + '"' + (e.category === c.key ? ' selected' : '') + '>' + c.icon + ' ' + c.label + '</option>'; });
  var html = '<div class="form-group"><label class="form-label">品目名</label><input class="form-input" id="fName" value="' + esc(e.name) + '"></div>';
  html += '<div class="form-row"><div class="form-group"><label class="form-label">カテゴリ</label><select class="form-select" id="fCat">' + catOpts + '</select></div>';
  html += '<div class="form-group"><label class="form-label">予定金額(円)</label><input class="form-input" id="fAmount" type="number" inputmode="numeric" value="' + (Number(e.amount) || 0) + '"></div></div>';
  html += '<div class="form-group"><label class="form-label">メモ</label><textarea class="form-textarea" id="fNote">' + esc(e.note || '') + '</textarea></div>';
  html += '<div class="modal-actions"><button class="btn-danger" onclick="deleteExpense(\'' + id + '\')">削除</button><button class="btn-primary" onclick="saveExpense(\'' + id + '\')">更新</button></div>';
  openModal('支出予定を編集', html);
}

function deleteExpense(id) { db.ref('expenses/' + id).remove(); closeModal(); }

// ── Free Memo ──
function renderMemo(container) {
  var html = '<div class="memo-container">';
  html += '<div class="memo-column">';
  html += '<div class="memo-column-header left">有彩</div>';
  html += '<textarea class="memo-textarea" id="memoAriha" placeholder="自由にメモ..."' + (currentUser !== '有彩' ? ' readonly' : '') + ' oninput="saveMemo(\'ariha\')">' + esc(memoData.ariha) + '</textarea>';
  html += '</div>';
  html += '<div class="memo-column">';
  html += '<div class="memo-column-header right">朝輝</div>';
  html += '<textarea class="memo-textarea" id="memoAsahi" placeholder="自由にメモ..."' + (currentUser !== '朝輝' ? ' readonly' : '') + ' oninput="saveMemo(\'asahi\')">' + esc(memoData.asahi) + '</textarea>';
  html += '</div>';
  html += '</div>';
  html += '<div class="memo-status" id="memoStatus"></div>';
  container.innerHTML = html;
}

function saveMemo(key) {
  clearTimeout(memoSaveTimer);
  var statusEl = document.getElementById('memoStatus');
  if (statusEl) statusEl.textContent = '入力中...';
  memoSaveTimer = setTimeout(function() {
    var el = document.getElementById(key === 'ariha' ? 'memoAriha' : 'memoAsahi');
    if (!el) return;
    var update = {};
    update[key] = el.value;
    db.ref('memo').update(update).then(function() {
      if (statusEl) { statusEl.textContent = '保存しました'; setTimeout(function() { if (statusEl) statusEl.textContent = ''; }, 1500); }
    });
  }, 500);
}

// ── Calendar: Add list/event from calendar ──
// (FAB on calendar tab opens event add; list items can be added via event modal or list tab)

// ── Utilities ──
function formatDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function formatDateDisplay(dateStr) {
  if (!dateStr) return '';
  var p = dateStr.split('-');
  return parseInt(p[1]) + '/' + parseInt(p[2]);
}
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── PC: Delete confirmation (double-click pattern) ──
var deleteTimers = {};
function confirmDelete(btn, type, id) {
  var key = type + '_' + id;
  if (deleteTimers[key]) {
    clearTimeout(deleteTimers[key]);
    delete deleteTimers[key];
    if (type === 'list') deleteListItem(id);
    else if (type === 'place') deletePlace(id);
    else if (type === 'event') deleteEvent(id);
    else if (type === 'expense') deleteExpense(id);
    return;
  }
  btn.textContent = '本当に？';
  btn.classList.add('confirm-delete');
  deleteTimers[key] = setTimeout(function() {
    btn.textContent = '削除';
    btn.classList.remove('confirm-delete');
    delete deleteTimers[key];
  }, 2500);
}

// ── Swipe handling (mobile) ──
var activeSwipe = null;

function getSwipeThreshold(container) {
  var actions = container.querySelectorAll('.swipe-action');
  return actions.length * 72;
}

document.addEventListener('touchstart', function(e) {
  var container = e.target.closest('.swipe-container');
  if (!container) {
    closeAllSwipes();
    return;
  }
  var card = container.querySelector('.item-card, .cal-detail-card');
  var touch = e.touches[0];
  var threshold = getSwipeThreshold(container);
  container._swipe = {
    startX: touch.clientX,
    startY: touch.clientY,
    currentX: 0,
    locked: false,
    card: card,
    threshold: threshold
  };
}, { passive: true });

document.addEventListener('touchmove', function(e) {
  var container = e.target.closest('.swipe-container');
  if (!container || !container._swipe) return;
  var sw = container._swipe;
  var touch = e.touches[0];
  var dx = touch.clientX - sw.startX;
  var dy = touch.clientY - sw.startY;

  if (!sw.locked) {
    if (Math.abs(dy) > Math.abs(dx)) { container._swipe = null; return; }
    sw.locked = true;
  }

  e.preventDefault();
  var x = Math.max(-sw.threshold, Math.min(0, dx + sw.currentX));
  sw.card.style.transition = 'none';
  sw.card.style.transform = 'translateX(' + x + 'px)';
  sw._lastDx = dx;
}, { passive: false });

document.addEventListener('touchend', function(e) {
  var container = e.target.closest('.swipe-container');
  if (!container || !container._swipe) return;
  var sw = container._swipe;
  var dx = sw._lastDx || 0;
  var card = sw.card;
  card.style.transition = 'transform 0.2s ease';

  var threshold = getSwipeThreshold(e.target.closest('.swipe-container') || container);
  if (dx < -50) {
    card.style.transform = 'translateX(-' + threshold + 'px)';
    if (activeSwipe && activeSwipe !== container) closeSwipe(activeSwipe);
    activeSwipe = container;
    container._swipe.currentX = -threshold;
  } else {
    card.style.transform = 'translateX(0)';
    container._swipe.currentX = 0;
    if (activeSwipe === container) activeSwipe = null;
  }
  container._swipe = null;
}, { passive: true });

function closeSwipe(container) {
  var card = container.querySelector('.item-card, .cal-detail-card');
  if (card) {
    card.style.transition = 'transform 0.2s ease';
    card.style.transform = 'translateX(0)';
  }
  if (container._swipe) container._swipe.currentX = 0;
}
function closeAllSwipes() {
  if (activeSwipe) { closeSwipe(activeSwipe); activeSwipe = null; }
}

// ── Calendar swipe (month navigation) ──
var calSwipe = {};
document.addEventListener('touchstart', function(e) {
  if (!e.target.closest('.cal-grid') && !e.target.closest('.cal-header')) return;
  calSwipe.startX = e.touches[0].clientX;
  calSwipe.startY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', function(e) {
  if (!calSwipe.startX) return;
  if (!e.target.closest('.cal-grid') && !e.target.closest('.cal-header') && !e.target.closest('.cal-events')) {
    calSwipe = {};
    return;
  }
  var dx = e.changedTouches[0].clientX - calSwipe.startX;
  var dy = e.changedTouches[0].clientY - calSwipe.startY;
  calSwipe = {};
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    calNav(dx < 0 ? 1 : -1);
  }
}, { passive: true });
</script>
