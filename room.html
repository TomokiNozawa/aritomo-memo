// ★v2.5[7] ＋/−ズームボタン: タップ=1段 / 長押し=連続 (ピンチが苦手な場面用)
function zoomBy(f) {
  if (!camera || !controls) return;
  const off = camera.position.clone().sub(controls.target);
  const d = Math.max(controls.minDistance, Math.min(controls.maxDistance, off.length() * f));
  off.setLength(d);
  camera.position.copy(controls.target).add(off);
  controls.update();
}
let zoomHold = null;
function bindZoomButtons() {
  const bind = function (id, f) {
    const b = document.getElementById(id);
    if (!b) return;
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      zoomBy(f);
      clearInterval(zoomHold);
      zoomHold = setInterval(function () { zoomBy(Math.pow(f, 0.4)); }, 60);   // 長押しで連続ズーム
    });
    const stop = function () { clearInterval(zoomHold); zoomHold = null; };
    b.addEventListener('pointerup', stop);
    b.addEventListener('pointercancel', stop);
    b.addEventListener('pointerleave', stop);
  };
  bind('zoomInBtn', 0.8);
  bind('zoomOutBtn', 1.25);
}

// ═══════════════ 家具メッシュ (★v1.8 type別パラメトリック簡易モデル) ═══════════════
// 家具は THREE.Group。ローカル座標: x∈[-w/2,w/2], y∈[0,h] (床基準), z∈[-d/2,d/2] (背面=-z)。
// w/d/h/色/type が変わったら子パーツを組み直し、位置・回転は Group に適用する。
function itemTypeOf(it) {
  if (it.type) return it.type;
  const c = it.catalogId ? catalogData[it.catalogId] : null;
  return (c && c.type) || null;
}
// ★v5.3 メモ欄の役割分離。
//   specNote = 調査由来の内部スペック情報 (寸法根拠・耐荷重・部位寸法・設置条件…)。シードが持ち、UIのメモ欄には出さない。
//   memo     = ユーザーの自由入力欄 (既定は空)。
//   → 「◯◯kg」「34インチ」「Aerus」等をスペック文字列から拾っていた既存判定はすべてこの関数を通す
//      (memo が空になっても判定が壊れないよう specNote を連結する)。
function specTextOf(it) {
  if (!it) return '';
  let s = it.specNote || '';
  if (!s && it.catalogId && catalogData[it.catalogId]) s = catalogData[it.catalogId].specNote || '';
  return (it.name || '') + ' ' + s + ' ' + (it.memo || '');
}
// ★v2.3[9] 家具アイテム (リガーレ100KB / エトナ60OP) の引き出し・スライド棚 開閉シミュレーション部品を組み込む。
//          クリックプレート (前面) + 突き出しボックス (visible=false) を作り drawers レジストリに登録する。
//          id は itemId ベースで安定させ、寸法・色変更による組み直しでも開閉状態を引き継ぐ。
function itemDrawerSet(g, it, defs, ctx) {
  const iid = g.userData.itemId;
  if (!iid) return;
  const w = ctx.w, d = ctx.d, zF = d / 2;
  defs.forEach(function (def) {
    const bw = def.bw || (w - 8);                 // 引き出し幅 (ローカルx)
    const x0 = def.x0 || 0;                       // 中心x (リガーレ 下台左40cm/右60cm ユニットの中心)
    const yMid = def.y0 + def.rh / 2;
    const mkP = function (sx, sy, sz, px, py, pz, col) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(sx, 0.5), Math.max(sy, 0.5), Math.max(sz, 0.5)),
        new THREE.MeshLambertMaterial({ color: col }));
      m.position.set(px, py, pz);
      g.add(m);
      return m;
    };
    // クリックプレート (前面フラッシュ・本体色)
    const plate = mkP(bw, Math.max(def.rh, 6), 1.0, x0, yMid, zF + 0.35, ctx.base);
    const boxes = [];
    if (def.kind === 'drawer') {
      boxes.push(mkP(bw - 3, def.rh - 4, def.depth, x0, yMid, zF + def.depth / 2, ctx.dark.clone().lerp(ctx.base, 0.4)));
      boxes.push(mkP(bw, def.rh - 1.5, 1.6, x0, yMid, zF + def.depth + 0.6, ctx.base));            // 前板
      boxes.push(mkP(bw * 0.3, 1.8, 1.3, x0, def.y0 + def.rh - 3.2, zF + def.depth + 1.4, ctx.silver)); // ハンドル
    } else {
      boxes.push(mkP(bw, 2.2, def.depth, x0, yMid, zF + def.depth / 2, ctx.lite));                  // スライド板
      boxes.push(mkP(bw, 1.4, 1.0, x0, yMid, zF + def.depth + 0.4, ctx.silver));                    // 前縁
    }
    boxes.forEach(function (m) { m.visible = false; m.userData.drawerBox = true; });
    plate.userData.drawerId = boxes[0].userData.drawerId = boxes[1].userData.drawerId = regDrawer({
      id: 'i_' + iid + '_' + def.key, label: def.label, boxes: boxes, depth: def.depth, originOff: 0.6,
      rayFn: function () {
        g.updateMatrixWorld();
        const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(g.quaternion).normalize();
        return {
          origins: [g.localToWorld(new THREE.Vector3(x0, yMid, zF + 0.6)),
                    g.localToWorld(new THREE.Vector3(x0 - bw * 0.35, yMid, zF + 0.6)),
                    g.localToWorld(new THREE.Vector3(x0 + bw * 0.35, yMid, zF + 0.6))],
          dir: dir, exclude: g,
          labelPos: g.localToWorld(new THREE.Vector3(x0, def.y0 + def.rh + 12, zF + def.depth))
        };
      }
    });
  });
}

function buildItemParts(g, it) {
  const w = Math.max(Number(it.w) || 10, 2), d = Math.max(Number(it.d) || 10, 2), h = Math.max(Number(it.h) || 10, 2);
  const base = new THREE.Color(it.color || '#b9a488');
  const dark = base.clone().multiplyScalar(0.55);
  const lite = base.clone().lerp(new THREE.Color(0xffffff), 0.5);
  const P = function (sx, sy, sz, px, py, pz, col, opts) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(sx, 0.5), Math.max(sy, 0.5), Math.max(sz, 0.5)),
      new THREE.MeshLambertMaterial(Object.assign({ color: col }, opts || {})));
    m.position.set(px, py, pz);
    g.add(m);
    return m;
  };
  const CYL = function (r, sy, px, py, pz, col) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(r, 0.4), Math.max(r, 0.4), Math.max(sy, 0.5), 12),
      new THREE.MeshLambertMaterial({ color: col }));
    m.position.set(px, py, pz);
    g.add(m);
    return m;
  };
  const legs4 = function (t, lh, inset, col) {
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (q) {
      P(t, lh, t, q[0] * (w / 2 - inset), lh / 2, q[1] * (d / 2 - inset), col);
    });
  };
  // ★v3.7 同色の細バーの束 (金網・扉枠など) を1メッシュに束ねる。boxes=[[sx,sy,sz,px,py,pz], ...]
  //   キャットケージの金網は本数が要るのでメッシュ数がモバイルで効いてくる → まとめて描画コールを減らす
  const MERGE = function (boxes, col) {
    const parts = [];
    let n = 0;
    boxes.forEach(function (b) {
      const gm = new THREE.BoxGeometry(Math.max(b[0], 0.2), Math.max(b[1], 0.2), Math.max(b[2], 0.2)).toNonIndexed();
      gm.translate(b[3], b[4], b[5]);
      n += gm.attributes.position.count;
      parts.push(gm);
    });
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
    let o = 0;
    parts.forEach(function (p2) {
      pos.set(p2.attributes.position.array, o * 3);
      nor.set(p2.attributes.normal.array, o * 3);
      o += p2.attributes.position.count;
      p2.dispose();
    });
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    bg.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    bg.computeBoundingSphere();
    const m = new THREE.Mesh(bg, new THREE.MeshLambertMaterial({ color: col }));
    g.add(m);
    return m;
  };
  const type = itemTypeOf(it);
  const nm = specTextOf(it);            // ★v5.3 name + specNote + memo (memo が空でも判定が壊れない)

  if (type === 'bed') {
    // ★v2.0 フレームのみ (内蔵マットレス削除。マットレスは別商品として上に載せる運用)
    //        床面高 floorH (Aerus: 19.5⇔32 切替、既定32) にすのこ天面。ヘッドボード + 宮棚は従来通り
    const hbT = 11;
    const fh = Math.min(Math.max(Number(it.floorH) || 32, 10), Math.max(h - 10, 10));
    P(w, h, hbT, 0, h / 2, -d / 2 + hbT / 2, base);                       // ヘッドボード
    if (/Aerus|宮棚/.test(nm)) {
      P(w, 3, 8, 0, h - 1.5, -d / 2 + hbT + 4, base);                     // 宮棚 天板
      P(w - 6, 4, 6, 0, h - 8, -d / 2 + hbT + 3, dark);                   // 棚内段差
    }

    const mh = workItems[myId], mc = openCavityOf(mh);

      const pull = Math.sqrt(Math.pow(it.x - cp.x, 2) + Math.pow(it.z - cp.z, 2));

      }
      return null;                                   // 20cm 以上引き出した = 取り出し
    }
  }
  let best = null;
  Object.keys(workItems).forEach(function (oid) {
    if (oid === selfId || oid === myId) return;
    const ot = workItems[oid];
    const cav = openCavityOf(ot);
    if (!cav) return;
    const wc = cavityWorld(ot, cav);
    const m = 5;
    if (it.x < wc.minX - m || it.x > wc.maxX + m || it.z < wc.minZ - m || it.z > wc.maxZ + m) return;

function syncInsides(hostId) {
  const host = workItems[hostId];
  if (!host) return;
  const cav = openCavityOf(host);
  if (!cav) return;
  const wc = cavityWorld(host, cav);
  Object.keys(workItems).forEach(function (k) {
    const o = workItems[k];
    if (o.insideOf !== hostId) return;
    // ★v6.3 中央固定ではなく「収納内のローカル位置」を保ったまま追従する (複数入る + 中で動かせる)
    const lp = insideLocalOf(host, o);

    const cp = cavityClampPos(o, host, wc, wp.x, wp.z);

// ★v6.2 上方/前方の障害物を測る共通レイキャスト (自分自身と 開閉ボックスは除外)。

function scanObstacle(selfGroup, origins, dir, far) {
  const rc = new THREE.Raycaster();
  rc.far = far || 500;
  let best = null, name = null;
  origins.forEach(function (org) {
    rc.set(org, dir);
    const hits = rc.intersectObjects(scene.children, true);
    for (let i = 0; i < hits.length; i++) {
      const ob = hits[i].object;
      if (!ob.isMesh || ob.visible === false) continue;
      let p = ob, skip = false;
      while (p) {
        if (p === selfGroup || p.userData.drawerBox) { skip = true; break; }
        p = p.parent;
      }
      if (skip) continue;
      if (best === null || hits[i].distance < best) {
        best = hits[i].distance;
        name = null;
        let q = ob;
        while (q && !name) {
          const ud = q.userData || {};
          if (ud.itemId && workItems[ud.itemId]) name = workItems[ud.itemId].name || null;
          else if (ud.info) {
            name = String(typeof ud.info === 'string' ? ud.info : (ud.info.label || '')).split('(')[0].replace(/ ★.*/, '').trim() || null;
          }
          q = q.parent;
        }

      break;   // このレイの最初の有効ヒットのみ
    }

// ★v1.8 家具同士のめり込み防止: rotY90 を考慮した外接矩形 (AABB) + 高さ帯の重なり判定
function itemAabb(it) {

  const rot = ((Math.round((it.rotY || 0) / 90) * 90) % 360 + 360) % 360;

function collidesAny(selfId, it, ignoreIds) {
  return Object.keys(workItems).some(function (oid) {

    if (ignoreIds && ignoreIds[oid]) return false;   // ★v2.2[6] ドラッグ開始時から重なっている相手は免除
    return pairCollides(it, workItems[oid]);

// ★v1.9 家具同士だけでなく 部屋ポリゴン外・固定設備めり込み も無効扱い
function findFreeSpot(selfId, it) {
  if (!blockedAny(selfId, it)) return true;
  const ox = it.x, oz = it.z;
  for (let ring = 1; ring <= 14; ring++) {
    for (let k = 0; k < 16; k++) {
      const a = k * Math.PI / 8;
      it.x = ox + Math.cos(a) * ring * 15;
      it.z = oz + Math.sin(a) * ring * 15;
      clampItem(it);
      if (!blockedAny(selfId, it)) return true;
    }
  }
  it.x = ox; it.z = oz;
  clampItem(it);
  return false;

window.ejectInside = function () {
  const it = workItems[selectedItemId];
  if (!it || !it.insideOf) return;
  const host = workItems[it.insideOf], cav = host ? openCavityOf(host) : null;
  it.insideOf = null;
  clearInsideLocal(it);                // ★v6.3 収納内ローカル位置もクリア
  it.y = 0;
  if (cav) {
    const wc = cavityWorld(host, cav), fr = cavityFront(host), a = itemAabb(it);
    it.x += fr.fx * ((wc.maxX - wc.minX) / 2 + (a.maxX - a.minX) / 2 + 4);
    it.z += fr.fz * ((wc.maxZ - wc.minZ) / 2 + (a.maxZ - a.minZ) / 2 + 4);
  }
  clampItem(it);
  findFreeSpot(selectedItemId, it);
  const m = furnMeshes[selectedItemId];
  if (m) syncItemMesh(m, it);
  markDirty();
  openItemSheet();
  toast('🗑 ' + ((host && host.name) || '収納') + ' から取り出しました');
};

function bindSheetSwipe() {
  const sh = document.getElementById('itemSheet');
  let sw = null;
  sh.addEventListener('pointerdown', function (e) {
    if (!isTouchEvent(e)) return;
    // 入力・ボタン上からのスワイプは無視 (スクロール/操作優先)
    const tag = (e.target.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') return;
    const inHeader = !!e.target.closest('#itemSheetHeader, #itemPeekBar');
    if (!inHeader) return;   // 本文スクロールと競合しないようヘッダ/バー起点のみ
    sw = { y: e.clientY, done: false };
  });
  sh.addEventListener('pointermove', function (e) {
    if (!sw || sw.done || !isTouchEvent(e)) return;
    const dy = e.clientY - sw.y;
    if (dy < -28) { sw.done = true; window.expandItemSheet(); }        // 上スワイプ → 全開
    else if (dy > 28) {                                                 // 下スワイプ → 折りたたみ/閉じる
      sw.done = true;
      if (sh.classList.contains('peek')) deselect();
      else window.collapseItemSheet();
    }
  });
  const swEnd = function () { sw = null; };
  sh.addEventListener('pointerup', swEnd);
  sh.addEventListener('pointercancel', swEnd);
}

window.updItem = function (field, val) {
  const it = workItems[selectedItemId];
  if (!it) return;
  if (field === 'w' || field === 'd' || field === 'h') {
    if (it.catalogId) return;   // ★v1.9 カタログ由来は正式寸法のため変更不可
    const n = Number(val);
    if (!(n > 0)) return;
    it[field] = n;
    clampItem(it);
  } else if (field === 'y') {
    it.y = Math.max(Number(val) || 0, 0);
  } else {
    it[field] = val;
  }
  const m = furnMeshes[selectedItemId];
  if (m) syncItemMesh(m, it);
  syncMounts(isMountHost(it) ? selectedItemId : null);   // ★v4.1 アーム変更→追従 / マウント中モニターは位置を戻す (★v6.5 テレビスタンドも)
  if (field === 'name') {
    document.getElementById('itemSheetTitle').textContent = '🛋 ' + (it.name || '家具');
    document.getElementById('itemPeekTitle').textContent = '🛋 ' + (it.name || '家具');   // ★v2.5[5]
  }
  markDirty();
};

window.setBedFloorH = function (v) {

  if (!it || itemTypeOf(it) !== 'bed') return;
  it.floorH = Number(v);
  const m = furnMeshes[selectedItemId];
  if (m) syncItemMesh(m, it);
  Object.keys(workItems).forEach(function (oid) {
    const ot = workItems[oid];
    if (oid !== selectedItemId && isMattressItem(ot) && bedUnder(oid, ot) === it) {
      ot.y = bedFloorH(it);
      const om = furnMeshes[oid];
      if (om) syncItemMesh(om, ot);

  markDirty();
  openItemSheet();
  toast('床面高を ' + v + 'cm にしました');

// ★v4.1 モニターアームの VESA高さ (天板から画面中心まで)。公式 Lift 330mm の範囲。
//        live=true (スライダー操作中) は数値ラベルだけ更新して DOM は組み直さない (つまみが飛ぶため)
window.setVesaH = function (v, live) {
  const it = workItems[selectedItemId];
  if (!it || !isArmItem(it)) return;
  const mn = armMinVesaH(selectedItemId);   // マウント中モニターが天板に沈まない下限
  it.vesaH = Math.round(Math.min(Math.max(Number(v) || ARM.liftDef, mn), ARM.liftMax) * 2) / 2;
  const m = furnMeshes[selectedItemId];
  if (m) syncItemMesh(m, it);
  syncMounts(selectedItemId);          // マウント中モニターも追従
  markDirty();
  const lab = document.getElementById('vesaVal');
  if (lab) lab.textContent = it.vesaH;
  if (!live) {
    const mc = mountedCountOf(selectedItemId);
    toast('VESA高さを ' + it.vesaH + 'cm にしました' + (mc ? ' (モニター' + mc + '台も追従)' : ''));

// ★v6.5 テレビスタンドの TV取付高さ (床〜ブラケット上端)。公式 120〜170cm の 11段階 (5cmピッチ)。

// ═══════════════ 寸法ラベル (選択中家具の上に W×D×H) ═══════════════
const projV = new THREE.Vector3();
// ★v2.5[9] フレーム毎の DOM 書き込みは値が変わった時のみ (モバイル負荷軽減)

// ═══════════════ ★v2.5[2] 選択中家具の操作ハンドル (⊕移動 / ↻回転) ═══════════════
// 3D内ではなくスクリーン固定サイズの DOM ボタンを足元位置に投影配置 → カメラ距離によらず44px以上を保証
const gizmoV = new THREE.Vector3();
const gizmoCache = { show: null, mx: null, my: null };

function updateGizmos() {
  const mv = document.getElementById('gizmoMove');
  const rt = document.getElementById('gizmoRot');
  if (!mv || !rt) return;

    gizmoV.set(it.x, Math.max(0, Number(it.y) || 0), it.z).project(camera);

      const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
      mx = Math.max(28, Math.min(mx, w - 88));   // 画面外・回転ハンドルのはみ出し防止

function bindGizmos() {
  const mv = document.getElementById('gizmoMove');
  const rt = document.getElementById('gizmoRot');
  if (!mv || !rt) return;
  mv.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;

// ═══════════════ ポインタ操作 (視点/配置・ドラッグ移動・ツールチップ) ═══════════════
const raycaster = new THREE.Raycaster();
// ★v2.5[3] 細線・点要素の raycast 許容を拡大 (タッチでの取りこぼし対策)
raycaster.params.Line = Object.assign({}, raycaster.params.Line, { threshold: 6 });
raycaster.params.Points = Object.assign({}, raycaster.params.Points, { threshold: 8 });
const ndc = new THREE.Vector2();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let drag = null;      // { itemId, sx, sz, px, pz }
let downInfo = null;  // クリック判定用

function setNdc(e, dx, dy) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((((e.clientX + (dx || 0)) - r.left) / r.width) * 2 - 1,
          -(((e.clientY + (dy || 0)) - r.top) / r.height) * 2 + 1);
}
// ★v2.5[3] タッチ時はタップ座標±12px程度の複数レイで当たり判定を拡大 (小物が選びにくい問題の解消)
const TOUCH_PICK_OFFS = [[0, 0], [12, 0], [-12, 0], [0, 12], [0, -12], [9, 9], [-9, 9], [9, -9], [-9, -9]];
const MOUSE_PICK_OFFS = [[0, 0]];
function pickOffsets(e) { return isTouchEvent(e) ? TOUCH_PICK_OFFS : MOUSE_PICK_OFFS; }
function floorPoint(e) {
  setNdc(e);
  raycaster.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  return raycaster.ray.intersectPlane(floorPlane, p) ? p : null;
}
function pickItem(e) {
  // ★v1.8 家具は Group (子メッシュ群) なので再帰 raycast → 親をたどって itemId 解決
  const meshes = Object.keys(furnMeshes).map(function (k) { return furnMeshes[k]; });
  const offs = pickOffsets(e);
  for (let oi = 0; oi < offs.length; oi++) {
    setNdc(e, offs[oi][0], offs[oi][1]);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(meshes, true);
    for (let i = 0; i < hits.length; i++) {
      if (hits[i].object.visible === false) continue;   // ★v2.3 閉じている引き出しボックス等は無視
      let o = hits[i].object;
      while (o && !o.userData.itemId) o = o.parent;
      if (o && o.userData.itemId) return o.userData.itemId;
    }
  }
  return null;
}
function pickInfo(e) {
  const focusDk = currentRoom === 'all' ? null : dataKeyOf(currentRoom);
  const offs = pickOffsets(e);   // ★v2.5[3][8] ドア・コンセント等もタッチは判定拡大
  let wallHit = null;            // ★v3.9 壁は「他に何も当たらなかった時」だけ返す (設備・ドアの操作性を落とさない)
  for (let oi = 0; oi < offs.length; oi++) {
    setNdc(e, offs[oi][0], offs[oi][1]);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    for (let i = 0; i < hits.length; i++) {
      const obj = hits[i].object;
      if (obj.visible === false) continue;   // ★v2.3 閉じている引き出しボックス等は無視
      const ud = obj.userData;
      if (ud.kind === 'outlet' && !outletsVisible) continue;
      if (ud.kind === 'wall') {              // ★v3.9 壁は 🏷 ON のときだけクリック対象 (かつ最後回し)
        if (!namesVisible) continue;
        if (focusDk && obj.parent && obj.parent.name && obj.parent.name !== focusDk) continue;
        if (!wallHit) wallHit = ud;
        continue;
      }
      // ★v2.2[8] ドアは両面 (どの部屋ビューでも) クリック可。他の淡色化中の他部屋設備は拾わない
      if (focusDk && !ud.doorId && obj.parent && obj.parent.name && obj.parent.name !== focusDk) continue;
      return ud;
    }
  }
  return wallHit;
}

// ★v1.9 ドラッグ開始情報: y 自動管理 (床置き or 天面載せ状態なら、支えを離れた時に床へ戻す)
function beginDrag(itemId, it, p) {
  // ★v3.1 天面載せホワイトリスト外の床置き家具が旧データ等で浮いていたら、掴んだ時点で着地させる
  //        (overlapState はこの後に取るので、着地で生じた重なりは分離まで免除される)
  const panY0 = washerPanTopFor(it);   // ★v6.6 洗濯機パンに載っている物は「浮いている」ではないので落とさない
  const onPan0 = panY0 !== null && Math.abs((Number(it.y) || 0) - panY0) < 0.6;
  if (!TOP_STACK_TYPES[itemTypeOf(it)] && !isMattressItem(it) && (Number(it.y) || 0) !== 0 && !onPan0) {
    it.y = 0;
    const gm = furnMeshes[itemId];
    if (gm) syncItemMesh(gm, it);
  }
  normalizeInsides(itemId);            // ★v6.3 収納を掴んだら 中のアイテムのローカル位置を確定させる
  const sup0 = supportTopFor(itemId, it);
  const bed0 = bedUnder(itemId, it);   // ★v2.0 ベッド床板面に載っている状態も autoY 対象
  const y0 = Number(it.y) || 0;
  return { itemId: itemId, sx: it.x, sz: it.z, px: p.x, pz: p.z,
           vx: it.x, vz: it.z, vy: y0,
           ig: overlapState(itemId, it),   // ★v2.2[6] 開始時点で重なっている相手は分離まで衝突免除
           wasMounted: isMountedItem(it) ? it.mountArm : null,   // ★v4.1 マウント状態の変化をドラッグ確定時に報告
           wasInside: it.insideOf || null, cavFit: null, cavNg: null,   // ★v6.2 収納イン/アウトの変化を確定時に報告
           autoY: isMountedItem(it) || y0 === 0 ||   // ★v4.1 アームから外したら床/天面へ落とす
                  (sup0 !== null && Math.abs(y0 - sup0) < 0.6) ||
                  onPan0 ||                            // ★v6.6 パン天面に載っている状態も autoY 対象
                  (bed0 !== null && Math.abs(y0 - bedFloorH(bed0)) < 0.6) };
}
// ★v1.9 ドラッグ中の位置解決:
//  1) 部屋ポリゴン外・固定設備めり込みは 軸ごとに滑らせ、両方ダメなら直前の有効位置に留める
//  2) 家具同士は「相手の天面に載せられるなら y を天面へスナップ」(モニター→デスク等)。
//     載せられない (天井超え・相手が小さい) 場合は従来通り滑らせ/押し出し
function resolveDragPos(drag, it) {
  // ★v4.1 モニター×モニターアーム: アーム先端 (VESAプレート) の近く or アーム本体の真上へ運ぶと、
  //   実物同様にアーム先端の位置・高さへ吸着 (スタンドを外して背面をプレートに固定)。
  //   離れる方向へドラッグすると解除され、スタンド復活 → 通常の天面/床スナップに戻る。
  if (isMountableItem(it)) {   // ★v6.5 モニター→アーム / テレビ→テレビスタンド の共通経路
    const tgt = mountTargetFor(drag.itemId, it);
    if (tgt) {
      applyMountPose(it, tgt.id, tgt.it);
      drag.vx = it.x; drag.vz = it.z; drag.vy = it.y;
      return;                                    // 宙に浮いているので 部屋ポリゴン/設備/家具の判定は不要
    }
    if (isMountedItem(it)) {
      clearMountPose(it, false);                 // ドラッグ中の解除は座標をずらさない (指の位置のまま)
      drag.ig = overlapState(drag.itemId, it);   // 解除直後に生じた重なりは分離まで免除
    }
  }

  //   内寸に収まるならオープン部の内側へ吸着 (insideOf)。収まらないサイズは吸着せず警告 (確定時にトースト)。
  //   離れる方向へドラッグすると解除され、通常の床置きに戻る (モニターアームのマウント解除と同じ流儀)。
  if (isTrashItem(it)) {
    // ★v6.3 収納内ドラッグ: キャビティの内側なら境界クランプで自由に移動、
    //   外へ CAVITY_PULLOUT (20cm) 以上引き出したら取り出し。中のアイテム同士は通常の AABB 衝突。
    const ct = cavityTargetFor(drag.itemId, it);
    if (ct) {
      const ft = cavityFit(it, ct.host, ct.wc);
      if (ft.ok) {
        const wasIn = it.insideOf === ct.id;
        const cp = ct.clamp || cavityClampPos(it, ct.host, ct.wc, it.x, it.z);
        const bx = it.x, bz = it.z, by = it.y;
        it.insideOf = ct.id; it.x = cp.x; it.z = cp.z; it.y = ct.wc.y0;
        let okPos = true;
        if (!wasIn) {

    return '開閉: ' + (o.slideDir ? D[o.slideDir] + 'へスライド' : 'スライド (方向データなし)');
  }
  const r0 = openingRange(o), parts = [];
  let sw = o.swing ? D[o.swing] + '側へ開く' : null;
  if (!sw) {
    const m = /([^\/(（、]{1,12})へ開く/.exec(o.label || '');
    if (m) sw = tipClean(m[1]) + 'へ開く';
  }
  if (sw) parts.push(sw);
  const he = (o.hinge === 'e') || /ヒンジ南/.test(o.label || '');
  const hs = (o.hinge === 's');
  if (he || hs) parts.push('吊元: ' + (he ? (r0.horiz ? '東' : '南') : (r0.horiz ? '西' : '北')) + '端');
  return parts.length ? ('開閉: ' + parts.join(' / ')) : null;
}
// ★v6.4-a 窓の種類
//   ROOM_DATA のラベルには改訂履歴 (例 WIN-01 「★v1.7 掃き出し→腰窓修正」) が残っているため、
//   形式ワードを素直に全部拾うと「掃き出し窓・腰窓」と矛盾する。競合時は sillH (実データ) で決める。
function tipWindowKind(o) {
  const lb = (o.label || '') + ' ' + (o.name || ''), k = [];
  const sill = Number(o.sillH) || 0;
  if (/FIX|はめ殺し/i.test(lb)) k.push('FIX (はめ殺し)');
  if (/すべり出し/.test(lb)) k.push((/縦すべり出し/.test(lb) ? '縦' : '') + 'すべり出し窓');
  if (/引違い/.test(lb)) k.push('引違い');
  if (!k.length) {
    const sweep = /掃き出し/.test(lb), koshi = /腰窓/.test(lb);
    if (sweep && koshi) k.push(sill < 5 ? '掃き出し窓' : '腰窓');
    else if (sweep) k.push('掃き出し窓');
    else if (koshi) k.push('腰窓');
    else k.push(sill < 5 ? '掃き出し窓' : (sill >= 140 ? '高所窓' : '腰窓'));
  }
  return k.join('・');
}
// 設備の平面外形 (rect 優先、poly は外接矩形)
function tipFixBox(f) {
  if (f.rect) return { x0: f.rect[0], y0: f.rect[1], w: f.rect[2], d: f.rect[3] };
  if (f.poly && f.poly.length) {
    const xs = f.poly.map(function (p) { return p[0]; }), ys = f.poly.map(function (p) { return p[1]; });
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    return { x0: x0, y0: y0, w: x1 - x0, d: y1 - y0, poly: true };
  }
  return null;
}
// 設備の内寸 (ROOM_DATA に内寸フィールドは無いので、アプリ側が持つ実測内寸を使う)
function tipFixInner(f) {
  if (f.type === 'washer_pan' && typeof WASHER_PAN !== 'undefined') {
    // ★v6.6 かさ上げタイプ: 天面 (=洗濯機の設置面) の床からの高さと、天面基準のクリアランスを出す
    return '内寸: ' + tipN(WASHER_PAN.inner[2]) + ' × ' + tipN(WASHER_PAN.inner[3]) +
           'cm / 天面(設置面) 床から ' + tipN(WASHER_PAN.top) + 'cm' +
           ' / 天面→洗濯水栓 ' + tipN(WASHER_PAN.faucetClr) + 'cm (床から ' + tipN(WASHER_PAN.faucetH) + 'cm)' +
           (WASHER_PAN.shelfH === null ? '' : ' / 天面→棚板下端 ' + tipN(WASHER_PAN.shelfH - WASHER_PAN.top) + 'cm');
  }
  return null;
}

// 要素の種別ごとに ツールチップ本文の行を組み立てる (プレーンテキストの配列)
function tipRows(a, ud) {
  const rows = [], D = NAME_DIR_JA;
  if (!a) return rows;
  // ── 壁 W- (現状維持: 区間・長さ・高さ・目印)
  if (a.kind === 'wall' && a.wall) {
    const w = a.wall;
    rows.push('区間: ' + tipAxisRange(w.horiz, w.from, w.to));
    rows.push('長さ: ' + tipN(w.length) + 'cm / 高さ: ' + tipN(w.height) + 'cm');
    rows.push('位置: ' + tipRoomJa(w.room) + ' ' + (D[w.dir] || '') + '側');
    if (w.feature) rows.push('目印: ' + w.feature);
    return rows;
  }
  const o = a.src;
  if (!o) return rows;
  // ── 開口 D- / WIN- / OP-
  if (a.kind === 'opening') {
    const sill = Number(o.sillH) || 0, hh = Number(o.height) || 0;
    if (o.type === 'window') {
      rows.push('幅: ' + tipN(o.width) + 'cm / 高さ: ' + tipN(hh) + 'cm');
      rows.push('床から: 下端 ' + tipN(sill) + 'cm 〜 上端 ' + tipN(sill + hh) + 'cm');
      rows.push('種類: ' + tipWindowKind(o));
      rows.push('位置: ' + tipOpeningPos(o));
    } else if (o.type === 'open') {
      rows.push('開口幅: ' + tipN(o.width) + 'cm / 高さ: ' + tipN(hh) + 'cm');
      if (sill > 0.05) rows.push('床から: ' + tipN(sill) + 'cm 上げた位置から');
      rows.push('用途: ' + (a.name || '開口') + ' (建具なしの通り抜け)');
      rows.push('位置: ' + tipOpeningPos(o));
    } else {
      rows.push('開口幅: ' + tipN(o.width) + 'cm / 高さ: ' + tipN(hh) + 'cm');
      rows.push('種類: ' + tipDoorKind(o));
      const mo = tipDoorMotion(o);
      if (mo) rows.push(mo);
      rows.push('ペットくぐり戸: ' + (o.petDoor ? 'あり' : 'なし'));
      rows.push('位置: ' + tipOpeningPos(o));
    }
    if (o.est) rows.push('※ 寸法は推定値');
    return rows;
  }
  // ── 設備 F-
  if (a.kind === 'fixture') {
    const st = (typeof FIX_STYLE !== 'undefined' && FIX_STYLE[o.type]) || null;
    const topH = Number(o.h) || (st && st.h) || 0;
    const botH = Number(o.bottomH) || 0;
    const bx = tipFixBox(o);
    if (bx) {
      // ★v6.4-a rect は [x, y, dx, dy] = 平面 x/y 方向の寸法。物の「幅」と一致しない向きもあるので軸を併記
      rows.push('幅W ' + tipN(bx.w) + '(x) × 奥行D ' + tipN(bx.d) + '(y)' +
                ' × 高さH ' + tipN(Math.max(topH - botH, 0)) + 'cm' + (bx.poly ? ' (外接矩形)' : ''));
    } else {
      rows.push('高さH ' + tipN(topH) + 'cm');
    }
    rows.push(botH > 0.05
      ? ('取付: 床から ' + tipN(botH) + 'cm 〜 ' + tipN(topH) + 'cm')
      : ('設置: 床置き (床から 0 〜 ' + tipN(topH) + 'cm)'));
    const inner = tipFixInner(o);
    if (inner) rows.push(inner);
    if (bx) {
      rows.push('位置: ' + tipRoomJa(o.room) + ' / x' + tipN(bx.x0) + '〜' + tipN(bx.x0 + bx.w) +
                ', y' + tipN(bx.y0) + '〜' + tipN(bx.y0 + bx.d));
    }
    if (o.est) rows.push('※ 寸法は推定値');
    return rows;
  }
  // ── コンセント C-
  if (a.kind === 'outlet') {
    const caps = [(o.caps || 2) + '口'];
    if (o.tv) caps.push('テレビ端子');
    if (o.lan) caps.push('LAN');
    rows.push('口数: ' + caps.join(' + '));
    rows.push('取付高さ: 床から ' + tipN(o.h || 25) + 'cm (プレート中心)');
    rows.push('位置: ' + tipRoomJa(o.room) + ' ' + (D[o.wallSide] || '') + '壁 / x' +
              tipN(o.pos[0]) + ', y' + tipN(o.pos[1]));
    if (o.label) rows.push('目印: ' + tipClean(o.label));
    if (o.est) rows.push('※ 位置は推定');
    return rows;
  }
  // ── エアコン AC-
  if (a.kind === 'aircon') {
    const bot = Number(o.bottomH) || 0;
    rows.push('位置: ' + tipRoomJa(o.room) + ' ' + (D[o.wallSide] || '') + '壁 / x' +
              tipN(o.pos[0]) + ', y' + tipN(o.pos[1]));
    rows.push(bot
      ? ('下端高さ: 床から ' + tipN(bot) + 'cm (上端 ' + tipN(bot + 26) + 'cm)')
      : '下端高さ: 未実測 → 3Dは天井際 (床から 205〜231cm) で表示');
    rows.push('表示サイズ: 幅80 × 奥行24 × 高さ26cm (壁掛け機の目安)');
    if (o.label) rows.push('目印: ' + tipClean(o.label));
    return rows;
  }
  // ── 照明 L- (3D には描画していないので ID検索経由で参照される)
  if (a.kind === 'light') {
    rows.push('種類: ' + (o.type === 'downlight' ? 'ダウンライト (天井埋込)'
             : o.type === 'ceiling_socket' ? '引掛シーリング (器具取付口)' : o.type));
    rows.push('位置: ' + tipRoomJa(o.room) + ' / x' + tipN(o.pos[0]) + ', y' + tipN(o.pos[1]));
    rows.push('取付高さ: 天井 (床から ' + tipN(CH) + 'cm)');
    if (o.est) rows.push('※ 位置は推定');
    return rows;
  }
  return rows;
}
function tipIcon(a) {
  if (!a) return '';
  if (a.kind === 'wall') return '🧱';
  if (a.kind === 'outlet') return '🔌';
  if (a.kind === 'aircon') return '❄️';
  if (a.kind === 'light') return '💡';
  if (a.kind === 'opening') return (a.src && a.src.type === 'window') ? '🪟' : '🚪';
  return '📦';
}
// 配置した家具 (カタログ商品) の 寸法サマリー (家具シートの先頭に出す)
function itemDimSummaryHtml(id, it) {

            ' / 上端: ' + tipN(y + h) + 'cm');
  if (it.insideOf && workItems[it.insideOf]) {

  return '<div class="dim-note">📐 ' + rows.map(esc).join('<br>') + '</div>';
}

function showTooltip(e, ud) {
  // ★v6.4 全要素タイプで 寸法 (長さ・高さ・床からの高さ・位置) を出す。
  //   行の組み立ては tipRows() 側に集約 (ID検索 / デバッグAPI と共通化)。
  const tt = document.getElementById('tooltip');
  const a = nameOfInfo(ud);
  const raw = typeof ud.info === 'string' ? ud.info : (ud.info && ud.info.label) || '';
  const title = a
    ? (tipIcon(a) + ' 【' + esc(a.id) + '】' + esc(a.name || ''))
    : esc(tipClean(raw).split('(')[0].trim() || '要素');
  let rows = tipRows(a, ud).map(esc);
  if (!rows.length) rows = [esc(tipClean(raw) || raw)];
  // クリックしたのが 本体ではなく 付属部材 (三方枠・上レール・戸袋等) の時はそれも示す
  if (a && a.kind === 'opening' && raw && a.src && raw !== a.src.label) {
    rows.push(esc('クリック部材: ' + tipClean(raw).split('(')[0].trim()));
  }
  tt.innerHTML = '<div class="tt-title">' + title + '</div>' +
                 '<div class="tt-body">' + rows.join('<br>') + '</div>';
  tt.style.display = 'block';
  // ★v6.4 行数が増えたので 実サイズでクランプする (モバイルで下端が切れないように)
  const vp = document.getElementById('viewport').getBoundingClientRect();
  const tw = tt.offsetWidth || 260, th = tt.offsetHeight || 110;
  tt.style.left = Math.max(4, Math.min(e.clientX - vp.left + 10, vp.width - tw - 6)) + 'px';
  tt.style.top = Math.max(4, Math.min(e.clientY - vp.top + 10, vp.height - th - 6)) + 'px';
}
function hideTooltip() {
  const tt = document.getElementById('tooltip');
  if (tt) tt.style.display = 'none';
}

// ═══════════════ ★v3.9 要素の命名体系 (ID ラベル / ツールチップID / ID検索ジャンプ) ═══════════════
// 目的: 「南東部の壁が違う」ではなく「W-LDK-S3 が違う」と一意に指せるようにする。
//   - ID/日本語名は ROOM_DATA v3.2 以降が持つ (rooms/openings/fixtures/outlets/aircons + walls 配列)。
//   - 旧 ROOM_DATA が埋まっていても壊れないよう、壁区画は buildWalls() と同じ手順でこちらでも導出し、
//     R.walls があればその id / name / feature を上書き採用する (= データが正・JS は保険)。
//   - ラベル DOM は 🏷 ON のときだけ生成/更新する (OFF 時は毎フレーム何もしない)。
const NAME_ROOM_CODE = { ldk: 'LDK', west4_5: 'R45', west6_2: 'R62', west4_8: 'R48', corridor: 'COR',
  washroom: 'WSH', bathroom: 'BTH', toilet: 'WC', genkan: 'GEN', wic: 'WIC',
  balcony_main: 'BLM', balcony_ne: 'BLN' };
const NAME_ROOM_SHORT = { ldk: 'LDK', west4_5: '4.5帖', west6_2: '6.2帖', west4_8: '4.8帖', corridor: '廊下',
  washroom: '洗面', bathroom: '浴室', toilet: 'トイレ', genkan: '玄関', wic: 'WIC',
  balcony_main: 'バルコニー南西', balcony_ne: 'バルコニー北東' };
const NAME_DIR_JA = { N: '北', S: '南', E: '東', W: '西' };
const NAME_NUM = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const NAME_MINOR_LEN = 15;                  // これ未満の壁片 (ドア枠の返し等) は既定でラベルを出さない
function nameMark(n) { return n <= NAME_NUM.length ? NAME_NUM.charAt(n - 1) : String(n); }
function nameShortJa(s, fb) {
  if (!s) return fb || '';
  const t = String(s).split(/[（(]/)[0].split('★')[0].replace(/\s+/g, ' ').replace(/^[\s　/・-]+|[\s　/・-]+$/g, '');
  return t || fb || '';
}

let namesVisible = false;
let nameIndex = null;        // { anchors: [...], byId: {}, byLabel: {}, walls: [...] }
let nameFocusId = null;      // ID検索でフォーカス中の要素 (黄色で強調・部屋フィルタを免除)
const nameLabelEls = [];     // DOM プール
let nameLastKey = '';        // カメラ/部屋が動いていなければ再計算しない
let nameLastAt = 0;
let nameDirty = true;        // ★トグル/検索/部屋切替の直後は key が同じでも必ず再計算する
const nameStats = { runs: 0, placed: 0, cand: 0 };

// 壁区画の導出: buildWalls() のエッジ分割と同一手順 (開口で割った「床〜天井の実壁」だけを区画とする)
function deriveWallSegs() {
  const out = [];
  R.rooms.forEach(function (room) {
    const isBal = room.key.indexOf('balcony') === 0;
    const H = isBal ? 110 : CH;
    const poly = room.poly, n = poly.length;
    for (let i = 0; i < n; i++) {
      const p1 = poly[i], p2 = poly[(i + 1) % n];
      const horiz = Math.abs(p1[1] - p2[1]) < 0.01;
      const c = horiz ? p1[1] : p1[0];
      const a = horiz ? Math.min(p1[0], p2[0]) : Math.min(p1[1], p2[1]);
      const b = horiz ? Math.max(p1[0], p2[0]) : Math.max(p1[1], p2[1]);
      if (b - a < 0.5) continue;
      const inNeg = pointInPoly(horiz ? [(a + b) / 2, c - 2] : [c - 2, (a + b) / 2], poly);
      if (isBal && touchesBuilding(horiz, c, a, b)) continue;
      const outSign = inNeg ? 1 : -1;
      const dir = horiz ? (inNeg ? 'S' : 'N') : (inNeg ? 'E' : 'W');
      const ops = R.openings.map(function (o) { return openingRange(o); })
        .filter(function (r0) {
          return r0.horiz === horiz && Math.abs(r0.c - c) <= OPEN_MATCH_TOL && Math.min(r0.b, b) - Math.max(r0.a, a) > 2;   // ★v6.7
        })
        .map(function (r0) { return { s: Math.max(r0.a, a), e: Math.min(r0.b, b) }; })
        .sort(function (x, y) { return x.s - y.s; });
      const push = function (s, e) {
        if (e - s < 0.5) return;
        out.push({ room: room.key, dir: dir, horiz: horiz, c: c, from: s, to: e,
                   height: H, outSign: outSign, isBal: isBal });
      };
      let cur = a;
      for (let k = 0; k < ops.length; k++) { if (ops[k].s > cur) push(cur, ops[k].s); cur = Math.max(cur, ops[k].e); }
      if (cur < b) push(cur, b);
    }
  });
  // 部屋 × 方位 ごとに連番 (N/S=x昇順=西→東, E/W=y昇順=北→南)
  const groups = {};
  out.forEach(function (w) { const k = w.room + '|' + w.dir; (groups[k] = groups[k] || []).push(w); });
  Object.keys(groups).forEach(function (k) {
    const lst = groups[k].sort(function (x, y) { return (x.from - y.from) || (x.c - y.c); });
    const code = NAME_ROOM_CODE[lst[0].room] || lst[0].room.toUpperCase().slice(0, 3);
    const rs = NAME_ROOM_SHORT[lst[0].room] || lst[0].room;
    lst.forEach(function (w, i) {
      w.seq = i + 1;
      w.id = 'W-' + code + '-' + w.dir + (i + 1);
      w.name = w.isBal ? (rs + ' ' + NAME_DIR_JA[w.dir] + '手すり' + nameMark(i + 1))
                       : (rs + NAME_DIR_JA[w.dir] + '壁' + nameMark(i + 1));
      w.length = Math.round((w.to - w.from) * 100) / 100;
      w.minor = w.length < NAME_MINOR_LEN;
    });
  });
  // ROOM_DATA 側に walls があればそれを正として id / name / feature を上書き
  (R.walls || []).forEach(function (dw) {
    const m = out.find(function (w) {
      return w.room === dw.room && w.dir === dw.dir && Math.abs(w.c - dw.c) < 0.05 &&
             Math.abs(w.from - dw.from) < 0.05 && Math.abs(w.to - dw.to) < 0.05;
    });
    if (!m) return;
    m.id = dw.id; m.name = dw.name; m.dataMatched = true;
    if (dw.feature) m.feature = dw.feature;
    if (dw.minor !== undefined) m.minor = !!dw.minor;
  });
  return out;
}

function nameFixtureAnchor(f) {
  const st = FIX_STYLE[f.type];
  const topH = f.h || (st && st.h) || 80;
  const botH = f.bottomH || 0;
  const y = Math.max(14, Math.min(215, botH + Math.max(topH - botH, 2) / 2));
  if (f.poly) {
    let sx = 0, sz = 0;
    f.poly.forEach(function (p) { sx += p[0]; sz += p[1]; });
    return [sx / f.poly.length, y, sz / f.poly.length];
  }
  const r = f.rect;
  return [r[0] + r[2] / 2, y, r[1] + r[3] / 2];
}

// ROOM_DATA が v3.2 未満 (id 未付与) でも動くように、annotate_names_v3_2.py と同じ規則でここでも採番する。
// (room_data だけ別版に差し替わっても 🏷 表示が丸ごと消えないための保険。id が既にあれば触らない)
function ensureNameIds() {
  const p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  let dn = 0, wn = 0, on = 0;
  R.openings.forEach(function (o) {
    let id;
    if (o.type === 'door' || o.type === 'sliding') id = 'D-' + p2(++dn);
    else if (o.type === 'window') id = 'WIN-' + p2(++wn);
    else id = 'OP-' + p2(++on);
    if (!o.id) o.id = id;
  });
  R.fixtures.forEach(function (f, i) { if (!f.id) f.id = 'F-' + p2(i + 1); });
  R.outlets.forEach(function (u) { if (!u.id) u.id = 'C-' + p2(Number(u.no)); });
  R.aircons.forEach(function (a) { if (!a.id) a.id = 'AC-' + String(a.no).replace(/\D/g, ''); });
}

// ラベル対象アンカー一覧を1度だけ組み立てる (要素の増減が無いので使い回し)
function buildNameIndex() {
  const anchors = [], byId = {}, byLabel = {};
  const add = function (a) { anchors.push(a); byId[a.id] = a; return a; };   // ★v6.4 byLabel も anchor 実体を指す
  ensureNameIds();
  const walls = deriveWallSegs();
  walls.forEach(function (w) {
    // ラベルは壁の「室内側の面」から少し内側に置く (壁の裏に埋まらないように)
    const mid = (w.from + w.to) / 2, cc = w.c - w.outSign * 4;
    add({ id: w.id, name: w.name, kind: 'wall', cls: 'nl-wall', room: w.room,
          pos: w.horiz ? [mid, Math.min(120, w.height * 0.5), cc] : [cc, Math.min(120, w.height * 0.5), mid],
          pri: w.minor ? 1 : 3, minor: w.minor, wall: w,
          detail: w.name + ' / ' + (w.horiz ? 'x' : 'y') + w.from + '〜' + w.to +
                  ' 長さ' + w.length + 'cm' + (w.feature ? ' / ' + w.feature : '') });
  });
  R.openings.forEach(function (o) {
    if (!o.id) return;
    const r0 = openingRange(o);
    const mid = (r0.a + r0.b) / 2;
    const sill = o.sillH || 0, top = Math.min(sill + (o.height || 200), CH);
    const y = Math.max(20, Math.min(212, (sill + top) / 2));
    const cls = o.type === 'window' ? 'nl-win' : (o.type === 'open' ? 'nl-open' : 'nl-door');
    const oa = add({ id: o.id, name: o.name || nameShortJa(o.label, o.type), kind: 'opening', cls: cls, room: o.room,
          pos: r0.horiz ? [mid, y, r0.c] : [r0.c, y, mid], pri: 4, src: o,   // ★v6.4 src = ROOM_DATA の開口オブジェクト
          detail: (o.name || nameShortJa(o.label, o.type)) + ' / 幅' + o.width + 'cm' });
    if (o.label) byLabel[o.label] = oa;
  });
  R.fixtures.forEach(function (f) {
    if (!f.id) return;
    const nm = f.name || f.shortLabel || nameShortJa(f.label, f.type);
    let fa = null;
    if (FIX_STYLE[f.type]) {
      fa = add({ id: f.id, name: nm, kind: 'fixture', cls: 'nl-fix', room: f.room,
            pos: nameFixtureAnchor(f), pri: f.minor ? 1 : 2, minor: !!f.minor, src: f,   // ★v6.4
            detail: nm + (f.rect ? ' / ' + f.rect[2] + '×' + f.rect[3] + 'cm' : '') });
    }
    if (f.label) byLabel[f.label] = fa || { id: f.id, name: nm, kind: 'fixture', room: f.room, src: f };
  });
  R.outlets.forEach(function (u) {
    if (!u.id) return;
    const d = outletInward(u.wallSide);
    add({ id: u.id, name: u.name || ('コンセント No.' + u.no), kind: 'outlet', cls: 'nl-out', room: u.room,
          pos: [u.pos[0] + d[0] * 4, (u.h || 25) + 9, u.pos[1] + d[1] * 4], pri: 1, src: u,   // ★v6.4
          detail: (u.name || ('コンセント No.' + u.no)) });
  });
  R.aircons.forEach(function (a) {
    if (!a.id) return;
    const d = outletInward(a.wallSide);
    add({ id: a.id, name: a.name || ('エアコン ' + a.no), kind: 'aircon', cls: 'nl-out', room: a.room,
          pos: [a.pos[0] + d[0] * 13, a.bottomH ? a.bottomH + 13 : 218, a.pos[1] + d[1] * 13], pri: 2, src: a,   // ★v6.4
          detail: (a.name || ('エアコン ' + a.no)) });
  });
  // ★v6.4 照明 L-: 3D には描画していない (天井ライト表現を v1.8 で削除) ので 直接クリックはできないが、
  //         ID検索 (【L-01】等) で 種類・位置・取付高さ を出せるよう索引には載せる。ラベルは出さない。
  (R.lights || []).forEach(function (l) {
    if (!l.id) return;
    add({ id: l.id, name: l.name || ('照明 ' + l.id), kind: 'light', cls: 'nl-out', room: l.room,
          pos: [l.pos[0], CH - 6, l.pos[1]], pri: 1, minor: true, noLabel: true, src: l,
          detail: (l.name || l.id) + ' / ' + (l.type === 'downlight' ? 'ダウンライト' : '引掛シーリング') });
  });
  return { anchors: anchors, byId: byId, byLabel: byLabel, walls: walls };
}
function ensureNameIndex() { if (!nameIndex) nameIndex = buildNameIndex(); return nameIndex; }

// buildStatic() が作った実壁メッシュに ID と説明文を紐づける (ツールチップ用)
function tagWallSegMeshes() {
  const idx = ensureNameIndex();
  let n = 0;
  wallSegMeshes.forEach(function (m) {
    const q = m.userData.wallSeg;
    const w = idx.walls.find(function (x) {
      return x.room === q.room && x.horiz === q.horiz && Math.abs(x.c - q.c) < 0.05 &&
             Math.abs(x.from - q.from) < 0.05 && Math.abs(x.to - q.to) < 0.05;
    });
    if (!w) return;
    n++;
    m.userData.nameId = w.id;
    m.userData.info = w.name + ' ' + (w.horiz ? 'x' : 'y') + w.from + '〜' + w.to +
      ' / 長さ' + w.length + 'cm / 高さ' + w.height + 'cm' + (w.feature ? ' / 目印: ' + w.feature : '');
  });
  return { meshes: wallSegMeshes.length, tagged: n, walls: idx.walls.length };
}

// ツールチップ用: userData.info (fixture/opening は label 文字列) から ID を引く
function nameOfInfo(ud) {
  const idx = ensureNameIndex();
  if (!ud) return null;
  if (ud.nameId) return idx.byId[ud.nameId] || { id: ud.nameId, name: '' };   // 壁 (tagWallSegMeshes 済み)
  if (ud.opId && idx.byId[ud.opId]) return idx.byId[ud.opId];   // ★v6.4 ドア/窓/開口 (枠・レール・戸袋等の付属部材も本体に寄せる)
  if (ud.acId && idx.byId[ud.acId]) return idx.byId[ud.acId];   // ★v6.4 エアコン
  if (ud.kind === 'outlet' && ud.info && ud.info.no !== undefined) return idx.byId['C-' + String(ud.info.no).padStart(2, '0')] || null;
  const s = typeof ud.info === 'string' ? ud.info : (ud.info && ud.info.label);
  if (!s) return null;
  if (idx.byLabel[s]) return idx.byLabel[s];
  const ac = /^エアコン\s+(\S+?)\s*\(/.exec(s);          // buildAircon が合成する 'エアコン A2 (…)'
  if (ac) return idx.byId['AC-' + ac[1].replace(/\D/g, '')] || null;
  return null;
}

const nameProjV = new THREE.Vector3();
function updateNameLabels() {
  const wrap = document.getElementById('nameLabels');
  if (!wrap || !renderer || !camera) return;
  if (!namesVisible) {
    if (nameLastKey !== 'off') { nameLabelEls.forEach(function (el) { el.style.display = 'none'; }); nameLastKey = 'off'; }
    return;
  }
  const now = performance.now();
  if (now - nameLastAt < 90) return;                 // 最大 ~11fps で十分 (DOM 更新の負荷を抑える)
  const cp = camera.position, ct = controls.target;
  const key = [cp.x, cp.y, cp.z, ct.x, ct.y, ct.z].map(function (v) { return Math.round(v); }).join(',') +
              '|' + currentRoom + '|' + (nameFocusId || '');
  if (!nameDirty && key === nameLastKey) return;     // カメラ・部屋・フォーカスが動いていなければ据え置き
  nameLastAt = now; nameLastKey = key; nameDirty = false; nameStats.runs++;

  // ★重要: project() は camera.matrixWorldInverse を使う。カメラを動かした直後 (renderer.render 前) に
  //        呼ばれると古い行列で投影してしまうため、ここで必ず作り直す。
  camera.updateMatrixWorld();
  const idx = ensureNameIndex();
  const W = renderer.domElement.clientWidth, H = renderer.domElement.clientHeight;
  const focusDk = currentRoom === 'all' ? null : dataKeyOf(currentRoom);
  const MAX = IS_COARSE ? 26 : 60;
  const SEP = IS_COARSE ? 82 : 68;                   // ラベル同士の最小間隔 (px。ラベル幅 ~60-90px を考慮)
  // 下端の除外帯: ID検索ボックス + ヒントバーに重ならないようにする。
  // (キャンバスは部屋タブ/案バーの増減では resize しないので、実際に見えている viewport 高さも見る)
  const vpH = (wrap.parentNode && wrap.parentNode.clientHeight) || H;
  const BOT = Math.min(H, vpH) - 92;
  const cand = [];
  for (let i = 0; i < idx.anchors.length; i++) {
    const a = idx.anchors[i];
    const isFocus = nameFocusId === a.id;
    if (a.noLabel && !isFocus) continue;   // ★v6.4 3D実体の無い要素 (照明 L-) は ID検索時のみ
    if (!isFocus) {
      if (focusDk && a.room !== focusDk) continue;                       // 部屋ビューはその部屋だけ
      if (!focusDk && (a.pri < 2 || a.minor)) continue;                  // 全体ビューは小物・コンセントを省く
      if (a.kind === 'wall') {
        // 壁は室内側の面にラベルを置くので、カメラが壁の外側にいる時は見えない → 出さない
        const camC = a.wall.horiz ? cp.z : cp.x;
        if ((camC - a.wall.c) * a.wall.outSign > 0) continue;
      }
    }
    nameProjV.set(a.pos[0], a.pos[1], a.pos[2]).project(camera);
    if (nameProjV.z > 1) continue;
    const sx = (nameProjV.x + 1) / 2 * W, sy = (-nameProjV.y + 1) / 2 * H;
    if (sx < 28 || sx > W - 28 || sy < 14 || sy > BOT) continue;   // 端で見切れる/検索ボックスに重なるものは出さない
    const dist = camera.position.distanceTo(new THREE.Vector3(a.pos[0], a.pos[1], a.pos[2]));
    cand.push({ a: a, x: sx, y: sy, d: dist, focus: isFocus });
  }
  // 優先度 (フォーカス > 開口 > 壁 > 主要設備 > 小物/コンセント) → 近い順。近いものから置いて重なりを間引く
  cand.sort(function (p, q) { return (q.focus - p.focus) || (q.a.pri - p.a.pri) || (p.d - q.d); });
  const placed = [];
  for (let i = 0; i < cand.length && placed.length < MAX; i++) {
    const c = cand[i];
    let hit = false;
    for (let j = 0; j < placed.length; j++) {
      if (Math.abs(placed[j].x - c.x) < SEP && Math.abs(placed[j].y - c.y) < 17) { hit = true; break; }
    }
    if (!hit) placed.push(c);
  }
  nameStats.cand = cand.length; nameStats.placed = placed.length;
  while (nameLabelEls.length < placed.length) {
    const el = document.createElement('div');
    el.className = 'name-label';
    wrap.appendChild(el);
    nameLabelEls.push(el);
  }
  for (let i = 0; i < nameLabelEls.length; i++) {
    const el = nameLabelEls[i];
    if (i >= placed.length) { el.style.display = 'none'; continue; }
    const c = placed[i];
    el.className = 'name-label ' + c.a.cls + (c.focus ? ' nl-focus' : '');
    el.textContent = c.a.id;
    el.style.left = Math.round(c.x) + 'px';
    el.style.top = Math.round(c.y) + 'px';
    el.style.display = 'block';
  }
}

window.toggleNames = function () {
  namesVisible = !namesVisible;
  document.getElementById('nameBtn').classList.toggle('active', namesVisible);
  document.getElementById('nameFind').classList.toggle('show', namesVisible);
  if (!namesVisible) nameFocusId = null;
  nameDirty = true;
  nameLastKey = ''; nameLastAt = 0;
  updateNameLabels();
  if (namesVisible) {
    const n = ensureNameIndex().anchors.length;
    toast('要素ID表示 ON (全' + n + '要素)｜灰=壁 茶=ドア 青=窓 紫=設備 緑=コンセント/エアコン');
  } else {
    toast('要素ID表示 OFF');

};

// ID検索 → その要素へカメラをフォーカス + ラベル強調
window.focusName = function (q) {
  const idx = ensureNameIndex();
  const s = String(q || '').trim().toUpperCase().replace(/\s+/g, '');
  if (!s) return null;
  let a = idx.byId[s];
  if (!a) a = idx.anchors.find(function (x) { return x.id.indexOf(s) === 0; });
  if (!a) a = idx.anchors.find(function (x) { return (x.name || '').toUpperCase().indexOf(s) >= 0; });
  if (!a) { toast('該当なし: ' + q); return null; }
  if (!namesVisible) window.toggleNames();
  nameFocusId = a.id;
  const t = new THREE.Vector3(a.pos[0], a.pos[1], a.pos[2]);
  let off;
  if (a.kind === 'wall') {
    // 壁は「室内側の正面」から見る (裏側に回り込んで何も見えない、を避ける)
    const w = a.wall, d = Math.max(300, (w.length || 100) * 1.35);
    off = w.horiz ? new THREE.Vector3(0, d * 0.45, -w.outSign * d)
                  : new THREE.Vector3(-w.outSign * d, d * 0.45, 0);
  } else {
    off = camera.position.clone().sub(controls.target);
    if (off.lengthSq() < 1) off.set(180, 200, 220);
    off.setLength(Math.max(controls.minDistance + 20, 320));
  }
  controls.target.copy(t);
  camera.position.copy(t).add(off);
  controls.update();
  nameLastKey = ''; nameDirty = true; nameLastAt = 0;
  updateNameLabels();
  toast('【' + a.id + '】' + (a.detail || a.name));
  return a.id;
};
function bindNameFind() {
  const inp = document.getElementById('nameFindInput');
  const btn = document.getElementById('nameFindBtn');
  if (!inp || !btn) return;
  const go = function () { window.focusName(inp.value); };
  btn.addEventListener('click', go);
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); go(); }
    if (e.key === 'Escape') { e.stopPropagation(); inp.blur(); }
  });
}

// ═══════════════ キーボード (PC): 矢印移動 / R回転 / Delete削除 / Esc ═══════════════
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    // 優先順: ツールチップ → モーダル → 家具シート → 選択解除(パネルも閉じる)
    const tt = document.getElementById('tooltip');
    if (tt && tt.style.display === 'block') { hideTooltip(); return; }
    if (document.getElementById('modalOverlay').classList.contains('active')) { closeModalFn(); return; }
    if (document.getElementById('furnSheet').classList.contains('open')) { closeFurnSheetFn(); return; }
    if (selectedItemId) { deselect(); return; }
    if (document.getElementById('itemSheet').classList.contains('open')) { closeItemSheetFn(); return; }
    return;
  }
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (currentRoom === 'all' || !selectedItemId) return;
  const it = workItems[selectedItemId];
  if (!it) return;
  if (e.key === 'r' || e.key === 'R') { window.rotateItem(); return; }
  if (e.key === 'Delete') { window.deleteItem(); return; }
  // ★v4.1 アームにマウント中のモニターは単独では動かせない (位置はアーム先端で決まる)
  if (isMountedItem(it) && /^Arrow/.test(e.key)) {
    e.preventDefault();
    toast(isTvItem(it) ? '取り付け中はテレビスタンド側を動かしてください (テレビは追従します)'
                       : 'マウント中はアーム側を動かしてください (モニターは追従します)');   // ★v6.5
    return;
  }
  const step = e.shiftKey ? 10 : 1;
  let used = true;
  const px = it.x, pz = it.z;
  const kig = overlapState(selectedItemId, it);   // ★v2.2[6] 移動前から重なっている相手は免除 (スタック解消)
  if (e.key === 'ArrowUp') it.z -= step;
  else if (e.key === 'ArrowDown') it.z += step;
  else if (e.key === 'ArrowLeft') it.x -= step;
  else if (e.key === 'ArrowRight') it.x += step;
  else used = false;
  if (used) {
    e.preventDefault();
    // ★v6.3 収納に入っている間は キャビティ内クランプで移動 (中のアイテム同士は衝突判定あり)
    if (it.insideOf && workItems[it.insideOf]) {
      const kh = workItems[it.insideOf], kc = openCavityOf(kh);
      if (kc) {
        const kwc = cavityWorld(kh, kc);
        const kp = cavityClampPos(it, kh, kwc, it.x, it.z);
        it.x = kp.x; it.z = kp.z; it.y = kwc.y0;
        if (collidesAny(selectedItemId, it, kig.items)) { it.x = px; it.z = pz; return; }
        setInsideLocal(kh, it);
        const km = furnMeshes[selectedItemId];
        if (km) syncItemMesh(km, it);
        markDirty();
        return;
      }
    }
    clampItem(it);
    if (blockedAny(selectedItemId, it, kig)) { it.x = px; it.z = pz; return; }   // ★v1.9 家具+壁+設備めり込み防止
    if (isMattressItem(it)) {                                               // ★v2.0 キー移動でもベッド床板面/床へ追従
      const kb = bedUnder(selectedItemId, it);
      if (kb) it.y = bedFloorH(kb);
      else if (supportTopFor(selectedItemId, it) === null) it.y = 0;
    }
    const kPan = washerPanTopFor(it);                                       // ★v6.6 キー移動でも パン天面 ⇔ 床 を追従
    if (kPan !== null) it.y = kPan;
    else if (Math.abs((Number(it.y) || 0) - WASHER_PAN.top) < 0.6 &&
             supportTopFor(selectedItemId, it) === null) it.y = 0;
    const m = furnMeshes[selectedItemId];
    if (m) syncItemMesh(m, it);
    if (isArmItem(it)) syncMounts(selectedItemId);   // ★v4.1 キー移動でもマウント中モニターが追従
    markDirty();
  }
});

// ★v1.8 dirtyGuard も native confirm() からアプリ内モーダルへ (コールバック方式)
function dirtyGuard(onOk, onCancel) {

  confirmModal('未保存の変更', '未保存の変更があります。破棄して続行しますか？', '破棄して続行', function () {
    dirty = false;

function cleanItem(it) {
  return {
    name: it.name || '家具', w: Number(it.w) || 10, d: Number(it.d) || 10, h: Number(it.h) || 10,
    x: Number(it.x) || 0, z: Number(it.z) || 0, y: Number(it.y) || 0, rotY: Number(it.rotY) || 0,
    color: it.color || '#b9a488', url: it.url || null, catalogId: it.catalogId || null,

    specNote: it.specNote || null,     // ★v5.3 内部管理のスペック情報 (カタログシード由来。UIのメモ欄には出さない)
    type: it.type || null,   // ★v1.8 パラメトリックモデル用 (未設定時は catalogId 経由で解決)
    colorName: it.colorName || null,   // ★v2.0 カラーバリエーション選択名 (既存データは undefined でもOK)
    floorH: (it.floorH === undefined || it.floorH === null || it.floorH === '') ? null : Number(it.floorH),   // ★v2.0 Aerus床面高 (null=既定32)
    mattress: it.mattress === false ? false : true,   // ★v2.2 Aerusマットレス内蔵表示 (既定ON)
    // ★v4.1 モニターアーム マウント: mounted=マウント中 (スタンド非表示・原点=パネル背面中心) /
    //        mountArm=マウント先アームの item id / vesaH=アームの天板からのVESA中心高さ (null=既定20)
    mounted: it.mounted === true,
    mountArm: it.mountArm || null,
    vesaH: (it.vesaH === undefined || it.vesaH === null || it.vesaH === '') ? null : Number(it.vesaH),
    // ★v6.5 テレビスタンド: standH=床〜TV取付ブラケット上端 (120〜170・11段階) / shelfH=地板上面〜可動棚 (33〜65・9段階)
    standH: (it.standH === undefined || it.standH === null || it.standH === '') ? null : Number(it.standH),
    shelfH: (it.shelfH === undefined || it.shelfH === null || it.shelfH === '') ? null : Number(it.shelfH),
    // ★v6.2 insideOf=収納のオープン部 (ゴミ箱スペース) に収まっている相手の item id /
    //        stackLevel=載せている支持面のローカル高さ cm (ワゴン下棚 9.6 / 天面 68 等。null=一番上)
    insideOf: it.insideOf || null,
    // ★v6.3 insideX/insideZ = 収納内でのローカル位置 (収納の向き基準 cm)。収納の中で動かせるようにしたので保存する
    insideX: (it.insideX === undefined || it.insideX === null || it.insideX === '') ? null : Number(it.insideX),
    insideZ: (it.insideZ === undefined || it.insideZ === null || it.insideZ === '') ? null : Number(it.insideZ),
    stackLevel: (it.stackLevel === undefined || it.stackLevel === null || it.stackLevel === '') ? null : Number(it.stackLevel)
  };
}

async function createPlanInternal(rk, name, items) {
  const data = { name: name, items: items || {}, createdBy: currentUser, createdAt: DBI.now() };
  const id = await DBI.createPlan(rk, data);
  (plansData[rk] = plansData[rk] || {})[id] = { name: name, items: JSON.parse(JSON.stringify(items || {})), createdBy: currentUser, createdAt: Date.now() };
  selectedPlanId[rk] = id;
  saveSelCache();
  return id;
}

async function addItem(base, zone) {
  const rk = currentRoom;
  if (rk === 'all') return;
  if (!selectedPlanId[rk]) {
    await createPlanInternal(rk, '案1');
    renderPlanBar();
  }
  const bb = roomBBox[dataKeyOf(rk)];
  let sx = (bb.minX + bb.maxX) / 2, sz = (bb.minZ + bb.maxZ) / 2;
  // ★v2.1 zone付きカタログ商品はLDKで該当サブゾーン中央に出現 (findFreeSpot はゾーン中心起点)。
  //        zone無し商品・自由サイズは従来通り部屋中央、LDK以外の部屋では zone を無視
  if (rk === 'ldk' && zone) {
    const zn = (R.zones || []).find(function (q) { return q.room === 'ldk' && q.key === zone; });
    if (zn && zn.rect) { sx = zn.rect[0] + zn.rect[2] / 2; sz = zn.rect[1] + zn.rect[3] / 2; }
  }
  const it = Object.assign({ x: sx, z: sz, y: 0, rotY: 0 }, base);
  clampItem(it);
  if (!findFreeSpot(null, it)) toast('空きスペースが無いため重なって配置されました。移動してください');  // ★v1.8
  const id = genItemId();
  workItems[id] = it;
  itemMeshBuild(id, it);
  markDirty();
  select(id);
  // ★v2.5[6] 追加直後の導線: シートは閉じ済み・選択済み (peek+ハンドル表示)。掴み方をトースト案内
  toast('⊕ドラッグで移動 / 家具の長押しでも掴めます');
}

// ★v5.3 移行処理: 配置済みアイテムの memo のうち「カタログシードからコピーされた調査メモ」だけを空にし、
//        スペックは specNote (内部) へ退避する。ユーザーが自分で書いたメモは絶対に消さない。
//   判定: ① シード由来カタログ (createdBy==='seed') の specNote / 旧 memo と 完全一致
//         ② 同じく先頭40文字が一致 (シードの文面が版を重ねて末尾に追記されてきた旧コピーへの保険)
//   → どちらも一致しなければ ユーザーのメモとみなして残す。
//   DB への書き戻しはしない (colors/url のマージと同じくメモリ内だけ。次にユーザーが保存した時点で永続化される)。
const SEED_MEMO_HEAD = 40;
function migrateSeedMemos(seedSpecTexts) {
  const heads = {};
  Object.keys(seedSpecTexts || {}).forEach(function (t) {
    if (t.length >= SEED_MEMO_HEAD) heads[t.slice(0, SEED_MEMO_HEAD)] = 1;
  });
  const isSeedText = function (t) {
    if (!t) return false;
    if (seedSpecTexts[t]) return true;
    return t.length >= SEED_MEMO_HEAD && !!heads[t.slice(0, SEED_MEMO_HEAD)];
  };
  let n = 0;
  Object.keys(plansData || {}).forEach(function (rk) {
    const plans = plansData[rk] || {};
    Object.keys(plans).forEach(function (pid) {
      const items = (plans[pid] && plans[pid].items) || {};
      Object.keys(items).forEach(function (iid) {
        const it = items[iid];
        const cat = it.catalogId ? catalogData[it.catalogId] : null;
        if (cat && cat.specNote && !it.specNote) it.specNote = cat.specNote;   // スペックは内部へ退避
        if (it.memo && isSeedText(it.memo)) { it.memo = ''; n++; }
      });
    });
  });
  if (n) console.log('[nozaROOM v5.3] シード由来のメモを ' + n + ' 件 空にしました (specNote へ移行)');
  return n;
}
let booted = false;
async function boot() {
  if (booted) return;
  booted = true;
  showScreen('appScreen');
  document.getElementById('userBadge').textContent = currentUser + (DEBUG ? ' (debug)' : '');
  try {
    const all = await DBI.loadAll();
    plansData = all.plans || {};
    catalogData = all.catalog || {};
    // ★v5.3 「シード由来のスペック文面」の集合。カタログ側の移行で集め、配置済みアイテムの memo 消去判定に使う
    const seedSpecTexts = {};
    if (CATALOG_SEED && CATALOG_SEED.items) {
      CATALOG_SEED.items.forEach(function (it) {
        if (it.specNote) seedSpecTexts[it.specNote] = 1;
        if (it.memo) seedSpecTexts[it.memo] = 1;
      });
    }
    if (!Object.keys(catalogData).length && CATALOG_SEED && CATALOG_SEED.items) {
      // 初回のみカタログシードを書き込み (既にあればスキップ)
      const items = CATALOG_SEED.items.map(function (it) {
        return Object.assign({}, it, { createdBy: 'seed', createdAt: DBI.now() });
      });
      catalogData = (await DBI.seedCatalog(items)) || {};
    } else if (CATALOG_SEED && CATALOG_SEED.items) {
      // ★v1.9 差分シード: 既存カタログに無い新商品 (model/name 単位) だけ追記 (v1.2 追加のモニター/アーム)
      const have = {};
      Object.keys(catalogData).forEach(function (id) { have[catalogData[id].model || catalogData[id].name] = 1; });
      const missing = CATALOG_SEED.items.filter(function (it) { return !have[it.model || it.name]; });
      if (missing.length) {
        const items = missing.map(function (it) {
          return Object.assign({}, it, { createdBy: 'seed', createdAt: DBI.now() });
        });
        const added = (await DBI.seedCatalog(items)) || {};
        Object.keys(added).forEach(function (id) { catalogData[id] = added[id]; });
      }
    }
    // ★v2.0 旧シード由来の既存カタログに colors をシードから補完 (メモリ内のみ・DB書込なし。
    //        カラーバリエーションは静的設定なので毎起動マージで十分) ★v2.1 zone も同様に補完
    if (CATALOG_SEED && CATALOG_SEED.items) {
      const seedByKey = {};
      CATALOG_SEED.items.forEach(function (it) { seedByKey[it.model || it.name] = it; });
      Object.keys(catalogData).forEach(function (id) {
        const c = catalogData[id];
        const s = seedByKey[c.model || c.name];
        if (s && s.colors && (!c.colors || c.colors.length !== s.colors.length)) {
          c.colors = s.colors;                 // ★v3.2 シード側のカラー追加/変更も追従 (colors は静的設定なので毎起動同期)
          if (s.color) c.color = s.color;      // ★v3.2 カラー展開が変わった商品はデフォルト色もシードに同期 (MK02 合皮アイボリー等)
        }
        // ★v5.3 シード由来の公式スペックは specNote (内部管理) に追従させる。memo はユーザーの自由入力欄なので
        //        シードからは一切書き込まない (v3.6〜v5.2 の memo 追従は廃止)。
        if (s && s.specNote && c.createdBy === 'seed' && c.specNote !== s.specNote) c.specNote = s.specNote;
        // ★v5.3 移行: シード由来カタログの memo は例外なく調査メモ (カタログの memo は UI から編集できない
        //        = ユーザーが書いたものは原理上存在しない)。空にしつつ、配置済みアイテムの移行判定用に文面を控える。
        if (c.createdBy === 'seed' && c.memo) { seedSpecTexts[c.memo] = 1; c.memo = ''; }
        if (s && s.specNote) seedSpecTexts[s.specNote] = 1;
        if (s && s.memo) seedSpecTexts[s.memo] = 1;
        // ★v3.7 url もシード追従 (公式ページ差し替えの反映用。エトナ60OP=2190200007348 / BenQ=Wayback /
        //        山善=yamazenbizcom / 43V型=REGZA公式 / エルゴトロンLX=en-us / MK02=合皮IV 1150183)
        if (s && s.url && c.createdBy === 'seed' && c.url !== s.url) c.url = s.url;
        if (s && s.zone && !c.zone) c.zone = s.zone;   // ★v2.1 LDKサブゾーン初期配置先
        if (s && s.baseW && !c.baseW) { c.baseW = s.baseW; c.baseD = s.baseD; }   // ★v2.8 設置面(脚間)寸法
      });
    }
    migrateSeedMemos(seedSpecTexts);   // ★v5.3 配置済みアイテムの「シード由来メモ」を空にする
  } catch (err) {
    console.error('データ読み込みに失敗:', err);
    alert('データの読み込みに失敗しました: ' + (err && err.message));
  }
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem('nozaroom_selected') || '{}'); } catch (e) {}
  EDITABLE_ROOMS.forEach(function (rk) {
    const plans = plansData[rk] || {};
    selectedPlanId[rk] = (cache[rk] && plans[cache[rk]]) ? cache[rk] : (Object.keys(plans)[0] || null);
  });
  initThree();
  renderRoomTabs();
  applyRoomView();
}

if (DEBUG) {
  if (!currentUser) currentUser = 'デバッグ';
  boot();
} else if (auth) {
  auth.onAuthStateChanged(function (user) {
    if (user) {
      if (currentUser) boot();
      else showScreen('nameScreen');
    } else {
      showScreen('authScreen');
    }
  });
} else {
  showScreen('authScreen');
}
</script>
</body>
</html>
