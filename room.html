<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>nozaROOM - 3D内装シミュレータ</title>
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0e14;
  --bg-secondary: #0d1117;
  --bg-card: #151b23;
  --bg-card-hover: #1a2230;
  --bg-input: #1a2230;
  --border: #253040;
  --border-light: #1e2a38;
  --text-primary: #e8edf4;
  --text-secondary: #8b95a5;
  --text-muted: #5c6878;
  --accent: #FF8FAB;
  --accent-dark: #E91E63;
  --accent-green: #42c760;
  --accent-red: #f85149;
  --accent-blue: #5aadff;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.light {
  --bg-primary: #FFF0F3;
  --bg-secondary: #FFE8ED;
  --bg-card: #FFFFFF;
  --bg-card-hover: #FFF5F7;
  --bg-input: #FFF5F7;
  --border: #F5C6D0;
  --border-light: #FADADD;
  --text-primary: #37474F;
  --text-secondary: #607080;
  --text-muted: #90A0B0;
  --accent: #E91E63;
  --accent-dark: #C2185B;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}
body.theme-switching, body.theme-switching * { transition: none !important; }

html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow: hidden; /* 全画面アプリ: 背景スクロールは常時ロック */
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
body.modal-open { overflow: hidden; }

.screen { display: none; }
.screen.active { display: flex; }

/* ── Auth / Name screens ── */
#authScreen, #nameScreen {
  flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; height: 100dvh; padding: 24px; text-align: center;
}
.login-heart { font-size: 48px; margin-bottom: 16px; }
.login-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
.login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
.login-link {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
  padding: 12px 32px; border-radius: var(--radius); background: var(--accent); color: #fff;
  font-size: 15px; font-weight: 600; text-decoration: none; transition: all var(--transition);
}
.login-link:active { transform: scale(0.96); }
.name-title { font-size: 20px; font-weight: 600; margin-bottom: 32px; }
.name-buttons { display: flex; gap: 16px; }
.name-btn {
  padding: 20px 36px; border: 2px solid var(--border); border-radius: var(--radius-lg);
  background: var(--bg-card); color: var(--text-primary); font-size: 18px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all var(--transition); min-width: 120px; min-height: 44px;
}
.name-btn:active { transform: scale(0.96); }
.name-btn:hover { border-color: var(--accent); background: var(--bg-card-hover); }

/* ── App shell ── */
#appScreen { flex-direction: column; height: 100vh; height: 100dvh; }

.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--bg-secondary);
  border-bottom: 1px solid var(--border); z-index: 100; flex-shrink: 0;
}
.app-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.back-link {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px;
  padding: 4px 10px; border-radius: 8px; color: var(--text-secondary); text-decoration: none;
  font-size: 13px; font-weight: 600; transition: all var(--transition); white-space: nowrap;
}
.back-link:active, .back-link:hover { background: var(--border-light); color: var(--text-primary); }
.app-title { font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.app-header-right { display: flex; align-items: center; gap: 4px; }
.user-badge {
  font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px;
  background: rgba(255,143,171,0.15); color: var(--accent); white-space: nowrap;
}
.theme-toggle {
  background: none; border: none; font-size: 18px; cursor: pointer; min-width: 44px; min-height: 44px;
  border-radius: 8px; transition: all var(--transition); color: var(--text-secondary);
}
.theme-toggle:active { background: var(--border-light); }

/* ── Room tabs ── */
.room-tabs {
  display: flex; gap: 6px; padding: 8px 12px 4px; overflow-x: auto; flex-shrink: 0;
  background: var(--bg-secondary); scrollbar-width: none;
}
.room-tabs::-webkit-scrollbar { display: none; }
.room-tab {
  padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap; font-family: inherit; transition: all var(--transition);
  min-height: 44px;
}
.room-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Plan bar ── */
.plan-bar {
  display: flex; gap: 6px; align-items: center; padding: 4px 12px 8px; flex-shrink: 0;
  background: var(--bg-secondary); border-bottom: 1px solid var(--border); overflow-x: auto;
  scrollbar-width: none;
}
.plan-bar::-webkit-scrollbar { display: none; }
.plan-select {
  flex: 1; min-width: 90px; max-width: 200px; min-height: 44px; padding: 6px 10px;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input);
  color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;
}
.plan-btn {
  min-width: 44px; min-height: 44px; padding: 6px 10px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--bg-card); color: var(--text-secondary);
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all var(--transition); white-space: nowrap;
}
.plan-btn:active { background: var(--bg-card-hover); }
.plan-btn.save { background: var(--accent); color: #fff; border-color: var(--accent); }
.plan-btn.save.clean { opacity: 0.55; }
.plan-hint { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

/* ── ★v1.9 LDK サブゾーンチップ (案バーの下) ── */
.zone-chips {
  display: flex; gap: 6px; align-items: center; padding: 4px 12px 8px; flex-shrink: 0;
  background: var(--bg-secondary); border-bottom: 1px solid var(--border); overflow-x: auto;
  scrollbar-width: none;
}
.zone-chips::-webkit-scrollbar { display: none; }
.zone-chip {
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; font-family: inherit; transition: all var(--transition);
  min-height: 44px;
}
.zone-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.dim-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* ── Viewport ── */
#viewport { flex: 1; position: relative; min-height: 0; background: var(--bg-primary);
  /* ★v2.5[1] 長押し掴みでiOSのコールアウト/テキスト選択が出ないように */
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#viewport canvas { display: block; }
.vp-controls {
  position: absolute; display: flex; flex-direction: column; gap: 6px; z-index: 50;
}
.vp-controls.tr { top: 10px; right: 10px; }
.vp-controls.tl { top: 10px; left: 10px; flex-direction: row; }
.vp-btn {
  min-width: 44px; min-height: 44px; padding: 4px 10px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--bg-card); color: var(--text-secondary);
  font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all var(--transition); box-shadow: var(--shadow); opacity: 0.92;
  touch-action: manipulation;   /* ★v2.5[10] ダブルタップズーム誤発火防止 */
}
.vp-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.mode-seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.mode-seg .vp-btn { border: none; border-radius: 0; box-shadow: none; }
#vpHint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  font-size: 11px; color: var(--text-secondary); background: var(--bg-card); opacity: 0.9;
  padding: 4px 12px; border-radius: 14px; border: 1px solid var(--border);
  /* ★v6.6 収まり判定は 3項目 (内寸/水栓/ふた開放) 出るので 1行固定をやめて最大3行まで折り返す */
  white-space: normal; text-align: center; line-height: 1.45; max-height: 4.6em;
  pointer-events: none; z-index: 40; max-width: 94%; overflow: hidden; text-overflow: ellipsis;
}
#tooltip {
  display: none; position: absolute; z-index: 60; max-width: 260px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 10px 12px; font-size: 12px; color: var(--text-primary);
}
#tooltip .tt-title { font-weight: 700; font-size: 12px; margin-bottom: 2px; color: var(--accent); }
#tooltip .tt-body { color: var(--text-secondary); line-height: 1.5; }
#dimLabel {
  display: none; position: absolute; z-index: 55; transform: translate(-50%, -100%);
  background: rgba(0,0,0,0.72); color: #fff; font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap;
}
.light #dimLabel { background: rgba(55,71,79,0.85); }
.drawer-label {
  position: absolute; z-index: 54; transform: translate(-50%, -100%);
  background: rgba(198,108,32,0.88); color: #fff; font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: 6px; pointer-events: none; white-space: nowrap;
}

/* ── ★v3.9 要素ID ラベル (🏷 トグル時のみ生成・更新)。種類ごとに色分け ── */
#nameLabels { position: absolute; inset: 0; pointer-events: none; z-index: 45; }   /* 操作ボタン(50)より下 */
.name-label {
  position: absolute; transform: translate(-50%, -50%); display: none;
  font-size: 10px; font-weight: 700; line-height: 1.25; letter-spacing: 0.2px;
  padding: 2px 6px; border-radius: 5px; white-space: nowrap; pointer-events: none;
  color: #fff; border: 1px solid rgba(255,255,255,0.5);
  text-shadow: 0 1px 2px rgba(0,0,0,0.45); box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.name-label.nl-wall { background: rgba(94,102,112,0.92); }    /* 壁 = グレー */
.name-label.nl-door { background: rgba(140,86,44,0.94); }     /* ドア・引き戸 = 茶 */
.name-label.nl-win  { background: rgba(38,110,180,0.94); }    /* 窓 = 青 */
.name-label.nl-open { background: rgba(122,112,86,0.92); }    /* 建具なし開口 = カーキ */
.name-label.nl-fix  { background: rgba(122,72,168,0.94); }    /* 設備 = 紫 */
.name-label.nl-out  { background: rgba(30,130,94,0.94); }     /* コンセント・エアコン = 緑 */
.name-label.nl-focus {
  outline: 2px solid #ffd54f; font-size: 12px;
  box-shadow: 0 0 0 4px rgba(255,213,79,0.35), 0 2px 8px rgba(0,0,0,0.45);
}
@media (pointer: coarse) { .name-label { font-size: 11px; padding: 3px 7px; } }
#nameFind {
  position: absolute; left: 10px; bottom: 44px; z-index: 58; display: none;
  gap: 6px; align-items: center; max-width: calc(100% - 20px);
}
#nameFind.show { display: flex; }
#nameFindInput {
  width: 190px; max-width: 46vw; min-height: 40px; padding: 6px 10px; font-family: inherit;
  font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow);
}

/* ── ★v2.5[2] 選択中家具の操作ハンドル (移動⊕ / 回転↻)。スクリーンサイズ一定・44px以上 ── */
.gizmo-btn {
  display: none; position: absolute; z-index: 56;
  width: 48px; height: 48px; margin-left: -24px; margin-top: -24px;
  border-radius: 50%; border: 2px solid #fff; padding: 0;
  background: var(--accent); color: #fff; font-size: 22px; font-weight: 700;
  align-items: center; justify-content: center; font-family: inherit;
  box-shadow: 0 3px 12px rgba(0,0,0,0.35); cursor: grab;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.gizmo-btn.show { display: flex; }
#gizmoMove:active { cursor: grabbing; transform: scale(1.1); }
#gizmoRot { background: var(--bg-card); color: var(--accent); border-color: var(--accent); font-size: 20px; }
#gizmoRot:active { transform: scale(0.92); }

/* ★v2.5[5] itemSheet 折りたたみ (peek): タイトル+主要ボタンだけの1行バー */
#itemSheet .peek-bar {
  display: none; align-items: center; gap: 6px;
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
}
#itemSheet.peek .peek-bar { display: flex; }
#itemSheet.peek .sheet-header, #itemSheet.peek .sheet-body { display: none; }
.peek-title {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-weight: 700; font-size: 13px; cursor: pointer; padding: 10px 4px; min-height: 44px;
  display: flex; align-items: center;
}
.peek-bar button { min-width: 44px; min-height: 44px; padding: 8px 10px; font-size: 15px; flex: 0 0 auto; }
.peek-grip {
  position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
  width: 36px; height: 4px; border-radius: 2px; background: var(--border); pointer-events: none;
}
/* ★v2.5[5] ヘッダ/バー上のスワイプはブラウザのパンに取られず自前検知 (本文はpan-yでスクロール可) */
#itemSheetHeader, #itemPeekBar { touch-action: none; }
#itemSheet .sheet-body { touch-action: pan-y; }
/* ★v2.5[10] itemSheet が開いている間、ヒント/トーストがバーに隠れないよう持ち上げる */
body.itemsheet-open #vpHint { bottom: 78px; }

/* ── FAB ── */
.fab {
  position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); right: 16px; z-index: 800;
  width: 52px; height: 52px; border-radius: 50%; border: none;
  background: var(--accent); color: #fff; font-size: 28px; font-weight: 300;
  cursor: pointer; box-shadow: 0 4px 16px rgba(255,143,171,0.4);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.fab:active { transform: scale(0.9); }
.fab.hidden { display: none; }

/* ── Bottom sheets ── */
.sheet-backdrop {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 950; backdrop-filter: blur(3px);
}
.sheet-backdrop.open { display: block; animation: fadeIn 0.15s ease; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 960;
  background: var(--bg-card); border: 1px solid var(--border); border-bottom: none;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-lg);
  max-width: 520px; margin: 0 auto; max-height: 72vh; max-height: 72dvh;
  display: none; flex-direction: column;
}
.sheet.open { display: flex; animation: slideUp 0.2s ease; }
.sheet-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 8px; flex-shrink: 0;
}
.sheet-title { font-size: 15px; font-weight: 700; }
.sheet-close {
  background: none; border: none; color: var(--text-muted); font-size: 22px;
  cursor: pointer; min-width: 44px; min-height: 44px; border-radius: var(--radius); font-family: inherit;
}
.sheet-close:active { background: var(--border-light); }
.sheet-tabs { display: flex; gap: 6px; padding: 0 16px 10px; flex-shrink: 0; }
.sheet-tab {
  flex: 1; padding: 8px 6px; border-radius: 18px; border: 1px solid var(--border);
  background: var(--bg-input); color: var(--text-secondary); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all var(--transition); min-height: 44px; white-space: nowrap;
}
.sheet-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sheet-body { overflow-y: auto; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); }
#itemSheet { z-index: 900; max-height: 52vh; max-height: 52dvh; }

.cat-section-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 12px 0 6px; }
.cat-row {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 10px 12px; margin-bottom: 6px; min-height: 44px;
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text-primary); font-family: inherit; font-size: 13px; cursor: pointer;
  transition: all var(--transition);
}
.cat-row:active { background: var(--bg-card-hover); }
.cat-dot { width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; border: 1px solid var(--border); }
.cat-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-dims { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.cat-memo { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Modal (index.html と同型) ── */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-end;
  backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; animation: fadeIn 0.15s ease; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px;
  width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close {
  background: none; border: none; color: var(--text-muted); font-size: 22px;
  cursor: pointer; min-width: 44px; min-height: 44px; border-radius: var(--radius); font-family: inherit;
}
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions button { flex: 1; min-height: 44px; }
.btn-primary {
  padding: 12px; border: none; border-radius: var(--radius); background: var(--accent);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; min-height: 44px;
}
.btn-secondary {
  padding: 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text-primary); font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: inherit; min-height: 44px;
}
.btn-danger {
  padding: 12px; border: none; border-radius: var(--radius); background: var(--accent-red);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; min-height: 44px;
}

/* ── Form ── */
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-input); color: var(--text-primary); font-size: 14px; font-family: inherit;
  outline: none; transition: border-color var(--transition); min-height: 44px;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 52px; }
.form-row { display: flex; gap: 8px; }
.form-row .form-group { flex: 1; min-width: 0; }
input[type="color"].form-input { padding: 4px 6px; height: 44px; cursor: pointer; }

/* ── ★v2.0 カラーバリエーション スウォッチ + 床面高トグル ── */
.color-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch {
  width: 44px; height: 44px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 2px solid var(--border); transition: all var(--transition);
}
.color-swatch:active { transform: scale(0.92); }
.color-swatch.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.color-name { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

<body>

<!-- 未ログイン -->
<div class="screen" id="authScreen">
  <div class="login-heart">🏠</div>
  <div class="login-title">nozaROOM</div>

  <a class="login-link" href="index.html">メモアプリを開く</a>
</div>

<!-- 担当者選択 -->
<div class="screen" id="nameScreen">
  <div class="login-heart">🏠</div>
  <div class="name-title">あなたはどっち？</div>
  <div class="name-buttons">
    <button class="name-btn" onclick="selectName('有彩')">有彩</button>
    <button class="name-btn" onclick="selectName('朝輝')">朝輝</button>
  </div>
</div>

<!-- 本体 -->
<div class="screen" id="appScreen">
  <header class="app-header">
    <div class="app-header-left">
      <a class="back-link" href="index.html">← メモ</a>
      <span class="app-title">🏠 nozaROOM</span>
    </div>
    <div class="app-header-right">
      <span class="user-badge" id="userBadge"></span>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="テーマ切替">🌙</button>
    </div>
  </header>

  <div class="room-tabs" id="roomTabs"></div>
  <div class="plan-bar" id="planBar"></div>
  <div class="zone-chips" id="zoneChips" style="display:none;"></div>

  <div id="viewport">
    <div class="vp-controls tl">
      <div class="mode-seg">
        <button class="vp-btn active" id="modeViewBtn" onclick="setMode('view')">👁 視点</button>
        <button class="vp-btn" id="modePlaceBtn" onclick="setMode('place')">✋ 配置</button>

      <button class="vp-btn" onclick="setCamera('iso')" title="斜め視点">斜め</button>
      <button class="vp-btn" onclick="setCamera('eye')" title="室内視点(目線140cm)">室内</button>
      <button class="vp-btn active" id="outletBtn" onclick="toggleOutlets()" title="コンセント表示">🔌</button>

      <button class="vp-btn" id="nameBtn" onclick="toggleNames()" title="要素ID表示 (壁・ドア・窓・設備の名前)">🏷</button>

    <div id="tooltip"></div>
    <div id="dimLabel"></div>
    <div id="drawerLabels"></div>

      <button class="vp-btn" id="nameFindBtn" title="この要素へフォーカス">🔍</button>
    </div>

    <button class="gizmo-btn" id="gizmoRot" aria-label="90度回転">↻</button>
  </div>

  <button class="fab" id="fab" onclick="openFurnSheet()" aria-label="家具を置く">+</button>

<div class="sheet-backdrop" id="furnBackdrop" onclick="closeFurnSheet()"></div>
<div class="sheet" id="furnSheet" role="dialog" aria-label="家具を置く">
  <div class="sheet-header">
    <div class="sheet-title">＋ 家具を置く</div>
    <button class="sheet-close" onclick="closeFurnSheet()" aria-label="閉じる">&times;</button>

  <div class="sheet-tabs">
    <button class="sheet-tab active" id="ftabCatalog" onclick="setFurnTab('catalog')">カタログ</button>
    <button class="sheet-tab" id="ftabPlaced" onclick="setFurnTab('placed')">配置済み</button>
    <button class="sheet-tab" id="ftabFree" onclick="setFurnTab('free')">自由サイズ</button>
  </div>
  <div class="sheet-body" id="furnBody"></div>

    <button class="btn-secondary" onclick="expandItemSheet()" aria-label="詳細を開く">⌃</button>
  </div>
  <div class="sheet-header" id="itemSheetHeader">
    <div class="sheet-title" id="itemSheetTitle">家具</div>
    <div style="display:flex;gap:2px;">
      <button class="sheet-close" onclick="collapseItemSheet()" aria-label="折りたたむ" title="折りたたんで3Dを見る">⌄</button>
      <button class="sheet-close" onclick="closeItemSheet()" aria-label="閉じる">&times;</button>
    </div>
  </div>
  <div class="sheet-body" id="itemBody"></div>
</div>

let trapEl = null, lastFocus = null;
function trapFocus(el) { trapEl = el; lastFocus = document.activeElement; }
function releaseTrap() { trapEl = null; if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} } lastFocus = null; }
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab' || !trapEl) return;
  const f = trapEl.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]');
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (!trapEl.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
}, true);

function openModal(title, bodyHtml) {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.classList.add('modal-open');
  trapFocus(document.getElementById('modal'));
}
let modalOnCancel = null;   // ★v1.8 confirmModal のキャンセル時コールバック (Esc/背景クリックでも発火)
function closeModalFn() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.classList.remove('modal-open');
  releaseTrap();
  const c = modalOnCancel;
  modalOnCancel = null;
  if (c) c();
}
window.closeModal = function (e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  closeModalFn();
};
// ★v1.8 native confirm() 置き換え: アプリ内モーダルの確認ダイアログ (openModal 流儀)
function confirmModal(title, msg, okLabel, onOk, onCancel) {
  openModal(title,
    '<div style="font-size:13px;color:var(--text-secondary);line-height:1.7;">' + esc(msg) + '</div>' +
    '<div class="modal-actions"><button class="btn-secondary" id="cmCancel">キャンセル</button>' +
    '<button class="btn-danger" id="cmOk">' + esc(okLabel || 'OK') + '</button></div>');
  modalOnCancel = onCancel || null;
  document.getElementById('cmOk').onclick = function () {
    modalOnCancel = null;
    closeModalFn();
    onOk();
  };
  document.getElementById('cmCancel').onclick = function () { closeModalFn(); };
}
function promptModal(title, label, defVal, cb) {
  openModal(title,
    '<div class="form-group"><label class="form-label">' + esc(label) + '</label>' +
    '<input class="form-input" id="pmInput" value="' + esc(defVal || '') + '"></div>' +
    '<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">キャンセル</button>' +
    '<button class="btn-primary" id="pmOk">OK</button></div>');
  const input = document.getElementById('pmInput');
  document.getElementById('pmOk').onclick = function () {
    const v = input.value.trim(); if (!v) return;
    closeModalFn(); cb(v);
  };
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('pmOk').click(); });
  setTimeout(function () { input.focus(); input.select(); }, 150);
}

// ═══════════════ Three.js シーン ═══════════════
let scene = null, camera = null, renderer = null, controls = null;
let furnGroup = null, selHelper = null;
const roomGroups = {};      // dataKey(部屋key) -> THREE.Group
const furnMeshes = {};      // itemId -> mesh
const pickables = [];       // コンセント・設備 (ツールチップ用)
const outletMeshes = [];    // コンセントプレート (表示トグル用)
const roomBBox = {};        // 部屋key -> {minX,maxX,minZ,maxZ}
let allBBox = null;
let camPreset = 'iso';

function group(dk) {
  if (!roomGroups[dk]) { const g = new THREE.Group(); g.name = dk; scene.add(g); roomGroups[dk] = g; }
  return roomGroups[dk];
}
function mat(color, opts) { return new THREE.MeshLambertMaterial(Object.assign({ color: color }, opts || {})); }
function addBox(g, sx, sy, sz, cx, cy, cz, color, extra) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat(color));
  m.position.set(cx, cy, cz);
  if (extra) Object.assign(m.userData, extra);
  g.add(m);
  return m;
}
function pointInPoly(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > pt[1]) !== (yj > pt[1])) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function buildFloor(room) {
  const shape = new THREE.Shape(room.poly.map(function (p) { return new THREE.Vector2(p[0], p[1]); }));
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: FLOOR_COLORS[room.floor] || 0xc8a882, side: THREE.DoubleSide }));
  m.position.y = room.key.indexOf('balcony') === 0 ? -2 : 0;
  m.userData.kind = 'floor';
  group(room.key).add(m);
}

// バルコニーの建物側エッジ判定 (そこには手すりを描かない)
function touchesBuilding(horiz, c, a, b) {
  return R.rooms.some(function (r) {
    if (r.key.indexOf('balcony') === 0) return false;
    const poly = r.poly;
    for (let i = 0; i < poly.length; i++) {
      const q1 = poly[i], q2 = poly[(i + 1) % poly.length];
      const qh = Math.abs(q1[1] - q2[1]) < 0.01;
      if (qh !== horiz) continue;
      const qc = qh ? q1[1] : q1[0];
      if (Math.abs(qc - c) > 25) continue;
      const qa = qh ? Math.min(q1[0], q2[0]) : Math.min(q1[1], q2[1]);
      const qb = qh ? Math.max(q1[0], q2[0]) : Math.max(q1[1], q2[1]);
      if (Math.min(qb, b) - Math.max(qa, a) > 10) return true;
    }
    return false;
  });
}

// ★v1.9 壁の透過: カメラと注視点 (部屋中心) の間にある壁メッシュを毎フレーム半透明化する。
//        markWallGhostable で壁平面 (horiz + c) を記録し、animate 内 updateWallGhost で判定。
const wallGhostMeshes = [];
const wallSegMeshes = [];   // ★v3.9 床〜天井の実壁区画メッシュ (要素ID の紐づけ対象)
function markWallGhostable(m, horiz, c) {
  m.userData.wallPlane = { horiz: horiz, c: c };
  m.userData.baseOpacity = (m.material.opacity !== undefined && m.material.transparent) ? m.material.opacity : 1;
  m.userData.baseTransparent = !!m.material.transparent;
  wallGhostMeshes.push(m);
}
function updateWallGhost() {
  if (!camera || !controls) return;
  const t = controls.target;
  for (let i = 0; i < wallGhostMeshes.length; i++) {
    const m = wallGhostMeshes[i];
    const w = m.userData.wallPlane;
    const camSide = (w.horiz ? camera.position.z : camera.position.x) - w.c;
    const tgtSide = (w.horiz ? t.z : t.x) - w.c;
    const occ = camSide * tgtSide < -0.001;          // 壁平面がカメラと注視点を分ける = 手前の壁
    if (m.userData.dimMat && m.material === m.userData.dimMat) continue;  // 他部屋淡色化中はそのまま
    const mtl = m.material;
    if (occ) {
      if (!mtl.transparent || mtl.opacity !== 0.12) {
        mtl.transparent = true; mtl.opacity = 0.12; mtl.depthWrite = false; mtl.needsUpdate = true;
      }
    } else if (mtl.opacity === 0.12 || mtl.transparent !== m.userData.baseTransparent) {
      mtl.transparent = m.userData.baseTransparent; mtl.opacity = m.userData.baseOpacity;
      mtl.depthWrite = true; mtl.needsUpdate = true;
    }
  }
}

function openingRange(o) {
  const oh = Math.abs(o.wallFrom[1] - o.wallTo[1]) < 0.01;
  return {
    horiz: oh,
    c: oh ? o.wallFrom[1] : o.wallFrom[0],
    a: oh ? Math.min(o.wallFrom[0], o.wallTo[0]) : Math.min(o.wallFrom[1], o.wallTo[1]),
    b: oh ? Math.max(o.wallFrom[0], o.wallTo[0]) : Math.max(o.wallFrom[1], o.wallTo[1])
  };
}

// ═══ ★v6.4 開口描画のラッパ ═══
//   ① buildOpeningPanel が作った全メッシュに opId を刻む → 三方枠・上レール・戸袋を押しても
//      どの建具 (D-06 等) の部材かが一意に引ける。
//   ② 窓 (WIN-) はガラスが pickables に入っていなかったので クリックできなかった → 登録する。
//   ③ 開口 (OP-) は建具が無くメッシュゼロ → クリック判定専用の不可視パネル (pickOnly) を立てる。
function buildOpeningPanelTagged(g, o, s, e, sill, top, horiz, wc, outSign, c) {
  const n0 = g.children.length;
  buildOpeningPanel(g, o, s, e, sill, top, horiz, wc, outSign, c);
  for (let i = n0; i < g.children.length; i++) {
    const m = g.children[i];
    if (!m || !m.userData) continue;
    if (!m.userData.opId) m.userData.opId = o.id;
    if (o.type === 'window' && m.isMesh && !m.userData.kind) {
      m.userData.kind = 'opening';
      m.userData.info = o.label || '窓';
      pickables.push(m);
    }
  }
  if (o.type === 'open') {
    const len = e - s, hgt = top - sill;
    if (len > 1 && hgt > 1) {
      // ★v6.4-a 開口の不可視パネルは 部屋側の壁面のすぐ手前 (壁中心 wc だと 開口の裏の設備が手前に来て拾えない)
      const face = (c === undefined || c === null) ? wc : c;
      const pc = face - outSign * 1.2;
      const pm = new THREE.Mesh(
        new THREE.BoxGeometry(horiz ? len : 1.6, hgt, horiz ? 1.6 : len),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
      pm.position.set(horiz ? (s + e) / 2 : pc, sill + hgt / 2, horiz ? pc : (s + e) / 2);
      pm.userData.kind = 'opening';
      pm.userData.info = o.label || '開口';
      pm.userData.opId = o.id;
      pm.userData.pickOnly = true;   // setFocus の淡色化対象外 (不可視のままに保つ)
      g.add(pm);
      pickables.push(pm);
    }
  }
}

function buildWalls(room) {
  const g = group(room.key);
  const isBal = room.key.indexOf('balcony') === 0;
  const H = isBal ? 110 : CH;
  const railMat = isBal ? new THREE.MeshLambertMaterial({ color: 0xf2f4f6, transparent: true, opacity: 0.45 }) : null;
  const poly = room.poly, n = poly.length;
  for (let i = 0; i < n; i++) {
    const p1 = poly[i], p2 = poly[(i + 1) % n];
    const horiz = Math.abs(p1[1] - p2[1]) < 0.01;
    const c = horiz ? p1[1] : p1[0];
    const a = horiz ? Math.min(p1[0], p2[0]) : Math.min(p1[1], p2[1]);
    const b = horiz ? Math.max(p1[0], p2[0]) : Math.max(p1[1], p2[1]);
    if (b - a < 0.5) continue;
    const inNeg = pointInPoly(horiz ? [(a + b) / 2, c - 2] : [c - 2, (a + b) / 2], poly);
    const outSign = inNeg ? 1 : -1;                 // 壁は境界線から外側へ WT 分
    if (isBal && touchesBuilding(horiz, c, a, b)) continue;
    const wc = c + outSign * WT / 2;                // 壁中心線
    // このエッジに載る開口 (壁厚10〜18cmをまたぐ相手室定義の開口も許容12cmで拾う)
    const ops = R.openings.map(function (o) { return { o: o, r: openingRange(o) }; })
      .filter(function (x) {
        return x.r.horiz === horiz && Math.abs(x.r.c - c) <= OPEN_MATCH_TOL && Math.min(x.r.b, b) - Math.max(x.r.a, a) > 2;   // ★v6.7
      })
      .map(function (x) { return { o: x.o, s: Math.max(x.r.a, a), e: Math.min(x.r.b, b) }; })
      .sort(function (x, y) { return x.s - y.s; });
    function seg(s, e, y0, y1) {
      if (e - s < 0.5 || y1 - y0 < 0.5) return;
      const len = e - s, hgt = y1 - y0, mid = (s + e) / 2;
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(horiz ? len : WT, hgt, horiz ? WT : len),
        railMat ? railMat.clone() : mat(WALL_COLOR));
      m.position.set(horiz ? mid : wc, y0 + hgt / 2, horiz ? wc : mid);
      markWallGhostable(m, horiz, c);   // ★v1.9 手前壁の自動半透明化 対象
      // ★v3.9 床〜天井の実壁区画だけを「要素ID付きのクリック対象」に登録 (垂れ壁・腰壁は対象外)。
      //        pickInfo 側で 🏷 ON のときだけ拾うので、既定の操作感 (壁クリック=選択解除) は不変。
      if (y0 <= 0.01 && y1 >= H - 0.01) {
        m.userData.kind = 'wall';
        m.userData.wallSeg = { room: room.key, horiz: horiz, c: c, from: s, to: e };
        wallSegMeshes.push(m);
        pickables.push(m);
      }
      g.add(m);
    }
    let cur = a;
    for (let k = 0; k < ops.length; k++) {
      const o = ops[k].o, s = ops[k].s, e = ops[k].e;
      if (s > cur) seg(cur, s, 0, H);
      const sill = o.sillH || 0;
      const top = Math.min(sill + (o.height || 200), H);
      if (o.type === 'window') {
        if (sill > 2) seg(s, e, 0, sill);
        if (top < H - 1) seg(s, e, top, H);
      } else {
        if (top < H - 1) seg(s, e, top, H);        // 鴨居上の壁
      }
      // ガラス/ドアパネルは開口を定義した部屋のエッジ処理時に1回だけ描く
      if (o.room === room.key) buildOpeningPanelTagged(g, o, s, e, sill, top, horiz, wc, outSign, c);   // ★v6.4
      cur = Math.max(cur, e);
    }
    if (cur < b) seg(cur, b, 0, H);
  }
}

// ★v2.2[8] ドア開閉レジストリ: クリックで開閉トグル (視覚状態のみ・保存対象外)。
//          各ドアの可動パーツは closed/open のトランスフォームを組で持ち、即時切替する。
const doors = {};
let doorSeq = 0;
function toggleDoor(id, pi) {
  const d = doors[id];
  if (!d) return;
  if (d.kind === 'bypass2') {
    // ★v2.7 引違い2枚の3状態トグル: 閉 → クリックしたパネル側 (pi=0: s側=北/西, pi=1: e側=南/東) を開く。
    //        開いている状態から再クリック (どのパネルでも) → 閉。実物の引違いと同じ挙動
    let msg;
    if (d.state !== 0) {
      d.state = 0; msg = ' を閉めました';
    } else {
      d.state = pi === 0 ? 1 : 2;
      msg = ' の' + d.sideNames[d.state - 1] + '側を開けました';
    }
    d.open = d.state !== 0;
    d.parts.forEach(function (p) {
      const du = (d.state === 1 && p.pi === 0) ? d.shiftS :
                 (d.state === 2 && p.pi === 1) ? d.shiftE : 0;
      p.mesh.position.x = p.cx + (d.horiz ? du : 0);
      p.mesh.position.z = p.cz + (d.horiz ? 0 : du);
    });
    toast('🚪 ' + (d.label || 'ドア') + msg);
    return;
  }
  d.open = !d.open;
  d.parts.forEach(function (p) {
    p.mesh.position.x = d.open ? p.ox : p.cx;
    p.mesh.position.z = d.open ? p.oz : p.cz;
    p.mesh.rotation.y = d.open ? p.orot : p.crot;
  });
  toast('🚪 ' + (d.label || 'ドア') + (d.open ? ' を開けました' : ' を閉めました'));
}

// ★v2.3[9] 引き出し開閉レジストリ (キッチン本体東面 2列x2段 / リガーレ100KB 引出2段+スライドテーブル /
//          エトナ60OP スライド棚): クリックで開閉トグル (視覚シミュレーションのみ・保存対象外・衝突判定外)。
//          開くと引き出しボックスが実奥行きぶん前方へ突き出し、
//          「引き出し先端 → 前方の障害物 (壁/固定設備/他の家具)」の残り幅を cm ラベルで表示する。
const drawers = {};
let drawerSeq = 0;
function regDrawer(def) {
  // def: { id?, label, boxes:[mesh], depth, rayFn()->{origins:[Vector3], dir:Vector3, exclude, labelPos:Vector3} }
  const id = def.id || ('k' + (++drawerSeq));
  const prev = drawers[id];
  drawers[id] = Object.assign({ id: id, open: prev ? prev.open : false, remain: prev ? prev.remain : null }, def);
  drawers[id].boxes.forEach(function (m) { m.visible = drawers[id].open; });
  (drawers[id].hideOpen || []).forEach(function (m) { m.visible = !drawers[id].open; });   // ★v2.9 開時に隠す閉状態パーツ (洗濯機フタ)
  return id;
}
function drawerClearance(d) {
  // 引き出し正面(閉時の面)から開く方向へレイを飛ばし、最初の障害物までの距離 (cm) を測る。
  // 除外: 自分自身 (exclude 配下) / 開いている引き出しボックス (視覚のみの存在) / 床 (レイは水平)
  const info = d.rayFn();
  let best = null;
  const rc = new THREE.Raycaster();
  rc.far = 3000;
  info.origins.forEach(function (org) {
    rc.set(org, info.dir);
    const hits = rc.intersectObjects(scene.children, true);
    for (let i = 0; i < hits.length; i++) {
      const ob = hits[i].object;
      if (!ob.isMesh) continue;
      let p = ob, skip = false;
      while (p) {
        if (p === info.exclude || p.userData.drawerBox) { skip = true; break; }
        p = p.parent;
      }
      if (skip) continue;
      if (best === null || hits[i].distance < best) best = hits[i].distance;
      break;   // このレイの最初の有効ヒットのみ
    }
  });
  return best;
}
function toggleDrawer(id) {
  const d = drawers[id];
  if (!d) return;
  d.open = !d.open;
  d.boxes.forEach(function (m) { m.visible = d.open; });
  (d.hideOpen || []).forEach(function (m) { m.visible = !d.open; });   // ★v2.9 洗濯機フタ: 閉状態パーツと入替表示
  const pre = d.pre || (d.lidFn ? '🧺 ' : '🗄 ');   // ★v6.2 ゴミ箱のフタは 🗑
  if (d.open) {
    if (d.lidFn) {
      // ★v2.9 フタ固有の干渉判定 (上方障害物 + 後方張り出し17.3cm圏)。メッセージ・ラベルは lidFn が組み立てる
      const r = d.lidFn();
      d.remain = r.remain; d.labelText = r.label;
      toast(pre + r.msg);
    } else {
      const dist = drawerClearance(d);
      // originOff = レイ原点を面から浮かせた分の補正 (めり込み誤ヒット防止で 0.6〜1cm 浮かせている)
      d.remain = dist === null ? null : Math.max(0, Math.round(dist + (d.originOff || 0) - d.depth));
      d.labelText = null;
      toast(pre + d.label + ' を開けました' +
        (d.remain !== null ? ' — 先端から前方 残り約' + d.remain + 'cm' : ''));
    }
  } else {
    d.remain = null;
    d.labelText = null;
    toast(pre + d.label + ' を閉めました');
  }
}
// 開いている引き出しの「残り幅」小ラベル (dimLabel 方式の HTML オーバーレイ)
const drawerLabelEls = {};
function updateDrawerLabels() {
  const wrap = document.getElementById('drawerLabels');
  if (!wrap || !renderer) return;
  Object.keys(drawers).forEach(function (id) {
    const d = drawers[id];
    const dead = !d.boxes.length || !d.boxes[0].parent;
    const show = !dead && d.open && (d.remain !== null || d.labelText);   // ★v2.9 フタはlabelTextでも表示
    let el = drawerLabelEls[id];
    if (!show) {
      if (el) el.style.display = 'none';
      if (dead) { if (el) { wrap.removeChild(el); delete drawerLabelEls[id]; } delete drawers[id]; }
      return;
    }
    if (!el) {
      el = document.createElement('div');
      el.className = 'drawer-label';
      wrap.appendChild(el);
      drawerLabelEls[id] = el;
    }
    const info = d.rayFn();
    projV.copy(info.labelPos).project(camera);
    if (projV.z > 1) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = ((projV.x + 1) / 2 * renderer.domElement.clientWidth) + 'px';
    el.style.top = ((-projV.y + 1) / 2 * renderer.domElement.clientHeight) + 'px';
    el.textContent = d.labelText || ('残り' + d.remain + 'cm');   // ★v2.9 フタは干渉/後方余裕表示
  });
}

function buildOpeningPanel(g, o, s, e, sill, top, horiz, wc, outSign, c) {
  const len = e - s, hgt = top - sill, mid = (s + e) / 2, cy = sill + hgt / 2;
  if (len < 1 || hgt < 1) return;
  // ★v4.1【根本修正】引き戸パネルの奥行位置は **壁中心 wc ではなく 壁の室内側の面 face(=c)** を基準にする。
  //   旧実装は wc (= c + outSign*WT/2 = 面から 2.5cm 壁の中) を基準にしていたため、
  //   ・引違い2枚      → wc±1.6  = 面から +0.9 / +4.1
  //   ・戸袋の固定袖    → wc±4.4  = 面から −1.9 / +6.9
  //   ・片引き戸        → wc−4.4  = 面から −1.9
  //   と 部材ごとに 面からの距離がバラバラになり、真上ビューで「E壁のラインが階段状」に見えていた。
  //   v4.1 は 全部材を face 基準の固定オフセットに統一する:
  //     固定側 (袖パネル/ガラス/レール奥のパネル) : 背面が face にピタリ  → [face−PANEL_T, face]
  //     可動側 (引違いの手前レール / 片引き戸)     : その手前に SLIDE_OUT だけ出る
  const PANEL_T = 3.0;        // 建具パネル厚 (ROOM_DATA v4.0 meta.seFaces.panelT と一致)
  const RAIL_GAP = 0.4;       // 引違い2本レールの前後すき間
  const SLIDE_OUT = 3.6;      // アウトセット引き戸が壁面より手前に出る量 (背面まで)
  const face = (c === undefined || c === null) ? wc : c;
  const nearC = face - outSign * (PANEL_T / 2);                 // 室内側レール (手前) のパネル中心
  const farC = face + outSign * (RAIL_GAP + PANEL_T / 2);       // 壁側レール (奥) のパネル中心
  const outsetC = face - outSign * (SLIDE_OUT + PANEL_T / 2);   // アウトセット片引き戸のパネル中心
  // (along, cross) → Box の寸法と位置。horiz=true は along=x / cross=z、false は along=z / cross=x
  const boxAC = function (aC, aLen, cC, cThick, yC, yLen, col, meta) {
    return addBox(g, horiz ? aLen : cThick, yLen, horiz ? cThick : aLen,
                  horiz ? aC : cC, yC, horiz ? cC : aC, col, meta);
  };
  o.__drawn = true;   // ★v2.3 部屋エッジに載らない開口 (4.8帖CL=fixture面) を後段で拾うためのマーク
  if (o.type === 'window') {
    // 半透明ブルーのガラス + 黒枠
    const glass = new THREE.Mesh(
      new THREE.PlaneGeometry(len, hgt),
      new THREE.MeshBasicMaterial({ color: 0x8fc4ff, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
    if (!horiz) glass.rotateY(Math.PI / 2);
    glass.position.set(horiz ? mid : wc, cy, horiz ? wc : mid);
    g.add(glass);
    const frame = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(len, hgt)),
      new THREE.LineBasicMaterial({ color: 0x1a1a1a }));
    if (!horiz) frame.rotateY(Math.PI / 2);
    frame.position.copy(glass.position);
    g.add(frame);
    // 中桟 (縦1本) で窓らしく
    if (len > 60) {
      const mull = new THREE.Mesh(new THREE.BoxGeometry(horiz ? 2 : 3, hgt, horiz ? 3 : 2), mat(0x1a1a1a));
      mull.position.copy(glass.position);
      g.add(mull);
    }
  } else if (o.type === 'door' || o.type === 'sliding') {
    // ★v1.8 3色分け: 収納扉(クローゼット/WIC)=白い無垢パネル+枠 / 引き戸=グレー木目 / 居室開き戸=ブラウン
    // ★v2.2[4] ドア・引き戸パネルは壁の自動透過 (markWallGhostable) と部屋淡色化の対象外
    //          (LDKから見た洋室ドアが「ガラスの自動ドア」に見える問題の修正。Box=両面同色で両面同デザイン)
    // ★v2.2[8] クリックで開閉: doors レジストリに可動パーツを closed/open トランスフォーム付きで登録
    const door = doors['d' + (++doorSeq)] = {
      id: 'd' + doorSeq, open: false, parts: [],
      label: (o.label || 'ドア').split('(')[0].replace(/ ★.*/, '').trim()
    };
    const AX = function (u, v) { return horiz ? u : v; };   // (along, cross) → x
    const AZ = function (u, v) { return horiz ? v : u; };   // (along, cross) → z
    const addPart = function (m, openU, openV, openRot) {   // 可動パーツ登録
      m.userData.doorId = door.id;
      door.parts.push({ mesh: m, cx: m.position.x, cz: m.position.z, crot: m.rotation.y,
                        ox: AX(openU, openV), oz: AZ(openU, openV), orot: openRot || 0 });
    };
    // ★v2.3 sI = 開く側の絶対方向 (+ = +x/+z)。既定=部屋内側、ROOM_DATA の swing (N/S/E/W) が最優先
    let sI = -outSign;
    if (/外開き|廊下側へ開く/.test(o.label || '')) sI = -sI; // 外開き系は逆側へ
    if (o.swing) sI = (o.swing === 'S' || o.swing === 'E') ? 1 : -1;
    const hingePart = function (m, hu) {                     // ヒンジ回転 (90°) の開位置
      const du = (horiz ? m.position.x : m.position.z) - hu;
      const dv = (horiz ? m.position.z : m.position.x) - wc;
      const s2 = sI * (du >= 0 ? 1 : -1);   // ★v2.3 パーツ位置に依らず開く側 = sI (両開き両リーフ同方向 / ヒンジe対応)
      addPart(m, hu - dv * s2, wc + du * s2, Math.PI / 2);
    };
    const isStorage = /クローゼット|WIC/.test(o.label || '');
    if (isStorage) {
      // 収納扉: 不透明の白パネル + 枠 + 取っ手。両開きは2枚(★v2.3 leaves:4=2組両開き)に分割し、
      // 各リーフが外側ヒンジで90°開く (開く側は swing/部屋内側)
      const frame = addBox(g, horiz ? len : 3, hgt, horiz ? 3 : len, horiz ? mid : wc, cy, horiz ? wc : mid,
        0xcfc9bf, { kind: 'fixture', info: o.label || '収納扉', doorId: door.id });
      pickables.push(frame);                                 // 枠は静的 (クリック対象のみ)
      const leaves = o.leaves || (/両開き/.test(o.label || '') ? 2 : 1);
      const span = (len - 4) / leaves;
      const m4 = (s + e) / 2;
      for (let li = 0; li < leaves; li++) {
        const lc = s + 2 + span * (li + 0.5);
        let hu;                                              // 吊元: 各組の外側 (1枚扉は hinge 指定 or s側)
        if (leaves === 4) hu = [s + 2, m4 - 1, m4 + 1, e - 2][li];
        else if (leaves === 2) hu = li === 1 ? e - 2 : s + 2;
        else hu = o.hinge === 'e' ? e - 2 : s + 2;           // ★v2.3 WIC=吊元東(e)
        const leaf = addBox(g, horiz ? span - 2 : 5, hgt - 5, horiz ? 5 : span - 2,
          horiz ? lc : wc, cy - 1, horiz ? wc : lc, 0xf7f5f0, { kind: 'fixture', info: o.label || '収納扉' });
        hingePart(leaf, hu);
        pickables.push(leaf);
        const hoff = span * 0.42 * (li % 2 === 0 ? 1 : -1) * (leaves === 1 && o.hinge === 'e' ? -1 : 1);
        hingePart(addBox(g, horiz ? 2 : 7, 12, horiz ? 7 : 2,
          horiz ? lc + hoff : wc, cy, horiz ? wc : lc + hoff, 0x9a9a9a), hu);   // 取っ手 (組の召し合わせ側)
      }
      return;
    }
    const color = o.type === 'sliding' ? 0x7c6b5c : 0x6b4b38;   // 引き戸=グレー木目寄り / 開き戸=ダークブラウン
    if (o.type === 'sliding' && o.panels === 2) {
      // ★v2.1 引き戸2枚構成 (LDK⇔6.2 開口169 写真30/83): 各パネル≈len/2、レール前後に少しオフセット、
      //        黒引手は召し合わせ (中央) 寄りに1本ずつ
      // ★v2.7 引違い3状態 (ROOM_DATA v2.5): クリックしたパネル側が開く = 閉 / s側開 (北・西) / e側開 (南・東)。
      //   - s側パネルをクリック → e側パネルの前へスライドして重なり s側が通れる (戸袋不要 = 実物の引違い)
      //   - e側パネルをクリック → pocket (戸袋。LDK⇔6.2 は南端 y533..613.5=80.5) へ駐まり e側が通れる
      //   - 開いている状態で再クリック → 閉。pocket 無しの引違いも同じ3状態 (相手パネルの前に重なるのみ)
      const span = len / 2 + 1.5;
      const pkFix = o.pocketFixLen || 80.5;
      const closedU = [s + span / 2, e - span / 2];
      // 各状態で動くパネルの移動量: shiftS = s側パネル(pi0)がs側開時 / shiftE = e側パネル(pi1)がe側開時
      // (パネル85.5 > 戸袋80.5 のため戸袋駐まりは -0.7 の逃げ込みで開口側に ~6cm はみ出す = 現実準拠)
      const shiftS = (o.pocket === 'N' || o.pocket === 'W') ? (s - pkFix + 0.7 + span / 2) - closedU[0]
                                                            : closedU[1] - closedU[0];
      const shiftE = (o.pocket === 'S' || o.pocket === 'E') ? (e + pkFix - 0.7 - span / 2) - closedU[1]
                                                            : closedU[0] - closedU[1];
      door.kind = 'bypass2';                       // ★v2.7 3状態トグルは toggleDoor 側で処理
      door.state = 0;                              // 0=閉 / 1=s側開 / 2=e側開
      door.horiz = horiz;
      door.sideNames = horiz ? ['西', '東'] : ['北', '南'];
      door.shiftS = shiftS; door.shiftE = shiftE;
      for (let pi = 0; pi < 2; pi++) {
        const pc = closedU[pi];
        const off = (pi === 0 ? nearC : farC);   // ★v4.1 face 基準 (旧 wc±1.6)
        const pnl = addBox(g, horiz ? span : PANEL_T, hgt, horiz ? PANEL_T : span,
          horiz ? pc : off, cy, horiz ? off : pc, color, { kind: 'fixture', info: o.label || 'ドア' });
        pnl.userData.doorId = door.id; pnl.userData.panelIdx = pi;   // ★v2.7 どちらのパネルをクリックしたか
        door.parts.push({ mesh: pnl, cx: pnl.position.x, cz: pnl.position.z, crot: 0, pi: pi });
        pickables.push(pnl);
        // ★v4.1 黒スリット引手は **各パネルの外側の端** (写真30: 左パネルの左端 / 右パネルの右端)。
        //        旧実装は 召し合わせ (中央) 寄りで 実物と逆だった。
        const hp = (pi === 0 ? s + len * 0.045 : e - len * 0.045);
        const hdl = addBox(g, horiz ? 2.5 : 4.4, 14, horiz ? 4.4 : 2.5,
          horiz ? hp : off - outSign * 0.4, cy - 8, horiz ? off - outSign * 0.4 : hp, 0x1c1c1e);
        door.parts.push({ mesh: hdl, cx: hdl.position.x, cz: hdl.position.z, crot: 0, pi: pi });
        if (pi === 1) {
          // ★v4.1 召し合わせ (中央) の 引違い錠 = 写真30 の黒い座 (床上 ≈144)
          const lk = boxAC(mid + span * 0.03, 7, off - outSign * 0.5, 1.2, sill + hgt * 0.60, 6, 0x1c1c1e);
          door.parts.push({ mesh: lk, cx: lk.position.x, cz: lk.position.z, crot: 0, pi: pi });
        } else {
          // ★v4.1 召し合わせの目地 (2枚の境目。写真30 で はっきり縦線が出る)
          const sm = boxAC(mid - span * 0.008, 1.0, off - outSign * 0.6, 1.0, cy, hgt - 1, 0x3a3029);
          door.parts.push({ mesh: sm, cx: sm.position.x, cz: sm.position.z, crot: 0, pi: pi });
        }
      }
      if (o.casing) {
        // ★v4.1 三方枠 (写真30: ダーク木目の枠が スタブ〜壁の間に立つ)。静的パーツ
        // 枠は「戸より手前」に出す (戸 = face−3..face / 枠 = face−6.2..face−3.6)。同じ深さだと手前パネルに隠れる
        const CW = 3.6, CD = 2.6, cc = face - outSign * (SLIDE_OUT + CD / 2);
        boxAC(s + CW / 2, CW, cc, CD, cy, hgt, 0x4a382c, { kind: 'fixture', info: '引き戸 三方枠' });
        boxAC(e - CW / 2, CW, cc, CD, cy, hgt, 0x4a382c, { kind: 'fixture', info: '引き戸 三方枠' });
        boxAC(mid, len, cc, CD, top - 3.0, 6.0, 0x4a382c, { kind: 'fixture', info: '引き戸 上枠' });
      }
      if (o.pocket) {
        // ★v2.7 戸袋の固定袖パネル (ROOM_DATA v2.5 pocket_panel fixture の3D実体。LDK⇔6.2 は南端 y533..613.5):
        //        戸と同材・可動2枚の反対側レール面 (6.2側)。ドア一式扱い = クリックで開閉・淡色化/透過の対象外。
        //        静的パーツ (door.parts に入れない)
        //  - 開口側へ +6.5cm 延長: 閉時パネル (別レール面) の裏に袖端を重ねて 深さ段差の隙間スリットを消す。
        //    e側開時は 駐まったパネルの開口内はみ出し (~+6cm) と一致し 実効開口の見た目も現実準拠
        //  - 反開口側は pocketLen-pocketFixLen 延長 (v2.5=0: 戸袋南端は廊下北壁角 y613.5 に面一)
        const innerExt = 6.5, outerExt = (o.pocketLen || pkFix) - pkFix;
        const fixLen = pkFix + innerExt + outerExt;
        const pkC = (o.pocket === 'N' || o.pocket === 'W') ? s + innerExt - fixLen / 2 : e - innerExt + fixLen / 2;
        // ★v4.0[1] 固定袖は「戸袋へ引き込むパネルの反対側レール面」= 可動2枚のうち片方と **同一平面** に置く。
        //   旧 `wc - outSign * 4.4` は 可動 (wc±1.6) とは別の 3枚目の面になり、真上から見ると
        //   [可動0][可動1][固定袖] が 階段状の3本のラインになっていた (「ドアが3枚に見える」の一因)。
        //   pocket が s側 (N/W) なら 戸袋へ入るのは pi=0 なので 固定袖は pi=1 と同じ +1.6、逆なら -1.6。
        const fOff = ((o.pocket === 'N' || o.pocket === 'W') ? farC : nearC);   // ★v4.1 face 基準
        const fixPnl = addBox(g, horiz ? fixLen : PANEL_T, hgt, horiz ? PANEL_T : fixLen,
          horiz ? pkC : fOff, cy, horiz ? fOff : pkC, color,
          { kind: 'fixture', info: '戸袋 固定袖パネル (' + (o.label || 'ドア').split('(')[0] + ')', doorId: door.id });
        fixPnl.userData.panelIdx = (o.pocket === 'N' || o.pocket === 'W') ? 0 : 1;   // ★v2.7 固定袖クリック=戸袋側を開ける
        pickables.push(fixPnl);
      }
      return;
    }
    if (o.type === 'sliding') {
      // ★v2.2[8] 片引き戸: slideDir (ROOM_DATA v2.2) の方向へパネル長ぶんスライドして開く
      //          (玄関→LDK: 東へ固定袖パネルの前に駐まる ★v2.3 / 4.8帖: 東へ 178..260 / 洗面: 東へ ★v2.3)
      // ★v2.3 パネル面はアウトセット (開口を定義した部屋側の壁面のすぐ前 pc = wc - outSign*4.4)。
      //        壁中心 wc に置くと開放時に駐まり先の壁の中へ埋まって見えなくなる (洗面/4.8 で発生していた)
      const pc = outsetC;   // ★v4.1 face 基準 (旧 wc − outSign*4.4)。固定袖パネル [face−3, face] の手前に立つ
      const panel = addBox(g, horiz ? len : PANEL_T, hgt, horiz ? PANEL_T : len, horiz ? mid : pc, cy, horiz ? pc : mid, color,
        { kind: 'fixture', info: o.label || 'ドア' });
      pickables.push(panel);
      const dAlong = (o.slideDir === 'E' || o.slideDir === 'S') ? 1 : (o.slideDir ? -1 : 1);
      const shift = len * dAlong;
      if (o.outsetRail) {
        // ★v4.1 アウトセット引き戸の上レール (写真37: 天井際の細い金属バーが 走行先へ伸びる)。静的パーツ
        const RL = len + (o.railExtend || len), rC = mid + dAlong * (o.railExtend || len) / 2;
        boxAC(rC, RL, face - outSign * 2.2, 2.2, CH - 2.4, 2.4, 0xb9bdc2,
              { kind: 'fixture', info: 'アウトセット引き戸 上レール' });
      }
      addPart(panel, mid + shift, pc, 0);
      // ★v1.9 黒引手 (写真30: グレー木目引き戸の縦長黒スリット引手)
      const hp = s + len * 0.12;
      const hdl = addBox(g, horiz ? 2.5 : 4.4, 12, horiz ? 4.4 : 2.5,
        horiz ? hp : pc, cy, horiz ? pc : hp, 0x1c1c1e);
      addPart(hdl, hp + shift, pc, 0);
      if (o.petDoor) {
        // ★v2.3 petPos: ペット戸のパネル内位置 (玄関引き戸=W端寄り。写真37: 閉時シューズBOXコーナー直東)
        const pu = (o.petPos === 'W' || o.petPos === 'N') ? s + 17 :
                   (o.petPos === 'E' || o.petPos === 'S') ? e - 17 : mid;
        const pd = addBox(g, horiz ? 26 : 4.5, 30, horiz ? 4.5 : 26, horiz ? pu : pc, 16, horiz ? pc : pu, 0x24211e);
        addPart(pd, pu + shift, pc, 0);
      }
    } else {
      // 開き戸: ヒンジ端で90°回転して開く (既定=s側ヒンジ、o.hinge:'e' or ラベル『ヒンジ南』= e側 ★v2.3)
      const panel = addBox(g, horiz ? len : 3, hgt, horiz ? 3 : len, horiz ? mid : wc, cy, horiz ? wc : mid, color,
        { kind: 'fixture', info: o.label || 'ドア' });
      pickables.push(panel);
      const hu = (o.hinge === 'e' || /ヒンジ南/.test(o.label || '')) ? e - 1.5 : s + 1.5;
      hingePart(panel, hu);
      if (o.petDoor) {
        const pd = addBox(g, horiz ? 26 : 4.5, 30, horiz ? 4.5 : 26, horiz ? mid : wc, 16, horiz ? wc : mid, 0x24211e);
        hingePart(pd, hu);
      }
    }
  }
  // type 'open' (上がり框等) はパネルなし
}

function buildFixture(f) {
  const st = FIX_STYLE[f.type];
  if (!st) return;                                   // entrance / balcony は床・手すりで表現済み
  const g = group(f.room);
  const color = f.color ? new THREE.Color(f.color).getHex() : st.color;
  const topH = f.h || st.h;                          // h = 上端高さ
  const botH = f.bottomH || 0;                       // ★v1.7 bottomH = 下端高さ (吊戸棚・棚・壁付け機器)
  const bh = Math.max(topH - botH, 1);
  if (f.poly) {
    // ★v1.7 poly 近似 (斜め上がり框等): XY Shape → 床平面へ回転、上端 topH まで押し出し
    const shape = new THREE.Shape(f.poly.map(function (p) { return new THREE.Vector2(p[0], p[1]); }));
    const geo = new THREE.ExtrudeGeometry(shape, { depth: bh, bevelEnabled: false });
    geo.rotateX(Math.PI / 2);                        // 押し出しは -Y 方向になる
    const pm = new THREE.Mesh(geo, mat(color));
    pm.position.y = topH;
    pm.userData.kind = 'fixture'; pm.userData.info = f.label;
    g.add(pm); pickables.push(pm);
    return;
  }
  const x = f.rect[0], y = f.rect[1], dx = f.rect[2], dy = f.rect[3];
  const sx = Math.max(dx - 1, 1.5), sz = Math.max(dy - 1, 1.5);
  const cx = x + dx / 2, cy = botH + bh / 2, cz = y + dy / 2;
  let body;
  if (f.type === 'slide_zone') {
    // ★v2.2[9] 引き戸スライドゾーン: 床マーカー (薄板) のみ描画。衝突判定は solidFixtures 側で全高ブロック
    body = new THREE.Mesh(new THREE.BoxGeometry(sx, 0.8, sz),
      new THREE.MeshLambertMaterial({ color: 0xcfc3b3, transparent: true, opacity: 0.6 }));
    body.position.set(cx, 0.4, cz);
    body.userData.kind = 'fixture'; body.userData.info = f.label;
    g.add(body);
    pickables.push(body);
    return;
  }
  if (f.type === 'washer_pan') {
    // ★v6.6 かさ上げ(高床)タイプの防水パン — 写真41・42 実物準拠。
    //   ・全高 topH (=16.5cm) の天面が 洗濯機の設置面。ユーザー実測「天面→蛇口115cm」の基準面。
    //   ・天面は外周リブが立ち上がり、内側は一段下がったデッキ (basin)。四隅は脚受けの凹み。
    //   ・右奥 (北東寄り) に排水トラップ (丸い目皿 + 白いトラップ本体 + 横向きの排水口)。
    //   衝突ブロックはしない (洗濯機をパンに載せられる)。適合は checkWasherPanFit がトースト判定。
    const info = { kind: 'fixture', info: f.label };
    const RIB = 4.0;                                   // 外周リブの幅
    const DECK = Math.max(topH - 3.2, 1.0);            // 内側デッキ (basin) の高さ
    const SKIRT = color, DECKC = 0xf7f6f2, CUP = 0xe6e3dd, TRAPC = 0xe8e6e0, GRATEC = 0xb4b8bd;
    const body = addBox(g, dx, DECK, dy, cx, DECK / 2, cz, SKIRT, info);              // スカート本体 (床〜デッキ)
    pickables.push(body);
    addBox(g, dx - 2 * RIB + 0.6, 0.5, dy - 2 * RIB + 0.6, cx, DECK + 0.25, cz, DECKC, info);  // デッキ面
    [[cx, y + RIB / 2, dx, RIB], [cx, y + dy - RIB / 2, dx, RIB],
     [x + RIB / 2, cz, RIB, dy - 2 * RIB], [x + dx - RIB / 2, cz, RIB, dy - 2 * RIB]
    ].forEach(function (rb) {                                                         // 天面の外周リブ (4辺)
      pickables.push(addBox(g, rb[2], topH - DECK, rb[3], rb[0], (topH + DECK) / 2, rb[1], SKIRT, info));
    });
    const PW = 11, PT = 2.0, PH = 1.3;                 // 脚受け: 一回り高い枠 → 中央がへこんで見える
    [[x + RIB + PW / 2 + 1, y + RIB + PW / 2 + 1], [x + dx - RIB - PW / 2 - 1, y + RIB + PW / 2 + 1],
     [x + RIB + PW / 2 + 1, y + dy - RIB - PW / 2 - 1], [x + dx - RIB - PW / 2 - 1, y + dy - RIB - PW / 2 - 1]
    ].forEach(function (p) {
      const yy = DECK + 0.5 + PH / 2;
      addBox(g, PW, PH, PT, p[0], yy, p[1] - PW / 2 + PT / 2, CUP, info);
      addBox(g, PW, PH, PT, p[0], yy, p[1] + PW / 2 - PT / 2, CUP, info);
      addBox(g, PT, PH, PW - 2 * PT, p[0] - PW / 2 + PT / 2, yy, p[1], CUP, info);
      addBox(g, PT, PH, PW - 2 * PT, p[0] + PW / 2 - PT / 2, yy, p[1], CUP, info);
    });
    const tx = x + dx * 0.80, tz = y + dy * 0.28;      // 排水トラップ (右奥 = 東寄り・壁側)
    const grate = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.2, 1.0, 20), mat(GRATEC));
    grate.position.set(tx, DECK + 0.9, tz);
    Object.assign(grate.userData, info); g.add(grate); pickables.push(grate);
    const tb = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 4.0, 5.4, 16), mat(TRAPC));
    tb.position.set(tx + 1.4, DECK + 3.4, tz);
    Object.assign(tb.userData, info); g.add(tb); pickables.push(tb);
    const sp = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.0, 5.6, 14), mat(TRAPC));
    sp.rotation.z = Math.PI / 2;
    sp.position.set(tx + 4.6, DECK + 4.6, tz);
    Object.assign(sp.userData, info); g.add(sp);
    return;
  }
  if (f.type === 'wall_shelf') {
    // ★v6.6 洗面脱衣室 上部の白い棚板 (写真41・42): 棚板 + L字ブラケット2本 (壁プレート/水平アーム/斜め筋交い)
    const info = { kind: 'fixture', info: f.label };
    const MET = 0xfafaf8;
    const T = Math.max(topH - botH, 1.2);
    pickables.push(addBox(g, dx, T, dy, cx, botH + T / 2, cz, color, info));           // 棚板
    const BH = 26, inset = Math.min(14, Math.max(dx * 0.12, 6));
    [x + inset, x + dx - inset].forEach(function (bx0) {
      addBox(g, 4.6, BH, 1.6, bx0, botH - BH / 2, y + 0.8, MET, info);                 // 壁付けプレート
      addBox(g, 3.2, 2.0, dy - 4, bx0, botH - 1.0, y + 2 + (dy - 4) / 2, MET, info);    // 水平アーム
      const rise = BH - 5, run = dy - 8;                                                // 斜め筋交い
      const br = addBox(g, 2.0, 1.6, Math.sqrt(rise * rise + run * run),
                        bx0, botH - 3 - rise / 2, y + 3 + run / 2, MET, info);
      br.rotation.x = -Math.atan2(rise, run);
    });
    return;
  }
  if (f.type === 'hanger_pipe') {
    // ★v6.6 棚板の下に吊られたクロムのハンガーパイプ (物干し竿受け)
    const info = { kind: 'fixture', info: f.label };
    const r = Math.max(Math.min(dy, topH - botH) / 2, 0.8), yc = (botH + topH) / 2;
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dx, 16), mat(color));
    pipe.rotation.z = Math.PI / 2;
    pipe.position.set(cx, yc, cz);
    Object.assign(pipe.userData, info); g.add(pipe); pickables.push(pipe);
    [x + r + 0.5, x + dx - r - 0.5].forEach(function (hx) {                             // 両端の吊り金具
      addBox(g, 1.6, 7, 1.6, hx, yc + 3.5, cz, 0xfafaf8, info);
    });
    return;
  }
  if (f.type === 'washstand') {
    // ★v4.0[4] Panasonic 三面鏡 洗面化粧台 W80 (写真41・42・45 準拠) を実物構成で組み立てる。
    //   北壁付け = 前面が +z (南) 側。構成は
    //     下台   … ホワイトウッド木目の引出し2段 (上=浅型スライド収納 / 下=深型) + アルミ一文字ハンドル + キックプレート
    //     天板   … 人造大理石の一体カウンター + 白ボウル (中央やや前・排水金具)
    //     水栓   … シングルレバー混合栓 + ハンドシャワー (クロム・黒レバー)
    //     上部   … 三面鏡ミラーキャビネット (鏡扉3枚・内部収納=コンセント No.12) + 下端の横長照明 + 天板棚
    //     脇     … 鏡の右脇のコンセントプレート
    const x0 = x, z0 = y, W = dx, D = dy, zF = y + dy;
    const CAB = 0xe9e2d7, TOPC = 0xfbfaf7, MET = 0xb6bbc0, MIRR = 0xdfe8ec, FRM = 0xe8e6e1;
    const CT = 80;                                   // カウンター天面高
    const info = { kind: 'fixture', info: f.label };
    addBox(g, W - 10, 7, D - 10, cx, 3.5, cz - 2, 0x9c968d, info);                     // キックプレート (奥まり)
    const wsBody = addBox(g, W, CT - 10, D, cx, 7 + (CT - 10) / 2, cz, CAB, info);      // 下台 本体
    pickables.push(wsBody);
    [[52, 22], [10, 40]].forEach(function (dr) {                                       // [下端高, 高さ]
      addBox(g, W - 3, dr[1] - 2, 1.6, cx, dr[0] + dr[1] / 2, zF + 0.6, CAB, info);     // 引出し前板
      addBox(g, W * 0.55, 2.2, 2.6, cx, dr[0] + dr[1] - 4, zF + 2.0, MET);              // 一文字バーハンドル
    });
    // カウンター (人造大理石) — ボウル開口を避けて4辺のストリップで組み、内側に白ボウルを落とし込む
    const BW = W * 0.62, BD = D * 0.5, bcz = z0 + D * 0.52;
    const bx0 = cx - BW / 2, bx1 = cx + BW / 2, bz0 = bcz - BD / 2, bz1 = bcz + BD / 2;
    addBox(g, W + 2, 3, (bz0 - z0) + 1, cx, CT - 1.5, z0 + (bz0 - z0) / 2 - 0.5, TOPC, info);        // 天板 奥 (水栓側)
    addBox(g, W + 2, 3, (zF - bz1) + 1, cx, CT - 1.5, bz1 + (zF - bz1) / 2 + 0.5, TOPC, info);       // 天板 手前
    addBox(g, (bx0 - x0) + 1, 3, BD, x0 + (bx0 - x0) / 2 - 0.5, CT - 1.5, bcz, TOPC, info);          // 天板 左
    addBox(g, (x0 + W - bx1) + 1, 3, BD, bx1 + (x0 + W - bx1) / 2 + 0.5, CT - 1.5, bcz, TOPC, info); // 天板 右
    addBox(g, BW, 1.4, BD, cx, CT - 9, bcz, 0xf2f5f6, info);                            // ボウル底
    addBox(g, 1.6, 8, BD, bx0 + 0.8, CT - 5, bcz, 0xf7fafa);                            // ボウル内側 左
    addBox(g, 1.6, 8, BD, bx1 - 0.8, CT - 5, bcz, 0xf7fafa);                            // ボウル内側 右
    addBox(g, BW, 8, 1.6, cx, CT - 5, bz0 + 0.8, 0xf7fafa);                             // ボウル内側 奥
    addBox(g, BW, 8, 1.6, cx, CT - 5, bz1 - 0.8, 0xf7fafa);                             // ボウル内側 手前
    addBox(g, 3, 1.2, 3, cx, CT - 8.2, bcz, 0x9aa1a6);                                  // 排水金具
    addBox(g, 5, 13, 5, cx, CT + 6.5, z0 + 9, MET);                                     // 水栓 台座+本体
    addBox(g, 3.4, 3.4, 15, cx, CT + 12, z0 + 15, MET);                                 // 水栓 首 (前へ)
    addBox(g, 3.6, 5, 3.6, cx, CT + 10.5, z0 + 22, 0xd7dbde);                           // ハンドシャワー 吐水部
    addBox(g, 8, 2.2, 2.2, cx + 5, CT + 14.5, z0 + 9, 0x2b2e31);                        // 黒のレバーハンドル
    const MB = 115, MH = topH - 115, MD = 17;                                           // 三面鏡 (h115..190/奥行17)
    const wsMir = addBox(g, W, MH, MD, cx, MB + MH / 2, z0 + MD / 2, FRM, info);
    pickables.push(wsMir);
    for (let i = 0; i < 3; i++) {                                                       // 鏡扉3枚
      const w3 = (W - 4) / 3;
      addBox(g, w3 - 1.2, MH - 4, 1.2, x0 + 2 + w3 * (i + 0.5), MB + MH / 2, z0 + MD + 0.7, MIRR, info);
    }
    addBox(g, W - 6, 2.4, MD - 4, cx, MB - 1.5, z0 + MD / 2, 0xfdfdf5);                 // 鏡下端の横長照明
    addBox(g, W, 2, MD, cx, topH - 1, z0 + MD / 2, FRM);                                // 上端の棚
    addBox(g, 2, 12, 7, x0 + W + 0.8, MB + MH * 0.75, z0 + MD * 0.5, 0xffffff);         // 鏡脇のコンセント
    return;
  }
  if (f.type === 'glass') {
    // ★v1.7 オイルガードガラス: 半透明クリアパネル
    body = new THREE.Mesh(new THREE.BoxGeometry(sx, bh, sz),
      new THREE.MeshBasicMaterial({ color: 0xcfe8ef, transparent: true, opacity: 0.28 }));
    body.position.set(cx, cy, cz);
    body.userData.kind = 'fixture'; body.userData.info = f.label;
    g.add(body);
    const ge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(sx, bh, sz)),
      new THREE.LineBasicMaterial({ color: 0x1a1a1a }));
    ge.position.copy(body.position);
    g.add(ge);
  } else if (f.type === 'counter') {
    // ★v1.8 一体カウンター: 天板スラブのみ (bottomH〜h)。下部ボックスは描かない=脚元オープン
    body = addBox(g, sx, bh, sz, cx, botH + bh / 2, cz, 0x86705d,
      { kind: 'fixture', info: f.label });
  } else if (f.type === 'monitor') {
    // ★v1.7 モニター: 白枠 + 黒画面
    body = addBox(g, sx, bh, sz, cx, cy, cz, 0xf2f2f2, { kind: 'fixture', info: f.label });
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(sx - 3, 1), Math.max(bh - 3, 1)),
      new THREE.MeshBasicMaterial({ color: 0x101216, side: THREE.DoubleSide }));
    scr.position.set(cx, cy, y - 0.4);                  // 北面 (LDK側) に画面
    g.add(scr);
  } else if (f.type === 'mirror') {
    // ★v1.7 姿見: 反射風の明るいパネル + 黒枠
    body = addBox(g, sx, bh, sz, cx, cy, cz, color, { kind: 'fixture', info: f.label });
    const me = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(sx, bh, sz)),
      new THREE.LineBasicMaterial({ color: 0x222222 }));
    me.position.copy(body.position);
    g.add(me);
  } else {
    body = addBox(g, sx, bh, sz, cx, cy, cz, color, { kind: 'fixture', info: f.label });
  }
  pickables.push(body);
  if (f.type === 'kitchen') {
    addBox(g, dx - 1, 3, dy - 1, cx, topH + 1.5, cz, 0x2c2c30);   // 黒マット天板 (フルフラット)
    // ★v2.1 写真38確定: 引き出し・黒バーハンドルは東面 (6.2帖/ダイニング側 x646.5、2列x2段)。
    //        コンロ前グリル黒帯・下部キックプレートも東面 (v1.8 の西=通路側表現は誤り)
    [[y + 135, 76], [y + 135, 52], [y + 45, 76], [y + 45, 52]].forEach(function (hp) {
      addBox(g, 1.6, 2.4, 26, x + dx - 0.2, hp[1], hp[0], 0x17181a);
    });
    addBox(g, 1.4, 20, 50, x + dx - 0.6, 70, y + 32, 0x141414);   // 北端コンロ下グリル+操作部 (東面)
    addBox(g, 1.2, 9, dy - 10, x + dx - 0.4, 4.5, cz, 0x26241f);  // 下部キックプレート (東面)
    // ★v2.3[9] キッチン引き出し開閉 (東面 2列x2段、奥行≈45)。クリックプレート + 突き出しボックス + 残り幅ラベル
    const KD = 45, fE = x + dx;
    const dCol = new THREE.Color(color).multiplyScalar(0.82).getHex();
    [[y + 45, '南列'], [y + 135, '北列']].reverse().forEach(function (colDef) {
      const colZ = colDef[0], colW = 82;
      [[58, 26, 76, '上段'], [28, 29, 52, '下段']].forEach(function (row) {
        const ry = row[0], rh = row[1], hy = row[2];
        const plate = addBox(g, 0.9, rh, colW - 8, fE + 0.45, ry + rh / 2, colZ, color,
          { kind: 'fixture', drawerLabel: 'キッチン引き出し(' + colDef[1] + row[3] + ')' });
        pickables.push(plate);
        const boxes = [
          addBox(g, KD, rh - 3, colW - 12, fE + KD / 2, ry + rh / 2, colZ, dCol),          // 引き出し箱
          addBox(g, 1.6, rh, colW - 8, fE + KD + 0.8, ry + rh / 2, colZ, color),           // 前板
          addBox(g, 1.4, 2.4, 26, fE + KD + 1.8, hy, colZ, 0x17181a)                       // ハンドル
        ];
        boxes.forEach(function (m) { m.visible = false; m.userData.drawerBox = true; });
        pickables.push(boxes[0], boxes[1]);   // 開いた引き出しをクリックで閉じられるように
        plate.userData.drawerId = boxes[0].userData.drawerId = boxes[1].userData.drawerId = regDrawer({
          label: 'キッチン引き出し ' + colDef[1] + row[3], boxes: boxes, depth: KD, originOff: 1,
          rayFn: function () {
            return {
              origins: [new THREE.Vector3(fE + 1, ry + rh / 2, colZ),
                        new THREE.Vector3(fE + 1, ry + rh / 2, colZ - colW * 0.35),
                        new THREE.Vector3(fE + 1, ry + rh / 2, colZ + colW * 0.35)],
              dir: new THREE.Vector3(1, 0, 0), exclude: null,
              labelPos: new THREE.Vector3(fE + KD, ry + rh + 14, colZ)
            };
          }
        });
      });
    });
  }
  if (f.type === 'petbase') {
    // 開口 62x66 をLDK側(北面)に暗色パネルで表現 (床一段上げ8の上)
    const p = new THREE.Mesh(new THREE.PlaneGeometry(62, 66),
      new THREE.MeshBasicMaterial({ color: 0x3a3129, side: THREE.DoubleSide }));
    p.position.set(cx, 8 + 33, y - 0.4);
    g.add(p);
  }
  if (f.type === 'toilet') {
    addBox(g, 16, 95, Math.max(dy - 8, 2), x + dx - 8, 47.5, cz, 0xfafafa);  // タンク
  }
  if (f.type === 'bathtub') {
    addBox(g, Math.max(dx - 14, 2), 4, Math.max(dy - 14, 2), cx, topH - 4, cz, 0x9fb8c8); // 湯面風
  }
}

function outletInward(side) { return side === 'N' ? [0, 1] : side === 'S' ? [0, -1] : side === 'W' ? [1, 0] : [-1, 0]; }

function buildOutlet(o) {
  const g = group(o.room);
  const d = outletInward(o.wallSide);
  const alongX = (o.wallSide === 'N' || o.wallSide === 'S');
  const m = addBox(g, alongX ? 7 : 2.4, 12, alongX ? 2.4 : 7,
    o.pos[0] + d[0] * 1.6, o.h || 25, o.pos[1] + d[1] * 1.6, 0xffffff,
    { kind: 'outlet', info: o });
  pickables.push(m);
  outletMeshes.push(m);
}

function buildAircon(a) {
  const g = group(a.room);
  const d = outletInward(a.wallSide);
  const alongX = (a.wallSide === 'N' || a.wallSide === 'S');
  const y = a.bottomH ? a.bottomH + 13 : 218;   // ★v1.7 bottomH=下端高さ指定 (A2=200)。A5 特例は削除 (A5自体を廃止)
  const m = addBox(g, alongX ? 80 : 24, 26, alongX ? 24 : 80,
    a.pos[0] + d[0] * 13, y, a.pos[1] + d[1] * 13, 0xf6f7f8,
    { kind: 'fixture', info: 'エアコン ' + a.no + ' (' + a.label + ')', acId: a.id });   // ★v6.4 ID直結
  pickables.push(m);
}

// ★v1.8 天井ライトの表現は削除 (downlight円盤・引掛シーリングマークを描画しない)。
//        ROOM_DATA.lights のデータ自体は保持 (buildLight は呼ばない)。

function buildStatic() {
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  R.rooms.forEach(function (r) {
    const xs = r.poly.map(function (p) { return p[0]; });
    const ys = r.poly.map(function (p) { return p[1]; });
    roomBBox[r.key] = { minX: Math.min.apply(null, xs), maxX: Math.max.apply(null, xs), minZ: Math.min.apply(null, ys), maxZ: Math.max.apply(null, ys) };
    minX = Math.min(minX, roomBBox[r.key].minX); maxX = Math.max(maxX, roomBBox[r.key].maxX);
    minZ = Math.min(minZ, roomBBox[r.key].minZ); maxZ = Math.max(maxZ, roomBBox[r.key].maxZ);
    buildFloor(r);
    buildWalls(r);
  });
  allBBox = { minX: minX, maxX: maxX, minZ: minZ, maxZ: maxZ };
  // ★v2.3 部屋ポリゴンのエッジに載らない建具 (4.8帖CL両開き = クローゼットfixture東面 x165) を描画
  R.openings.forEach(function (o) {
    if (o.__drawn || (o.type !== 'door' && o.type !== 'sliding')) return;
    const r0 = openingRange(o);
    const dirSign = o.swing ? ((o.swing === 'S' || o.swing === 'E') ? 1 : -1) : 1;
    const wc = r0.c + dirSign * 2;   // 固定設備面のすぐ前 (開く側へ2cm)
    buildOpeningPanelTagged(group(o.room), o, r0.a, r0.b, o.sillH || 0,   // ★v6.4
      Math.min((o.sillH || 0) + (o.height || 200), CH), r0.horiz, wc, -dirSign, r0.c);
  });
  R.fixtures.forEach(buildFixture);
  R.outlets.forEach(buildOutlet);
  R.aircons.forEach(buildAircon);
  // ★v1.8 R.lights は描画しない (天井ライト表現の削除)
}

// 部屋フォーカス: 選択部屋以外を淡色化
function setFocus(dataKey) {
  Object.keys(roomGroups).forEach(function (k) {
    const dim = !!dataKey && k !== dataKey;
    roomGroups[k].traverse(function (obj) {
      if (!obj.isMesh && !obj.isLineSegments) return;
      if (obj.userData.doorId) return;   // ★v2.2[4] ドア・引き戸パネルは淡色化 (半透明化) しない
      if (obj.userData.pickOnly) return;   // ★v6.4 クリック判定専用の不可視パネル (開口 OP-) は素材を触らない
      if (!obj.userData.baseMat) obj.userData.baseMat = obj.material;
      if (dim) {
        if (!obj.userData.dimMat) {
          const dm = obj.userData.baseMat.clone();
          dm.transparent = true; dm.opacity = 0.10; dm.depthWrite = false;
          obj.userData.dimMat = dm;
        }
        obj.material = obj.userData.dimMat;
      } else {
        obj.material = obj.userData.baseMat;
      }
    });
  });
}

// ═══════════════ カメラ ═══════════════
function viewBBox() {
  // ★v1.9 LDK サブゾーン選択中はそのゾーン矩形にフォーカス
  if (currentRoom === 'ldk' && currentZone) {
    const z = (R.zones || []).find(function (q) { return q.key === currentZone; });
    if (z && z.rect) return { minX: z.rect[0], maxX: z.rect[0] + z.rect[2], minZ: z.rect[1], maxZ: z.rect[1] + z.rect[3] };
  }
  if (currentRoom !== 'all') return roomBBox[dataKeyOf(currentRoom)] || allBBox;
  return allBBox;
}
// ★v1.9 LDK サブゾーンチップ (LDK全体 / リビング / ダイニング / キッチン)。案は従来通りLDKで1つ、ゾーンはビュー補助
let currentZone = null;
function renderZoneChips() {
  const el = document.getElementById('zoneChips');
  if (!el) return;
  const zones = (R.zones || []).filter(function (z) { return z.room === 'ldk'; });
  if (currentRoom !== 'ldk' || !zones.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';
  el.innerHTML =
    '<button class="zone-chip' + (!currentZone ? ' active' : '') + '" onclick="setZone(\'all\')">LDK全体</button>' +
    zones.map(function (z) {
      return '<button class="zone-chip' + (currentZone === z.key ? ' active' : '') + '" onclick="setZone(\'' + z.key + '\')">' + esc(z.name) + '</button>';
    }).join('');
}
window.setZone = function (zk) {
  currentZone = (zk === 'all') ? null : zk;
  renderZoneChips();
  window.setCamera(camPreset === 'eye' ? 'iso' : camPreset);
};
window.setCamera = function (p) {
  camPreset = p;
  const bb = viewBBox();
  const cx = (bb.minX + bb.maxX) / 2, cz = (bb.minZ + bb.maxZ) / 2;
  const span = Math.max(bb.maxX - bb.minX, bb.maxZ - bb.minZ);
  if (p === 'top') {
    controls.target.set(cx, 0, cz);
    camera.position.set(cx, span * 1.35 + 320, cz + 0.01);
  } else if (p === 'iso') {
    controls.target.set(cx, 40, cz);
    camera.position.set(cx + span * 0.5, span * 0.85 + 200, cz + span * 0.72);
  } else {
    // 室内視点: 部屋中央・目線高さ140cm、窓の方向を向く
    let tx = cx, tz = cz - 150;
    const dk = currentRoom !== 'all' ? dataKeyOf(currentRoom) : null;
    if (dk) {
      const win = R.openings.find(function (o) { return o.room === dk && o.type === 'window'; });
      if (win) { tx = (win.wallFrom[0] + win.wallTo[0]) / 2; tz = (win.wallFrom[1] + win.wallTo[1]) / 2; }
    }
    camera.position.set(cx, 140, cz);
    controls.target.set(tx, 130, tz);
  }
  controls.update();
};

function onResize() {
  const vp = document.getElementById('viewport');
  if (!vp.clientWidth || !renderer) return;
  camera.aspect = vp.clientWidth / vp.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(vp.clientWidth, vp.clientHeight);
}

  if (DEBUG) {

      //        __noza.ruler('x', 790) → x=790 の鉛直面に緑ライン / __noza.ruler('z', 603.5) → z(図面y)=603.5
      ruler: function (axis, v, color, thick, hgt) {
        const L = 4000, T = thick || 0.7;
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(axis === 'x' ? T : L, hgt || 246, axis === 'x' ? L : T),
          new THREE.MeshBasicMaterial({ color: color === undefined ? 0x00ff5a : color,
                                        transparent: true, opacity: 0.95, depthTest: false }));
        m.position.set(axis === 'x' ? v : 0, (hgt || 246) / 2, axis === 'x' ? 0 : v);
        m.renderOrder = 9999;
        scene.add(m); __rulers.push(m);
        return { axis: axis, v: v };
      },
      clearRulers: function () { __rulers.forEach(function (m) { scene.remove(m); }); __rulers.length = 0; return 0; },
      // ★v4.1 検証用: 画角を細くして「ほぼ正投影の真上ビュー」を作る (定規線との面の一致を見るため)
      fov: function (v) { camera.fov = v || 55; camera.updateProjectionMatrix(); return camera.fov; },
      shot: function (w) {
        updateWallGhost();
        renderer.render(scene, camera);
        const src = renderer.domElement;
        const scale = (w || 640) / src.width;

      },
      cam: function (px, py, pz, tx, ty, tz) {

        camera.position.set(px, py, pz);

      sel: function (id) { if (id) select(id); else deselect(); return selectedItemId; },

        return { x: it.x, y: it.y, z: it.z, mounted: !!it.mounted, mountArm: it.mountArm || null };
      },

      standh: function (standId, v) {

      arms: function () {

            const ap = armAttachPoint(workItems[k]);
            return { id: k, name: workItems[k].name, x: workItems[k].x, z: workItems[k].z, y: workItems[k].y,

      },
      mounts: function () {
        return Object.keys(workItems).filter(function (k) { return isMonitorItem(workItems[k]); })
          .map(function (k) {

      },
      unmount: function (monId) {

        window.unmountMonitor();
        selectedItemId = prev;
        const it = workItems[monId];
        return { mounted: !!it.mounted, x: it.x, y: it.y, z: it.z };
      },
      // ★v6.7 検証用: 全開口 (ドア11 / 窓7 / 開口2) が 実際に3Dへ描画されたかの機械確認。
      //   meshes  = userData.opId が刻まれたメッシュ数 (0 なら建具が1枚も立っていない)
      //   drawn   = buildOpeningPanel が走ったか
      //   cut     = この開口がくり抜いた 部屋エッジ の一覧
      //   blocked = 重なっているのに 許容差を超えていて くり抜けなかった エッジ (= 開口の前に立つ壁)
      openings: function () {
        const cnt = {};
        scene.traverse(function (m) {
          const id = m.userData && m.userData.opId;
          if (!id) return;
          if (!cnt[id]) cnt[id] = { mesh: 0, pickOnly: 0 };
          cnt[id].mesh++;
          if (m.userData.pickOnly) cnt[id].pickOnly++;
        });
        return R.openings.map(function (o) {
          const r0 = openingRange(o), cut = [], blocked = [];
          R.rooms.forEach(function (rm) {
            const poly = rm.poly, n = poly.length;
            for (let i = 0; i < n; i++) {
              const p1 = poly[i], p2 = poly[(i + 1) % n];
              const horiz = Math.abs(p1[1] - p2[1]) < 0.01;
              if (horiz !== r0.horiz) continue;
              const c = horiz ? p1[1] : p1[0];
              const a = horiz ? Math.min(p1[0], p2[0]) : Math.min(p1[1], p2[1]);
              const b = horiz ? Math.max(p1[0], p2[0]) : Math.max(p1[1], p2[1]);
              if (b - a < 0.5) continue;
              if (rm.key.indexOf('balcony') === 0 && touchesBuilding(horiz, c, a, b)) continue;
              if (Math.min(r0.b, b) - Math.max(r0.a, a) <= 2) continue;
              const d = Math.round(Math.abs(r0.c - c) * 100) / 100;
              const tag = rm.key + '@' + c + ' (d' + d + ')';
              if (d <= OPEN_MATCH_TOL) cut.push(tag); else if (d <= 40) blocked.push(tag);
            }
          });
          const k = cnt[o.id] || { mesh: 0, pickOnly: 0 };
          return { id: o.id, type: o.type, room: o.room, name: o.name,
                   c: r0.c, from: r0.a, to: r0.b,
                   meshes: k.mesh, pickOnly: k.pickOnly, drawn: !!o.__drawn,
                   cut: cut, blocked: blocked };
        });
      },
      doors: function () {
        // ★v2.2 検証用: ドア一覧 (id / ラベル / 開閉状態)
        return Object.keys(doors).map(function (k) {
          return { id: k, label: doors[k].label, open: doors[k].open, parts: doors[k].parts.length,
                   state: doors[k].kind === 'bypass2' ? doors[k].state : undefined };   // ★v2.7 0=閉/1=s側開/2=e側開
        });
      },
      door: function (id, pi) {   // ★v2.7 引違いは pi (0=s側/北・西, 1=e側/南・東) 指定で開く側を選べる
        toggleDoor(id, pi);
        const d = doors[id];
        return d && (d.kind === 'bypass2' ? { open: d.open, state: d.state } : d.open);
      },
      // ★v6.4 検証用: 要素ID から ツールチップに出る行をそのまま取る
      tip: function (id) {
        const idx = ensureNameIndex();
        const a = idx.byId[String(id || '').trim().toUpperCase()];
        if (!a) return null;
        return { id: a.id, name: a.name, kind: a.kind, rows: tipRows(a, {}) };
      },
      tipAll: function (prefix) {
        const idx = ensureNameIndex();
        const p = String(prefix || '').trim().toUpperCase();
        return idx.anchors.filter(function (a) { return !p || a.id.indexOf(p) === 0; })
          .map(function (a) { return { id: a.id, name: a.name, kind: a.kind, rows: tipRows(a, {}) }; });
      },
      // ★v6.2 検証用: オープン部 (ゴミ箱スペース) の内寸 / 収納内アイテム / スタック候補
      cavities: function () {
        return Object.keys(workItems).map(function (k) {
          const cav = openCavityOf(workItems[k]);
          if (!cav) return null;
          const wc = cavityWorld(workItems[k], cav), R1 = function (v) { return Math.round(v * 10) / 10; };
          return { id: k, name: workItems[k].name, label: cav.label, rotY: workItems[k].rotY || 0,
                   inner: { w: R1(wc.maxX - wc.minX), d: R1(wc.maxZ - wc.minZ), h: R1(wc.y1 - wc.y0) },
                   world: { minX: R1(wc.minX), maxX: R1(wc.maxX), minZ: R1(wc.minZ), maxZ: R1(wc.maxZ) } };
        }).filter(Boolean);
      },
      insides: function () {
        return Object.keys(workItems).map(function (k) {
          const it = workItems[k];
          if (!isTrashItem(it)) return null;
          const host = it.insideOf ? workItems[it.insideOf] : null;
          const cav = host ? openCavityOf(host) : null;
