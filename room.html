// ═══════════════ ポインタ操作 (視点/配置・ドラッグ移動・ツールチップ) ═══════════════
const raycaster = new THREE.Raycaster();
// ★v2.5[3] 細線・点要素の raycast 許容を拡大 (タッチでの取りこぼし対策)
raycaster.params.Line = Object.assign({}, raycaster.params.Line, { threshold: 6 });
raycaster.params.Points = Object.assign({}, raycaster.params.Points, { threshold: 8 });
const ndc = new THREE.Vector2();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let drag = null;      // { itemId, sx, sz, px, pz }
let downInfo = null;  // クリック判定用

function setNdc(e, dx, dy) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((((e.clientX + (dx || 0)) - r.left) / r.width) * 2 - 1,
          -(((e.clientY + (dy || 0)) - r.top) / r.height) * 2 + 1);
}
// ★v2.5[3] タッチ時はタップ座標±12px程度の複数レイで当たり判定を拡大 (小物が選びにくい問題の解消)
const TOUCH_PICK_OFFS = [[0, 0], [12, 0], [-12, 0], [0, 12], [0, -12], [9, 9], [-9, 9], [9, -9], [-9, -9]];
const MOUSE_PICK_OFFS = [[0, 0]];
function pickOffsets(e) { return isTouchEvent(e) ? TOUCH_PICK_OFFS : MOUSE_PICK_OFFS; }
function floorPoint(e) {
  setNdc(e);
  raycaster.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  return raycaster.ray.intersectPlane(floorPlane, p) ? p : null;
}
function pickItem(e) {
  // ★v1.8 家具は Group (子メッシュ群) なので再帰 raycast → 親をたどって itemId 解決
  const meshes = Object.keys(furnMeshes).map(function (k) { return furnMeshes[k]; });
  const offs = pickOffsets(e);
  for (let oi = 0; oi < offs.length; oi++) {
    setNdc(e, offs[oi][0], offs[oi][1]);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(meshes, true);
    for (let i = 0; i < hits.length; i++) {
      if (hits[i].object.visible === false) continue;   // ★v2.3 閉じている引き出しボックス等は無視
      let o = hits[i].object;
      while (o && !o.userData.itemId) o = o.parent;
      if (o && o.userData.itemId) return o.userData.itemId;
    }
  }
  return null;
}
function pickInfo(e) {
  const focusDk = currentRoom === 'all' ? null : dataKeyOf(currentRoom);
  const offs = pickOffsets(e);   // ★v2.5[3][8] ドア・コンセント等もタッチは判定拡大
  for (let oi = 0; oi < offs.length; oi++) {
    setNdc(e, offs[oi][0], offs[oi][1]);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    for (let i = 0; i < hits.length; i++) {
      const obj = hits[i].object;
      if (obj.visible === false) continue;   // ★v2.3 閉じている引き出しボックス等は無視
      const ud = obj.userData;
      if (ud.kind === 'outlet' && !outletsVisible) continue;
      // ★v2.2[8] ドアは両面 (どの部屋ビューでも) クリック可。他の淡色化中の他部屋設備は拾わない
      if (focusDk && !ud.doorId && obj.parent && obj.parent.name && obj.parent.name !== focusDk) continue;
      return ud;
    }
  }
  return null;
}

// ★v1.9 ドラッグ開始情報: y 自動管理 (床置き or 天面載せ状態なら、支えを離れた時に床へ戻す)
function beginDrag(itemId, it, p) {
  // ★v3.1 天面載せホワイトリスト外の床置き家具が旧データ等で浮いていたら、掴んだ時点で着地させる
  //        (overlapState はこの後に取るので、着地で生じた重なりは分離まで免除される)
  if (!TOP_STACK_TYPES[itemTypeOf(it)] && !isMattressItem(it) && (Number(it.y) || 0) !== 0) {
    it.y = 0;
    const gm = furnMeshes[itemId];
    if (gm) syncItemMesh(gm, it);
  }
  const sup0 = supportTopFor(itemId, it);
  const bed0 = bedUnder(itemId, it);   // ★v2.0 ベッド床板面に載っている状態も autoY 対象
  const y0 = Number(it.y) || 0;
  return { itemId: itemId, sx: it.x, sz: it.z, px: p.x, pz: p.z,
           vx: it.x, vz: it.z, vy: y0,
           ig: overlapState(itemId, it),   // ★v2.2[6] 開始時点で重なっている相手は分離まで衝突免除
           autoY: y0 === 0 || (sup0 !== null && Math.abs(y0 - sup0) < 0.6) ||
                  (bed0 !== null && Math.abs(y0 - bedFloorH(bed0)) < 0.6) };
}
// ★v1.9 ドラッグ中の位置解決:
//  1) 部屋ポリゴン外・固定設備めり込みは 軸ごとに滑らせ、両方ダメなら直前の有効位置に留める
//  2) 家具同士は「相手の天面に載せられるなら y を天面へスナップ」(モニター→デスク等)。
//     載せられない (天井超え・相手が小さい) 場合は従来通り滑らせ/押し出し
function resolveDragPos(drag, it) {
  const igF = drag.ig && drag.ig.fix, igI = drag.ig && drag.ig.items;   // ★v2.2[6] 重なり免除セット
  if (outsideRoom(it) || hitsFixture(it, igF)) {
    const nz = it.z;
    it.z = drag.vz;
    if (outsideRoom(it) || hitsFixture(it, igF)) {
      it.x = drag.vx; it.z = nz;
      if (outsideRoom(it) || hitsFixture(it, igF)) { it.x = drag.vx; it.z = drag.vz; }
    }
  }
  const bed = bedUnder(drag.itemId, it);
  if (bed) {
    it.y = bedFloorH(bed);                       // ★v2.0 マットレス→ベッド床板面 (floorH) スナップ
  } else {
    const sup = supportTopFor(drag.itemId, it);
    if (sup !== null && sup + (Number(it.h) || 1) <= CH + 0.01) {
      it.y = sup;                                // 天面へ載せる (ライブプレビュー)
    } else if (sup === null && drag.autoY) {
      it.y = 0;                                  // 支えから離れたら床へ (ベッドから外れた時も床へ)
    }
  }
  if (collidesAny(drag.itemId, it, igI)) {
    const nz2 = it.z;
    it.y = drag.vy; it.z = drag.vz;
    if (collidesAny(drag.itemId, it, igI)) {
      it.x = drag.vx; it.z = nz2;
      if (collidesAny(drag.itemId, it, igI)) { it.x = drag.vx; it.z = drag.vz; }
    }
  }
  drag.vx = it.x; drag.vz = it.z; drag.vy = it.y;
  // ★v2.2[6] 分離できた相手は免除セットから外す (以後は通常の衝突判定に復帰)
  if (drag.ig) {
    Object.keys(drag.ig.items).forEach(function (oid) {
      if (!workItems[oid] || !pairCollides(it, workItems[oid])) delete drag.ig.items[oid];
    });
    if (Object.keys(drag.ig.fix).length) {
      const now = {};
      fixtureHitIdxs(it).forEach(function (i) { now[i] = 1; });
      Object.keys(drag.ig.fix).forEach(function (i) { if (!now[i]) delete drag.ig.fix[i]; });
    }
  }
}

// ★v2.5[1] 視点モードのままの長押し掴み (タッチ ~250ms 静止で家具をつかんで移動開始)
let lpTimer = null, lpTarget = null;
let activePtrs = 0;   // マルチタッチ (ピンチ) 検出用
function cancelLongPress() {
  if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
  lpTarget = null;
}
// ドラッグ中の位置更新 (canvas / 移動ハンドル 共通)
function moveDragTo(e) {
  if (!drag) return;
  const p = floorPoint(e);
  if (!p) return;
  const it = workItems[drag.itemId];
  if (!it) return;
  it.x = drag.sx + (p.x - drag.px);
  it.z = drag.sz + (p.z - drag.pz);
  clampItem(it);
  resolveDragPos(drag, it);   // ★v1.9 壁ポリゴン/設備は滑らせ、家具同士は載せられるなら y スナップ
  const m = furnMeshes[drag.itemId];
  if (m) syncItemMesh(m, it);
}
// ★v2.7 洗濯機パン 置けるか判定 (ROOM_DATA v2.5 ユーザー実測: 内寸60x60 / パン上面→洗濯水栓115cm)。
//        パンと重なる位置に家具をドロップしたら、設置面が内寸60x60に収まるか + 水栓高さに収まるかをトースト
const WASHER_PAN = { outer: [538, 18, 64, 64], inner: [540, 20, 60, 60], faucetClr: 115 };
function checkWasherPanFit(itemId) {
  const it = workItems[itemId]; if (!it) return;
  const a = itemAabb(it);
  const o = WASHER_PAN.outer;
  if (a.maxX <= o[0] || a.minX >= o[0] + o[2] || a.maxZ <= o[1] || a.minZ >= o[1] + o[3]) return;
  // ★v2.8 baseW/baseD (設置面=脚間寸法。カタログ由来) があれば設置面AABBで判定 —
  //        洗濯機の外形 (ホース・手掛け込み) はパン縁に被さってよく、脚がパン内寸に収まれば設置可 (BW-DX100J 公式寸法図)
  const fx = a.maxX - a.minX, fz = a.maxZ - a.minZ;
  let bx = fx, bz = fz, byBase = false;
  const bW = Number(it.baseW) || 0, bD = Number(it.baseD) || 0;
  if (bW > 0 && bD > 0) {
    const iw = Number(it.w) || 0, id_ = Number(it.d) || 0;
    const xIsW = Math.abs(fx - iw) <= Math.abs(fx - id_);   // 回転で w/d どちらが x 軸かを判定
    bx = xIsW ? bW : bD; bz = xIsW ? bD : bW; byBase = true;
  }
  const cx = (a.minX + a.maxX) / 2, cz = (a.minZ + a.maxZ) / 2;
  const minX = cx - bx / 2, maxX = cx + bx / 2, minZ = cz - bz / 2, maxZ = cz + bz / 2;
  const n = WASHER_PAN.inner, EPS = 0.3;
  const w = Math.round(bx * 10) / 10, dd = Math.round(bz * 10) / 10;
  const fits = minX >= n[0] - EPS && maxX <= n[0] + n[2] + EPS &&
               minZ >= n[1] - EPS && maxZ <= n[1] + n[3] + EPS;
  const h = Number(it.h) || 0;
  const lbl = byBase ? '設置面(脚間) ' : '設置面 ';
  toast(fits
    ? '🧺 洗濯機パン: ' + lbl + w + '×' + dd + ' は内寸60×60に収まります' +
      (h > WASHER_PAN.faucetClr ? ' ⚠高さ' + h + 'cmは洗濯水栓 (パン上面+115cm) に干渉のおそれ'
                                : ' (高さ' + h + 'cm・水栓まで115cm OK)')
    : '🧺 洗濯機パン: ' + lbl + w + '×' + dd + ' は内寸60×60からはみ出します');
}
function finishDrag() {
  if (drag) { checkWasherPanFit(drag.itemId); markDirty(); drag = null; }   // ★v2.7 パン適合トースト
  if (controls) controls.enabled = true;
}

function bindPointer() {
  const el = renderer.domElement;
  el.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    activePtrs++;
    cancelLongPress();
    if (activePtrs > 1) {                 // ★v2.5[1] 2本目の指=ピンチ意図 → 掴みを終了して視点操作へ
      if (drag) finishDrag();
      downInfo = null;
      return;
    }
    downInfo = { x: e.clientX, y: e.clientY, moved: false, touch: isTouchEvent(e), lp: false };
    if (currentRoom === 'all') return;
    const hitId = pickItem(e);
    const isMouse = !downInfo.touch;
    if (hitId && workItems[hitId] && (isMouse || mode === 'place')) {
      if (hitId !== selectedItemId) select(hitId);
      const p = floorPoint(e);
      const it = workItems[hitId];
      if (p && it) { drag = beginDrag(hitId, it, p); controls.enabled = false; }
    } else if (!hitId && !isMouse && mode === 'place' && selectedItemId) {
      const p = floorPoint(e);
      const it = workItems[selectedItemId];
      if (p && it) { drag = beginDrag(selectedItemId, it, p); controls.enabled = false; }
    } else if (hitId && workItems[hitId] && downInfo.touch && mode === 'view') {
      // ★v2.5[1] 視点モードのタッチ: 家具の上で ~250ms 静止 → 掴んで移動開始 (モード切替不要)
      lpTarget = { id: hitId, clientX: e.clientX, clientY: e.clientY, pointerType: e.pointerType };
      lpTimer = setTimeout(function () {
        lpTimer = null;
        if (!downInfo || downInfo.moved || !lpTarget || drag) { lpTarget = null; return; }
        const it = workItems[lpTarget.id];
        const p = floorPoint(lpTarget);
        if (it && p) {
          if (lpTarget.id !== selectedItemId) select(lpTarget.id);
          drag = beginDrag(lpTarget.id, it, p);
          controls.enabled = false;
          downInfo.lp = true;
          flashSelHelper();   // 掴んだ瞬間の軽いハイライト
          toast('移動中: 指をずらして配置、離すと確定');
          if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
        }
        lpTarget = null;
      }, 250);
    }
  });
  el.addEventListener('pointermove', function (e) {
    // ★v2.5[4] タッチはドラッグ開始閾値 6px→12px (誤タップでカメラ微動→選択にならない問題)
    if (downInfo) {
      const th = downInfo.touch ? 12 : 6;
      if (Math.abs(e.clientX - downInfo.x) > th || Math.abs(e.clientY - downInfo.y) > th) {
        downInfo.moved = true;
        if (lpTimer && !drag) cancelLongPress();   // 指が動いたら長押し掴みは不成立
      }
    }
    moveDragTo(e);
  });
  const endDrag = function (e) {
    activePtrs = Math.max(0, activePtrs - 1);
    cancelLongPress();
    const wasLp = downInfo && downInfo.lp;
    if (drag) finishDrag();
    // 長押し掴みで離しただけ (moved=false) の時はタップ扱いにしない (引き出し誤開閉防止)
    if (downInfo && !downInfo.moved && !wasLp && e.type === 'pointerup') handleClick(e);
    downInfo = null;
  };
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}

// ★v2.3[9] 家具アイテム内の引き出しクリックプレート判定 (最前ヒットのメッシュ chain から drawerId を拾う)
function pickItemDrawer(e) {
  const meshes = Object.keys(furnMeshes).map(function (k) { return furnMeshes[k]; });
  const offs = pickOffsets(e);   // ★v2.5[3] タッチは引き出しプレートも判定拡大
  for (let oi = 0; oi < offs.length; oi++) {
    setNdc(e, offs[oi][0], offs[oi][1]);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(meshes, true);
    let near = null;   // 最前の可視ヒット +3cm 以内にプレートがあれば引き出しクリックとみなす
    for (let i = 0; i < hits.length; i++) {
      if (hits[i].object.visible === false) continue;
      if (near === null) near = hits[i].distance + 3;
      if (hits[i].distance > near) break;
      if (hits[i].object.userData.drawerId) return hits[i].object.userData.drawerId;
    }
  }
  return null;
}

function handleClick(e) {
  hideTooltip();
  const drId = pickItemDrawer(e);
  if (drId) { toggleDrawer(drId); return; }          // ★v2.3[9] KM504/エトナの引き出しクリック=開閉 (全体ビューでも可)
  if (currentRoom !== 'all') {
    const hitId = pickItem(e);
    if (hitId && workItems[hitId]) { select(hitId); return; }
  }
  const info = pickInfo(e);
  if (info && info.drawerId) { toggleDrawer(info.drawerId); return; }   // ★v2.3[9] キッチン引き出し
  if (info && info.doorId) { toggleDoor(info.doorId, info.panelIdx); return; }   // ★v2.2[8] ドアはクリック=開閉 ★v2.7 引違いはクリックしたパネル側が開く
  if (info) { showTooltip(e, info); return; }
  if (selectedItemId) deselect();
}

function showTooltip(e, ud) {
  const tt = document.getElementById('tooltip');
  let html = '';
  if (ud.kind === 'outlet') {
    const o = ud.info;
    const parts = [(o.caps || 2) + '口'];
    if (o.tv) parts.push('テレビ端子');
    if (o.lan) parts.push('LAN');
    html = '<div class="tt-title">🔌 コンセント No.' + o.no + '</div>' +
      '<div class="tt-body">' + parts.join(' + ') + '<br>' + esc(o.label || '') +
      '<br>高さ約' + (o.h || 25) + 'cm' + (o.est ? ' (位置は推定)' : '') + '</div>';
  } else {
    html = '<div class="tt-body">' + esc(typeof ud.info === 'string' ? ud.info : (ud.info && ud.info.label) || '') + '</div>';
  }
  tt.innerHTML = html;
  tt.style.display = 'block';
  const vp = document.getElementById('viewport').getBoundingClientRect();
  tt.style.left = Math.max(4, Math.min(e.clientX - vp.left + 10, vp.width - 270)) + 'px';
  tt.style.top = Math.max(4, Math.min(e.clientY - vp.top + 10, vp.height - 110)) + 'px';
}
function hideTooltip() {
  const tt = document.getElementById('tooltip');
  if (tt) tt.style.display = 'none';
}

// ═══════════════ モード / コンセント表示 ═══════════════
window.setMode = function (m) {
  mode = m;
  document.getElementById('modeViewBtn').classList.toggle('active', m === 'view');
  document.getElementById('modePlaceBtn').classList.toggle('active', m === 'place');
  if (controls) controls.enableRotate = (m === 'view');
  toast(m === 'view' ? '視点モード: ドラッグで回転 / 家具は長押しで掴んで移動' : '配置モード: ドラッグで選択中の家具を移動');
};
window.toggleOutlets = function () {
  outletsVisible = !outletsVisible;
  outletMeshes.forEach(function (m) { m.visible = outletsVisible; });
  document.getElementById('outletBtn').classList.toggle('active', outletsVisible);
  hideTooltip();
};

// ═══════════════ キーボード (PC): 矢印移動 / R回転 / Delete削除 / Esc ═══════════════
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    // 優先順: ツールチップ → モーダル → 家具シート → 選択解除(パネルも閉じる)
    const tt = document.getElementById('tooltip');
    if (tt && tt.style.display === 'block') { hideTooltip(); return; }
    if (document.getElementById('modalOverlay').classList.contains('active')) { closeModalFn(); return; }
    if (document.getElementById('furnSheet').classList.contains('open')) { closeFurnSheetFn(); return; }
    if (selectedItemId) { deselect(); return; }
    if (document.getElementById('itemSheet').classList.contains('open')) { closeItemSheetFn(); return; }
    return;
  }
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (currentRoom === 'all' || !selectedItemId) return;
  const it = workItems[selectedItemId];
  if (!it) return;
  if (e.key === 'r' || e.key === 'R') { window.rotateItem(); return; }
  if (e.key === 'Delete') { window.deleteItem(); return; }
  const step = e.shiftKey ? 10 : 1;
  let used = true;
  const px = it.x, pz = it.z;
  const kig = overlapState(selectedItemId, it);   // ★v2.2[6] 移動前から重なっている相手は免除 (スタック解消)
  if (e.key === 'ArrowUp') it.z -= step;
  else if (e.key === 'ArrowDown') it.z += step;
  else if (e.key === 'ArrowLeft') it.x -= step;
  else if (e.key === 'ArrowRight') it.x += step;
  else used = false;
  if (used) {
    e.preventDefault();
    clampItem(it);
    if (blockedAny(selectedItemId, it, kig)) { it.x = px; it.z = pz; return; }   // ★v1.9 家具+壁+設備めり込み防止
    if (isMattressItem(it)) {                                               // ★v2.0 キー移動でもベッド床板面/床へ追従
      const kb = bedUnder(selectedItemId, it);
      if (kb) it.y = bedFloorH(kb);
      else if (supportTopFor(selectedItemId, it) === null) it.y = 0;
    }
    const m = furnMeshes[selectedItemId];
    if (m) syncItemMesh(m, it);
    markDirty();
  }
});

// ═══════════════ 部屋タブ / ビュー切替 ═══════════════
function renderRoomTabs() {
  const el = document.getElementById('roomTabs');
  el.innerHTML = ROOMS_UI.map(function (r) {
    return '<button class="room-tab' + (currentRoom === r.key ? ' active' : '') + '" onclick="switchRoom(\'' + r.key + '\')">' + r.name + '</button>';
  }).join('');
}

// ★v1.8 dirtyGuard も native confirm() からアプリ内モーダルへ (コールバック方式)
function dirtyGuard(onOk, onCancel) {
  if (!dirty) { onOk(); return; }
  confirmModal('未保存の変更', '未保存の変更があります。破棄して続行しますか？', '破棄して続行', function () {
    dirty = false;
    updateSaveBtn();
    onOk();
  }, onCancel);
}

window.switchRoom = function (key) {
  if (key === currentRoom) return;
  dirtyGuard(function () {
    currentRoom = key;
    hideTooltip();
    closeFurnSheetFn();
    renderRoomTabs();
    applyRoomView();
  });
};

function applyRoomView() {
  const dk = currentRoom === 'all' ? null : dataKeyOf(currentRoom);
  setFocus(dk);
  if (currentRoom === 'all') { workItems = {}; dirty = false; }
  else loadWork();
  currentZone = null;          // ★v1.9 部屋切替でゾーン選択をリセット
  renderZoneChips();
  rebuildFurniture();
  renderPlanBar();
  document.getElementById('fab').classList.toggle('hidden', currentRoom === 'all');
  setHint(currentRoom === 'all'
    ? '全体ビュー: 各部屋の選択中案を合成表示 (編集は部屋タブから)'
    : (ROOM_LABEL[currentRoom] || '') + ' ｜ タップ=選択 / 長押し=家具を掴んで移動');
  window.setCamera(camPreset === 'eye' && currentRoom === 'all' ? 'iso' : camPreset);
}

// ═══════════════ 案 (プラン) 管理 ═══════════════
function loadWork() {
  const rk = currentRoom;
  const pid = selectedPlanId[rk];
  const plan = pid && plansData[rk] ? plansData[rk][pid] : null;
  workItems = plan && plan.items ? JSON.parse(JSON.stringify(plan.items)) : {};
  dirty = false;
}
function saveSelCache() {
  try { localStorage.setItem('nozaroom_selected', JSON.stringify(selectedPlanId)); } catch (e) {}
}
function cleanItem(it) {
  return {
    name: it.name || '家具', w: Number(it.w) || 10, d: Number(it.d) || 10, h: Number(it.h) || 10,
    x: Number(it.x) || 0, z: Number(it.z) || 0, y: Number(it.y) || 0, rotY: Number(it.rotY) || 0,
    color: it.color || '#b9a488', url: it.url || null, memo: it.memo || null, catalogId: it.catalogId || null,
    type: it.type || null,   // ★v1.8 パラメトリックモデル用 (未設定時は catalogId 経由で解決)
    colorName: it.colorName || null,   // ★v2.0 カラーバリエーション選択名 (既存データは undefined でもOK)
    floorH: (it.floorH === undefined || it.floorH === null || it.floorH === '') ? null : Number(it.floorH),   // ★v2.0 Aerus床面高 (null=既定32)
    mattress: it.mattress === false ? false : true   // ★v2.2 Aerusマットレス内蔵表示 (既定ON)
  };
}

function renderPlanBar() {
  const bar = document.getElementById('planBar');
  if (currentRoom === 'all') {
    bar.innerHTML = '<span class="plan-hint">🗂 全体ビュー: 各部屋の選択中の案を合成表示</span>';
    return;
  }
  const rk = currentRoom;
  const plans = plansData[rk] || {};
  const sel = selectedPlanId[rk];
  let opts = '';
  Object.keys(plans).forEach(function (id) {
    opts += '<option value="' + id + '"' + (id === sel ? ' selected' : '') + '>' + esc(plans[id].name || '案') + '</option>';
  });
  const has = !!opts;
  bar.innerHTML =
    '<select class="plan-select" id="planSelect" onchange="switchPlan(this.value)"' + (has ? '' : ' disabled') + '>' +
    (has ? opts : '<option>(案なし)</option>') + '</select>' +
    '<button class="plan-btn" onclick="newPlan()" title="新規案">＋</button>' +
    '<button class="plan-btn" onclick="duplicatePlan()" title="案を複製"' + (has ? '' : ' disabled') + '>⧉</button>' +
    '<button class="plan-btn" onclick="renamePlan()" title="名前変更"' + (has ? '' : ' disabled') + '>✎</button>' +
    '<button class="plan-btn" onclick="deletePlanUI()" title="案を削除"' + (has ? '' : ' disabled') + '>🗑</button>' +
    '<button class="plan-btn save' + (dirty ? '' : ' clean') + '" id="saveBtn" onclick="savePlan()">💾 保存' + (dirty ? ' ●' : '') + '</button>';
}

async function createPlanInternal(rk, name, items) {
  const data = { name: name, items: items || {}, createdBy: currentUser, createdAt: DBI.now() };
  const id = await DBI.createPlan(rk, data);
  (plansData[rk] = plansData[rk] || {})[id] = { name: name, items: JSON.parse(JSON.stringify(items || {})), createdBy: currentUser, createdAt: Date.now() };
  selectedPlanId[rk] = id;
  saveSelCache();
  return id;
}

window.switchPlan = function (pid) {
  dirtyGuard(function () {
    selectedPlanId[currentRoom] = pid;
    saveSelCache();
    loadWork();
    rebuildFurniture();
    renderPlanBar();
  }, function () { renderPlanBar(); });   // キャンセル時は select 表示を元に戻す
};

window.newPlan = function () {
  if (currentRoom === 'all') return;
  dirtyGuard(function () {
    const rk = currentRoom;
    const count = Object.keys(plansData[rk] || {}).length;
    promptModal('新しい案', '案の名前', '案' + (count + 1), async function (name) {
      await createPlanInternal(rk, name);
      loadWork();
      rebuildFurniture();
      renderPlanBar();
      toast('「' + name + '」を作成しました');
    });
  });
};

window.duplicatePlan = function () {
  if (currentRoom === 'all') return;
  const rk = currentRoom;
  const pid = selectedPlanId[rk];
  const plan = pid && plansData[rk] ? plansData[rk][pid] : null;
  if (!plan) return;
  const items = {};
  Object.keys(workItems).forEach(function (id) { items[id] = cleanItem(workItems[id]); });
  promptModal('案を複製', '新しい案の名前', (plan.name || '案') + 'のコピー', async function (name) {
    await createPlanInternal(rk, name, items);
    dirty = false;
    loadWork();
    rebuildFurniture();
    renderPlanBar();
    toast('「' + name + '」に複製しました');
  });
};

window.renamePlan = function () {
  if (currentRoom === 'all') return;
  const rk = currentRoom;
  const pid = selectedPlanId[rk];
  const plan = pid && plansData[rk] ? plansData[rk][pid] : null;
  if (!plan) return;
  promptModal('案の名前変更', '案の名前', plan.name || '', async function (name) {
    await DBI.updatePlan(rk, pid, { name: name, updatedBy: currentUser, updatedAt: DBI.now() });
    plan.name = name;
    renderPlanBar();
  });
};

window.deletePlanUI = function () {
  if (currentRoom === 'all') return;
  const rk = currentRoom;
  const pid = selectedPlanId[rk];
  const plan = pid && plansData[rk] ? plansData[rk][pid] : null;
  if (!plan) return;
  // ★v1.8 native confirm() → アプリ内モーダル
  confirmModal('案を削除', '案「' + (plan.name || '') + '」を削除しますか？この操作は取り消せません', '削除する', function () {
  DBI.deletePlan(rk, pid).then(function () {
    delete plansData[rk][pid];
    selectedPlanId[rk] = Object.keys(plansData[rk])[0] || null;
    saveSelCache();
    dirty = false;
    loadWork();
    rebuildFurniture();
    renderPlanBar();
    toast('削除しました');
  });
  });
};

window.savePlan = async function () {
  if (currentRoom === 'all') return;
  const rk = currentRoom;
  let pid = selectedPlanId[rk];
  if (!pid) pid = await createPlanInternal(rk, '案1');
  const items = {};
  Object.keys(workItems).forEach(function (id) { items[id] = cleanItem(workItems[id]); });
  try {
    await DBI.updatePlan(rk, pid, { items: items, updatedBy: currentUser, updatedAt: DBI.now() });
    plansData[rk][pid].items = JSON.parse(JSON.stringify(items));
    plansData[rk][pid].updatedBy = currentUser;
    plansData[rk][pid].updatedAt = Date.now();
    dirty = false;
    updateSaveBtn();
    toast('保存しました');
  } catch (err) {
    console.error(err);
    toast('保存に失敗しました: ' + (err && err.message));
  }
};

// 未保存変更の離脱警告
window.addEventListener('beforeunload', function (e) {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

// ═══════════════ 家具追加シート ═══════════════
window.openFurnSheet = function () {
  if (currentRoom === 'all') return;
  document.getElementById('furnBackdrop').classList.add('open');
  document.getElementById('furnSheet').classList.add('open');
  document.body.classList.add('modal-open');
  renderFurnBody();
  trapFocus(document.getElementById('furnSheet'));
};
function closeFurnSheetFn() {
  document.getElementById('furnBackdrop').classList.remove('open');
  document.getElementById('furnSheet').classList.remove('open');
  document.body.classList.remove('modal-open');
  releaseTrap();
}
window.closeFurnSheet = closeFurnSheetFn;
window.setFurnTab = function (t) {
  furnTab = t;
  document.getElementById('ftabCatalog').classList.toggle('active', t === 'catalog');
  document.getElementById('ftabPlaced').classList.toggle('active', t === 'placed');
  document.getElementById('ftabFree').classList.toggle('active', t === 'free');
  renderFurnBody();
};

function catRow(id, c) {
  return '<button class="cat-row" onclick="addFromCatalog(\'' + id + '\')">' +
    '<span class="cat-dot" style="background:' + esc(c.color || '#b9a488') + '"></span>' +
    '<span style="flex:1;min-width:0;"><div class="cat-name">' + esc(c.name) + '</div>' +
    (c.memo ? '<div class="cat-memo">' + esc(String(c.memo).slice(0, 42)) + '</div>' : '') + '</span>' +
    '<span class="cat-dims">' + c.w + '×' + c.d + '×' + c.h + '</span></button>';
}

function renderFurnBody() {
  const b = document.getElementById('furnBody');
  if (furnTab === 'catalog') {
    const rk = currentRoom;
    const ids = Object.keys(catalogData);
    if (!ids.length) {
      b.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🛋</div><div class="empty-state-text">カタログは空です</div></div>';
      return;
    }
    let html = '';
    const mine = ids.filter(function (id) { return catalogData[id].room === rk; });
    const others = ids.filter(function (id) { return catalogData[id].room !== rk; });
    if (mine.length) {
      html += '<div class="cat-section-title">📌 ' + (ROOM_LABEL[rk] || '') + ' 向け</div>';
      mine.forEach(function (id) { html += catRow(id, catalogData[id]); });
    }
    const byRoom = {};
    others.forEach(function (id) {
      const rm = catalogData[id].room || 'other';
      (byRoom[rm] = byRoom[rm] || []).push(id);
    });
    Object.keys(byRoom).forEach(function (rm) {
      html += '<div class="cat-section-title">' + esc(ROOM_LABEL[rm] || 'その他') + ' 向け</div>';
      byRoom[rm].forEach(function (id) { html += catRow(id, catalogData[id]); });
    });
    b.innerHTML = html;
  } else if (furnTab === 'placed') {
    const ids = Object.keys(workItems);
    if (!ids.length) {
      b.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">この案にはまだ家具がありません</div></div>';
      return;
    }
    let html = '';
    ids.forEach(function (id) {
      const it = workItems[id];
      html += '<button class="cat-row" onclick="selectFromList(\'' + id + '\')">' +
        '<span class="cat-dot" style="background:' + esc(it.color || '#b9a488') + '"></span>' +
        '<span class="cat-name">' + esc(it.name || '家具') + '</span>' +
        '<span class="cat-dims">' + it.w + '×' + it.d + '×' + it.h + '</span></button>';
    });
    b.innerHTML = html;
  } else {
    b.innerHTML =
      '<div class="form-group"><label class="form-label">名前</label><input class="form-input" id="ffName" placeholder="例: 本棚"></div>' +
      '<div class="form-row">' +
      '<div class="form-group"><label class="form-label">幅W (cm)</label><input class="form-input" id="ffW" type="number" inputmode="decimal" value="60"></div>' +
      '<div class="form-group"><label class="form-label">奥行D (cm)</label><input class="form-input" id="ffD" type="number" inputmode="decimal" value="40"></div>' +
      '<div class="form-group"><label class="form-label">高さH (cm)</label><input class="form-input" id="ffH" type="number" inputmode="decimal" value="90"></div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">色</label><input type="color" class="form-input" id="ffColor" value="#b9a488"></div>' +
      '<button class="btn-primary" style="width:100%;" onclick="addFreeItem()">＋ 部屋の中央に追加</button>';
  }
}

async function addItem(base, zone) {
  const rk = currentRoom;
  if (rk === 'all') return;
  if (!selectedPlanId[rk]) {
    await createPlanInternal(rk, '案1');
    renderPlanBar();
  }
  const bb = roomBBox[dataKeyOf(rk)];
  let sx = (bb.minX + bb.maxX) / 2, sz = (bb.minZ + bb.maxZ) / 2;
  // ★v2.1 zone付きカタログ商品はLDKで該当サブゾーン中央に出現 (findFreeSpot はゾーン中心起点)。
  //        zone無し商品・自由サイズは従来通り部屋中央、LDK以外の部屋では zone を無視
  if (rk === 'ldk' && zone) {
    const zn = (R.zones || []).find(function (q) { return q.room === 'ldk' && q.key === zone; });
    if (zn && zn.rect) { sx = zn.rect[0] + zn.rect[2] / 2; sz = zn.rect[1] + zn.rect[3] / 2; }
  }
  const it = Object.assign({ x: sx, z: sz, y: 0, rotY: 0 }, base);
  clampItem(it);
  if (!findFreeSpot(null, it)) toast('空きスペースが無いため重なって配置されました。移動してください');  // ★v1.8
  const id = genItemId();
  workItems[id] = it;
  itemMeshBuild(id, it);
  markDirty();
  select(id);
  // ★v2.5[6] 追加直後の導線: シートは閉じ済み・選択済み (peek+ハンドル表示)。掴み方をトースト案内
  toast('⊕ドラッグで移動 / 家具の長押しでも掴めます');
}

window.addFromCatalog = function (cid) {
  const c = catalogData[cid];
  if (!c) return;
  closeFurnSheetFn();
  // ★v2.0 デフォルト色に一致する colors エントリがあればカラー名も初期セット
  const cn = (c.colors || []).find(function (q) { return (q.hex || '').toLowerCase() === (c.color || '').toLowerCase(); });
  addItem({ name: c.name, w: c.w, d: c.d, h: c.h, color: c.color || '#b9a488', url: c.url || null, memo: c.memo || null,
            catalogId: cid, type: c.type || null, colorName: cn ? cn.name : null,
            baseW: c.baseW || null, baseD: c.baseD || null }, c.zone || null);   // ★v2.1 zone=LDK初期配置先 ★v2.8 baseW/baseD=設置面(脚間・洗濯機パン判定用)
};
window.selectFromList = function (id) {
  closeFurnSheetFn();
  select(id);
};
window.addFreeItem = function () {
  const name = document.getElementById('ffName').value.trim() || '家具';
  const w = Number(document.getElementById('ffW').value);
  const d = Number(document.getElementById('ffD').value);
  const h = Number(document.getElementById('ffH').value);
  if (!(w > 0 && d > 0 && h > 0)) { toast('寸法は正の数で入力してください'); return; }
  const color = document.getElementById('ffColor').value || '#b9a488';
  closeFurnSheetFn();
  addItem({ name: name, w: w, d: d, h: h, color: color });
};

// ═══════════════ 認証 / 起動 ═══════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}
window.selectName = function (name) {
  currentUser = name;
  localStorage.setItem('aritomo_user', name);
  boot();
};

let booted = false;
async function boot() {
  if (booted) return;
  booted = true;
  showScreen('appScreen');
  document.getElementById('userBadge').textContent = currentUser + (DEBUG ? ' (debug)' : '');
  try {
    const all = await DBI.loadAll();
    plansData = all.plans || {};
    catalogData = all.catalog || {};
    if (!Object.keys(catalogData).length && CATALOG_SEED && CATALOG_SEED.items) {
      // 初回のみカタログシードを書き込み (既にあればスキップ)
      const items = CATALOG_SEED.items.map(function (it) {
        return Object.assign({}, it, { createdBy: 'seed', createdAt: DBI.now() });
      });
      catalogData = (await DBI.seedCatalog(items)) || {};
    } else if (CATALOG_SEED && CATALOG_SEED.items) {
      // ★v1.9 差分シード: 既存カタログに無い新商品 (model/name 単位) だけ追記 (v1.2 追加のモニター/アーム)
      const have = {};
      Object.keys(catalogData).forEach(function (id) { have[catalogData[id].model || catalogData[id].name] = 1; });
      const missing = CATALOG_SEED.items.filter(function (it) { return !have[it.model || it.name]; });
      if (missing.length) {
        const items = missing.map(function (it) {
          return Object.assign({}, it, { createdBy: 'seed', createdAt: DBI.now() });
        });
        const added = (await DBI.seedCatalog(items)) || {};
        Object.keys(added).forEach(function (id) { catalogData[id] = added[id]; });
      }
    }
    // ★v2.0 旧シード由来の既存カタログに colors をシードから補完 (メモリ内のみ・DB書込なし。
    //        カラーバリエーションは静的設定なので毎起動マージで十分) ★v2.1 zone も同様に補完
    if (CATALOG_SEED && CATALOG_SEED.items) {
      const seedByKey = {};
      CATALOG_SEED.items.forEach(function (it) { seedByKey[it.model || it.name] = it; });
      Object.keys(catalogData).forEach(function (id) {
        const c = catalogData[id];
        const s = seedByKey[c.model || c.name];
        if (s && s.colors && (!c.colors || c.colors.length !== s.colors.length)) {
          c.colors = s.colors;                 // ★v3.2 シード側のカラー追加/変更も追従 (colors は静的設定なので毎起動同期)
          if (s.color) c.color = s.color;      // ★v3.2 カラー展開が変わった商品はデフォルト色もシードに同期 (MK02 合皮アイボリー等)
        }
        // ★v3.6 シード由来アイテムの memo (公式スペック等の静的情報) もシードに追従させる。
        //        ユーザーが後から追加/編集したもの (createdBy!=='seed') は触らない。MK02 の型番訂正 (1150181→1150183) 反映用
        if (s && s.memo && c.createdBy === 'seed' && c.memo !== s.memo) c.memo = s.memo;
        if (s && s.zone && !c.zone) c.zone = s.zone;   // ★v2.1 LDKサブゾーン初期配置先
        if (s && s.baseW && !c.baseW) { c.baseW = s.baseW; c.baseD = s.baseD; }   // ★v2.8 設置面(脚間)寸法
      });
    }
  } catch (err) {
    console.error('データ読み込みに失敗:', err);
    alert('データの読み込みに失敗しました: ' + (err && err.message));
  }
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem('nozaroom_selected') || '{}'); } catch (e) {}
  EDITABLE_ROOMS.forEach(function (rk) {
    const plans = plansData[rk] || {};
    selectedPlanId[rk] = (cache[rk] && plans[cache[rk]]) ? cache[rk] : (Object.keys(plans)[0] || null);
  });
  initThree();
  renderRoomTabs();
  applyRoomView();
}

if (DEBUG) {
  if (!currentUser) currentUser = 'デバッグ';
  boot();
} else if (auth) {
  auth.onAuthStateChanged(function (user) {
    if (user) {
      if (currentUser) boot();
      else showScreen('nameScreen');
    } else {
      showScreen('authScreen');
    }
  });
} else {
  showScreen('authScreen');
}
</script>
